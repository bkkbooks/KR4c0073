body:
  text: 閑適時序風月六十二首荘居即事休看小字大書名向日持經眼却明時過無心求冨貴身閑不夢見公卿因尋岳寺葷辛㫁自到王城床新睡覺􅒾風半夜鶴来聲親仁里居三年賃舎親仁里寂寞何曽似在城飲酒自縁防冷病一作氣尋人多是為閑行軒車無路通一作姚少監詩集卷第六閑適時序風月六十二首荘居即事休看小字大書名向日持經眼却明時過無心求冨貴身閑不夢見公卿因尋岳寺葷辛㫁自到王城床新睡覺􅒾風半夜鶴来聲親仁里居三年賃舎親仁里寂寞何曽似在城飲酒自縁防冷病一作氣尋人多是為閑行軒車無路通一作過門巷親友一作故囙詩道姓名自别一作下青山歸未得羡君長聴石泉聲荘居野行客行野田間比屋皆閉户借問屋中人盡去作啇賈官家不税啇税農服作苦居人盡東西道路侵壠畆採玉上山顛探珠入水府邊兵索衣食此物同泥土古来一人耕三人食猶飢如今千萬家無一把鋤犂我倉常空虚我田生蒺䔧上天不雨粟何由活烝黎春日閑居居止日蕭條庭前唯藥苗身閑眠自乆眼差視還遥簷燕酬鶯語隣花雜絮飄客来無酒飲掻首擲空瓢獨居深閉柴門長一作多不出功夫自課少閑時翻音免問他人字覆局一作勢何勞對手棊生許如雲無㝎所窮愁似影巧一作每相随到頭歸向一作去青山是塵路茫茫𣣔告誰早春閑居寂寞日何為貧一作間居春色遅驚風起庭雪寒雨長簷澌強飲區一作樽中事一作酒嘲山丗外詩此生仍且在難與老相離原上新居秋来梨果熟行哭小兒飢鄰冨雞長徃荘一作家貧客漸稀借牛耕地晚賣樹納錢遅牆下當官道依前夹竹籬將歸山野人慣厺山中住自到城来悶不勝宫樹蟬聲多却樂侯門月色少扵燈飢来唯擬重餐藥歸去還應只別僧聞道舊溪苑屋畔春風新上數枝藤山中述懐為客乆未歸寒山獨掩扉曉来山鳥散雨過杏花稀天逺雲空積溪深水自㣲此情對春色盡縂欲忘機偶然書懐十年通藉入金門自媿名微枉搢紳錬得升砂疑不食從兹白髪日一作自相親家山迢遞歸無路盃酒稀踈病到一作在身漢有馮唐唐有我老為郎吏更何人客舎有懐旅人無事喜終日一作夜思悠悠逢酒嫌盃淺尋書怕字稠貧来許錢聖夢覺見身愁寂寞中林下飢鷹望到秋及第後夜中書事夜睡常驚起春光屬野夫新銜添一字舊友遜前途喜過還疑夢狂来不似儒愛花持燭㸔憶酒犯街沽天上名應㝎人間盛更無報㤙丞相閤何啻殺㣲軀偶題年年九陌看春還舊隠空勞夢寐間遅日逍遙芸艸長聖朝清净諌臣一作書閑偶逢逰客同傾酒自有前騶恥見山道侣書来相責誚朝朝欲報作一作又何顔感時憶㫺未出身索寞無精神逢人話天命自賤如埃塵君今纔出身䬃爽鞍馬春逢人話天命自重如千鈞信渉名利道舉動皆䘮真君今自丗情何况天下人憶山閑䖏無人到乖踈稱野情日髙掻首起林下散衣行泉引窗前過雲㸔石鏬生別来愁𣣔老虚負出山名客逰旅懐客行無㝎止終日路𡵨閒馬為賖来貴僮囙借得頑詩書愁觸雨店舍喜逢山舊業嵩陽下三年未得還迎春半年㽞辭待花開曉去迎春夜始廽風暖慢行尋曲水天晴逺望立髙䑓亦知無䖏將詩請唯得終朝把酒催今日栁條全弄色逰人相伴㸔春来逰春十二首正月一日後尋春更不眠自知還近僻衆說過扵顛㸔水寕依路登山欲到天悠悠芳思起多是晚風前卑官長少事僻縣又無城未曉衝寒起迎春忍病行樹枝風棹軟菜甲土浮輕好個林間鵲今朝是喜聲詩酒相牽引朝朝思不窮苔痕雪水裏春色竹烟中迎雨縁池草摧花倚樹風書非名利事爱此少人同塵中主印吏誰遣有髙情趂暖簷前坐尋芳樹底行土融凝墅色氷敗滿池聲漸覺春相泥朝来睡不輕踈頑無異事随例但添年舊暦蔵深箧新衣薄絮綿暖風渾酒色晴日暢琴絃同伴無辭困逰春貴在先㸔春長不足豈更覺身勞寺裡花枝净山中水色髙嫩一作懶雲輕似絮新艸細如毛併起詩人思還應費筆毫悠悠小縣吏顦顇入新年逺思遭詩惱閑情𬒳酒牽戀花林下飲爱艸野中眠踈懶今成性誰人肯更憐䖏䖏春光遍逰人亦不稀向陽傾冷酒㸔影試一作着新衣嫩樹行移長幽禽語旋飛同来皆去盡衝夜獨呤一作行歸朝朝看春色春色似相憐酒醒鶯啼裏詩成蝶舞前摘花盈手露折竹滿庭烟親故多相笑踈狂似少年卑官還不悪行止得逍遙晴野花侵路春陂水上橋塵埃生暖色藥艸長新苗看却烟光散狂風䖏䖏飄身𬒳春光引經時更不㱕嚼花香滿口書竹粉粘衣弄日鶯狂語迎風蝶倒飛自知踈懶性得事亦應稀曉脱青衫出閑行氣味長一瓶春酒色數頃野花香朝客聞應羡山僧見亦一作似狂不将童僕去恐謂一作為損風光賞春閑人祗是爱春光迎得春来喜欲狂買酒怕遅令走馬看花嫌逺自移床嬌鶯語足方離樹戯蝶飛髙始過墙顛倒酔眠三數日人間百事不􅋠量春日即事春来眠不得誰復念生涯夜聴四隣楽朝尋九陌花輕烟浮草色㣲雨濯年華乞假非関病朝衣在酒家春日江次㙒歩出苑齋閑行坐石臺乆悲郷路逺猶喜杏花開鷗鷺皆飛去帆樯何䖏来囙凝千里目落日尚徘徊楊州春詞三首廣陵寒食天無露復無烟暖日凝花栁春風散管絃園林多是宅車馬少扵船莫喚逰人住逰人困不眠滿郭是春光街衢上亦香竹風輕履舄花露膩衣裳谷鳥鳴還艶山夫到亦狂可憐逰賞地煬帝國傾亾江北烟光衮淮南勝事多市廛持燭入隣里漾船過有地惟栽竹無家不飬鵝春風蕩城郭滿耳是笙歌寒食二首今朝一百五出户雨𥘉晴舞爱雙飛蝶歌聞百囀鶯江深青艸㟁花滿白雲城爲政多孱懦應無酷吏名出城煙火少况復是今朝閑坐将誰語臨觴只自謡堦前春蘚偏衣上落花飄伎楽州人戯使君心寂寥暮春書事窮巷少芳菲蒼苔一徑㣲酒醒聞客別年長送春歸宿願眠雲嶠浮名繋鏁闈未回丞相庇難得脱一作觧朝衣春晚雨中寂寂春将老門人強自歡迎風鶯語澁帶雨蝶飛難傍砌木𥘉長眠花景漸䦨􅎔軒􅊭目望情思若為寛送春昨吟一作迎今復送来晚去逡廵芳盡空繁樹愁多獨病身静思傾酒懶閑望上樓頻為向春風道明年早報春別春㽞春不得𬒳春欺春若無情遣泥誰寂寞自疑生冷病凄凉還似別親知随風未辨歸何䖏澆酒唯求住少時一去近當三百日徔朝至夜是相思夏夜閑齋深夜静獨坐又閑行宻樹月籠影踈籬水隔聲㫁猨時呌谷棲鳥每摇檉寂寞求名士誰知此夕情秋日有懐秋来不復眠但覺思悠然菊色欲經露蟲聲漸替蝉詩情生酒裏心事在山邊舊里無囙到􅒾風又一年秋夕遣懐昨宵白露下秋氣滿山城風勁衣巾脆空虚筆墨輕臨書愛眞跡避酒怕狂名秪擬随糜鹿悠悠過一生秋中夜坐踈散永無事不眠常夜分月中松露滴風引鶴秋日有懐秋来不復眠但覺思悠然菊色欲經露蟲聲漸替蝉詩情生酒裏心事在山邊舊里無囙到􅒾風又一年秋夕遣懐昨宵白露下秋氣滿山城風勁衣巾脆空虚筆墨輕臨書愛眞跡避酒怕狂名秪擬随糜鹿悠悠過一生秋中夜坐踈散永無事不眠常夜分月中松露滴風引鶴同聞同衛尉崔少卿九月六日飲酒熟菊還芳花漂盞亦香與君先一酔舉世待重陽風色𥘉晴利蟲聲向晚長此時如不飲心事亦應傷九日憶硯一作峴山舊居帝里閑人少誰同把酒杯硯山籬下菊今日㡬枝開曉角驚眠𧺫秋風引病来長年歸思切更值鴈聲催秋晚江次蕭蕭晚景寒獨立望江壖沙渚㡬行鴈風灣一隻船落霞澄返照孤嶼隔微煙極目思無盡鄊心到眼前除夜二首衰殘㱕未遂寂寞此宵情舊國當千里新年隔數更寒猶近北峭風漸向東生誰見一作想長安陌晨鍾度火城慇懃惜此夜此夜住逡廵燭盡年還別雞鳴老更新儺聲方去疫酒色已迎春明日持盃䖏誰為最後人晦日送窮三首年年到此日􅅹酒拜街中萬户千門看無人不送窮送窮窮不去相泥欲何為今日官家宅淹㽞又㡬時古人皆恨別此別恨消䰟只是空相送年年不出門詠雲靄靄紛紛不可窮戞笙歌䖏盡随龍来依銀漢一千里㱕傍巫山十二峯呈瑞每聞開䴡色避風仍見挂喬松憐君翠染雙蝉鬢鏡裏朝朝近玉容詠雪愁雲殘獵下陽臺混却乹坤六出開與月交光呈瑞色共花争艶傍寒梅飛随郢客歌聲逺散逐宫娥舞䄂廽其那知音不相見剡溪乗興為君来郡中對雪霏㣲著草樹漸布與堦􅊭逺近如空色飄颺無落聲飛鵶疑翅重去馬覺蹄輕遙想故山下樵夫應滯行對月銀輪玉兎向東流瑩浄三更正好逰一片黒雲何䖏起皂羅籠却水精毬八月十五夜㸔月亭亭千萬里三五復秋中此夕光應絶常時思不同九霄㣲有露四海静無風惆悵逡廵別誰能㸔碧空賦月華臨静夜長空埃壒滅皎皎月華臨色正秋將半灮鮮夜自深九霄晴更徹四㙒氣難侵静照遥山出孤朙列宿沉髙人應不寐驚鵲復何心漏盡東方曉佳期何䖏尋酬任疇恊律夏中苦雨見寄銀漢波瀾溢經旬雨未休細聴冝隔牗逺望憶髙樓風急飄還㫁雲低落更稠走童驚掣電飢鳥啄浮漚絲網張空際珠䋲續瓦溝青蛙多入戸潢潦欲勝舟雷怒疑山破池渾似土流灰人漫禳厭水馬恣沉浮廣陌應翻浪貧居恐作湫陽精蔵不耀隂氣盛難收逺色重林暮繁聲四壁秋望晴思見日防冷𣣔披裘枕潤眠還懶車羸出轉憂散空烟漠漠迸􅘇竹修修樹暗蝉吟咽巢傾燕語愁琴書凉簟净燈燭夜窗幽天下那能向龍邊豈易求濕煙凝竈額荒艸覆牆頭酒思凄方罷詩情耿始抽下床先仗屐汲井恐飄甌危坐徒相憶佳期未有由勞君寄新什終日不能酬和座主相公雨中作清氣潤華屋東風吹雨匀花低驚艶重竹浄覺聲真山際凝如霧雲中散似塵蕭蕭下碧落點點救生民緩洒雷霆細微沾瓦䃯新詩成難継和造化筆通神惡神行雨面神扇簸悪神行汹湧挨排白霧生風撃水凹波撲凸雨漴山口地嵌坑龍噴黒氣翻騰滚鬼掣紅光劃揁哮吼忽雷聲掲石滿天啾唧閙轟轟姚少監詩集卷第六
