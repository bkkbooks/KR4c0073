body:
  text: 間適時序風月六十二首莊居即事休看小字大書名向日持經眼却明時過無心求冨貴身間不夢見公卿因尋嶽寺葷辛斷自到王城床新睡覺􅒾風半夜鶴來聲親仁里居三年賃舍親仁里寂寞何曽似在城飲酒自緣防冷病一作氣尋人多是為間行軒車無路通一作姚少監詩集卷第六間適時序風月六十二首莊居即事休看小字大書名向日持經眼却明時過無心求冨貴身間不夢見公卿因尋嶽寺葷辛斷自到王城床新睡覺􅒾風半夜鶴來聲親仁里居三年賃舍親仁里寂寞何曽似在城飲酒自緣防冷病一作氣尋人多是為間行軒車無路通一作過門巷親友一作故因詩道姓名自别一作下青山歸未得羡君長聽石泉聲莊居野行客行野田間比屋皆閉户借問屋中人盡去作啇賈官家不稅啇稅農服作苦居人盡東西道路侵壠畝採玉上山顛探珠入水府邊兵索衣食此物同泥土古來一人耕三人食猶飢如今千萬家無一把鋤犂我倉常空虛我田生蒺䔧上天不雨粟何由活蒸黎春日間居居止日蕭條庭前唯藥苗身間眠自久眼差視還遙簷燕酬鶯語鄰花雜絮飄客來無酒飲搔首擲空瓢獨居深閉柴門長一作多不出功夫自課少間時翻音免問他人字覆局一作勢何勞對手棊生許如雲無㝎所窮愁似影巧一作每相隨到頭歸向一作去青山是塵路茫茫𣣔告誰早春間居寂寞日何為貧一作間居春色遲驚風起庭雪寒雨長簷澌強飲區一作樽中事一作酒嘲山丗外詩此生仍且在難與老相離原上新居秋來梨果熟行哭小兒飢鄰冨雞長往莊一作家貧客漸稀借牛耕地晚賣樹納錢遲牆下當官道依前夾竹籬將歸山野人慣厺山中住自到城來悶不勝宫樹蟬聲多却樂侯門月色少于燈飢來唯擬重餐藥歸去還應只別僧聞道舊溪苑屋畔春風新上數枝藤山中述懷為客久未歸寒山獨掩扉曉來山鳥散雨過杏花稀天逺雲空積溪深水自微此情對春色盡總欲忘機偶然書懷十年通藉入金門自愧名微枉搢紳錬得升砂疑不食從兹白髮日一作自相親家山迢遞歸無路杯酒稀踈病到一作在身漢有馮唐唐有我老為郎吏更何人客舍有懷旅人無事喜終日一作夜思悠悠逢酒嫌杯淺尋書怕字稠貧來許錢聖夢覺見身愁寂寞中林下飢鷹望到秋及第後夜中書事夜睡常驚起春光屬野夫新銜添一字舊友遜前途喜過還疑夢狂來不似儒愛花持燭看憶酒犯街沽天上名應㝎人間盛更無報恩丞相閣何啻殺微軀偶題年年九陌看春還舊隱空勞夢寐間遲日逍遙藝草長聖朝清淨諌臣一作書間偶逢逰客同傾酒自有前騶恥見山道侣書來相責誚朝朝欲報作一作又何顔感時憶昔未出身索寞無精神逢人話天命自賤如埃塵君今才出身颯爽鞍馬春逢人話天命自重如千鈞信涉名利道舉動皆喪真君今自丗情何况天下人憶山間處無人到乖踈稱野情日髙搔首起林下散衣行泉引窗前過雲看石鏬生別來愁𣣔老虛負出山名客逰旅懷客行無㝎止終日路𡵨間馬為賖來貴僮因借得頑詩書愁觸雨店舍喜逢山舊業嵩陽下三年未得還迎春半年留辭待花開曉去迎春夜始廽風暖慢行尋曲水天晴逺望立髙臺亦知無處將詩請唯得終朝把酒催今日栁條全弄色逰人相伴看春來逰春十二首正月一日後尋春更不眠自知還近僻衆説過于顛看水寧依路登山欲到天悠悠芳思起多是晚風前卑官長少事僻縣又無城未曉衝寒起迎春忍病行樹枝風棹軟菜甲土浮輕好個林間鵲今朝是喜聲詩酒相牽引朝朝思不窮苔痕雪水裏春色竹煙中迎雨緣池草摧花倚樹風書非名利事愛此少人同塵中主印吏誰遣有髙情趂暖簷前坐尋芳樹底行土融凝墅色氷敗滿池聲漸覺春相泥朝來睡不輕踈頑無異事隨例但添年舊曆藏深篋新衣薄絮綿暖風渾酒色晴日暢琴絃同伴無辭困逰春貴在先看春長不足豈更覺身勞寺裡花枝淨山中水色髙嫩一作懶雲輕似絮新草細如毛併起詩人思還應費筆毫悠悠小縣吏憔悴入新年逺思遭詩惱間情𬒳酒牽戀花林下飲愛草野中眠踈懶今成性誰人肯更憐處處春光遍逰人亦不稀向陽傾冷酒看影試一作著新衣嫩樹行移長幽禽語旋飛同來皆去盡衝夜獨呤一作行歸朝朝看春色春色似相憐酒醒鶯啼裏詩成蝶舞前摘花盈手露折竹滿庭煙親故多相笑踈狂似少年卑官還不惡行止得逍遙晴野花侵路春陂水上橋塵埃生暖色藥草長新苗看却煙光散狂風處處飄身𬒳春光引經時更不歸嚼花香滿口書竹粉粘衣弄日鶯狂語迎風蝶倒飛自知踈懶性得事亦應稀曉脫青衫出間行氣味長一瓶春酒色數頃野花香朝客聞應羡山僧見亦一作似狂不將童僕去恐謂一作為損風光賞春間人祗是愛春光迎得春來喜欲狂買酒怕遲令走馬看花嫌逺自移床嬌鶯語足方離樹戲蝶飛髙始過墻顛倒醉眠三數日人間百事不􅋠量春日即事春來眠不得誰復念生涯夜聽四鄰樂朝尋九陌花輕煙浮草色微雨濯年華乞假非關病朝衣在酒家春日江次野步出苑齋間行坐石臺久悲鄉路逺猶喜杏花開鷗鷺皆飛去帆檣何處來因凝千里目落日尚徘徊楊州春詞三首廣陵寒食天無露復無煙暖日凝花栁春風散管絃園林多是宅車馬少于船莫喚逰人住逰人困不眠滿郭是春光街衢上亦香竹風輕履舄花露膩衣裳谷鳥鳴還艷山夫到亦狂可憐逰賞地煬帝國傾亡江北煙光衮淮南勝事多市廛持燭入鄰里漾船過有地惟栽竹無家不飬鵝春風蕩城郭滿耳是笙歌寒食二首今朝一百五出户雨𥘉晴舞愛雙飛蝶歌聞百囀鶯江深青草岸花滿白雲城為政多孱懦應無酷吏名出城煙火少况復是今朝間坐將誰語臨觴只自謡階前春蘚偏衣上落花飄伎樂州人戲使君心寂寥暮春書事窮巷少芳菲蒼苔一徑微酒醒聞客別年長送春歸宿願眠雲嶠浮名繫鎖闈未回丞相庇難得脫一作解朝衣春晚雨中寂寂春將老門人強自歡迎風鶯語澀帶雨蝶飛難傍砌木𥘉長眠花景漸闌􅎔軒􅊭目望情思若為寬送春昨吟一作迎今復送來晚去逡巡芳盡空繁樹愁多獨病身靜思傾酒懶間望上樓頻為向春風道明年早報春別春留春不得𬒳春欺春若無情遣泥誰寂寞自疑生冷病凄涼還似別親知隨風未辨歸何處澆酒唯求住少時一去近當三百日徔朝至夜是相思夏夜間齋深夜靜獨坐又間行密樹月籠影踈籬水隔聲斷猿時呌谷棲鳥每搖柳寂寞求名士誰知此夕情秋日有懷秋來不復眠但覺思悠然菊色欲經露蟲聲漸替蟬詩情生酒裏心事在山邊舊里無因到􅒾風又一年秋夕遣懷昨宵白露下秋氣滿山城風徑衣巾脆空虛筆墨輕臨書愛真迹避酒怕狂名秪擬隨糜鹿悠悠過一生秋中夜坐踈散永無事不眠常夜分月中松露滴風引鶴秋日有懷秋來不復眠但覺思悠然菊色欲經露蟲聲漸替蟬詩情生酒裏心事在山邊舊里無因到􅒾風又一年秋夕遣懷昨宵白露下秋氣滿山城風徑衣巾脆空虛筆墨輕臨書愛真迹避酒怕狂名秪擬隨糜鹿悠悠過一生秋中夜坐踈散永無事不眠常夜分月中松露滴風引鶴同聞同衛尉崔少卿九月六日飲酒熟菊還芳花漂盞亦香與君先一醉舉世待重陽風色𥘉晴利蟲聲向晚長此時如不飲心事亦應傷九日憶硯一作峴山舊居帝里間人少誰同把酒杯硯山籬下菊今日幾枝開曉角驚眠起秋風引病來長年歸思切更值鴈聲催秋晚江次蕭蕭晚景寒獨立望江壖沙渚幾行鴈風灣一隻船落霞澄返照孤嶼隔微煙極目思無盡鄊心到眼前除夜二首衰殘歸未遂寂寞此宵情舊國當千里新年隔數更寒猶近北峭風漸向東生誰見一作想長安陌晨鍾度火城殷勤惜此夜此夜住逡巡燭盡年還別雞鳴老更新儺聲方去疫酒色已迎春明日持杯處誰為最後人晦日送窮三首年年到此日􅅹酒拜街中萬户千門看無人不送窮送窮窮不去相泥欲何為今日官家宅淹留又幾時古人皆恨別此別恨消魂只是空相送年年不出門詠雲靄靄紛紛不可窮戞笙歌處盡隨龍來依銀漢一千里歸傍巫山十二峯呈瑞每聞開麗色避風仍見挂喬松憐君翠染雙蟬鬢鏡裏朝朝近玉容詠雪愁雲殘獵下陽臺混却乾坤六出開與月交光呈瑞色共花爭艷傍寒梅飛隨郢客歌聲逺散逐宫娥舞袖廽其那知音不相見剡溪乘興為君來郡中對雪霏微著草樹漸布與階􅊭逺近如空色飄揚無落聲飛鴉疑翅重去馬覺蹄輕遙想故山下樵夫應滯行對月銀輪玉兔向東流瑩淨三更正好逰一片黑雲何處起皂羅籠却水精毬八月十五夜看月亭亭千萬里三五復秋中此夕光應絶常時思不同九霄微有露四海靜無風惆悵逡巡別誰能看碧空賦月華臨靜夜長空埃壒滅皎皎月華臨色正秋將半灮鮮夜自深九霄晴更徹四野氣難侵靜照遙山出孤明列宿沉髙人應不寐驚鵲復何心漏盡東方曉佳期何處尋酬任疇協律夏中苦雨見寄銀漢波瀾溢經旬雨未休細聽冝隔牗逺望憶髙樓風急飄還斷雲低落更稠走童驚掣電飢鳥啄浮漚絲網張空際珠繩續瓦溝青蛙多入戶潢潦欲勝舟雷怒疑山破池渾似土流灰人漫禳厭水馬恣沉浮廣陌應翻浪貧居恐作湫陽精藏不耀隂氣盛難收逺色重林暮繁聲四壁秋望晴思見日防冷𣣔披裘枕潤眠還懶車羸出轉憂散空煙漠漠迸􅘇竹修修樹暗蟬吟咽巢傾燕語愁琴書涼簟淨燈燭夜窗幽天下那能向龍邊豈易求濕煙凝竈額荒草覆牆頭酒思凄方罷詩情耿始抽下床先仗屐汲井恐飄甌危坐徒相憶佳期未有由勞君寄新什終日不能酬和座主相公雨中作清氣潤華屋東風吹雨勻花低驚艷重竹淨覺聲真山際凝如霧雲中散似塵蕭蕭下碧落點點救生民緩灑雷霆細微沾瓦䃯新詩成難繼和造化筆通神惡神行雨面神扇簸惡神行洶湧挨排白霧生風擊水凹波撲凸雨漴山口地嵌坑龍噴黑氣翻騰滚鬼掣紅光劃揁哮吼忽雷聲揭石滿天啾唧閙轟轟姚少監詩集卷第六
