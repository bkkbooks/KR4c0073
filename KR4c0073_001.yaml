front:
  text: 姚少監詩集卷第一
  hash: sha256:79a6730d29d3fcd26c50bf986bfbe345d20a84af7b55afceb13ac95d7f5aba82
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_001-1a}
body:
  text: 送別上五十首送狄尚書鎮太原授鉞儒生貴傾朝赴餞筵麾幢官在省禮樂將臨邊代馬龍相雜汾河海暗連逺戎移帳幕髙鳥避旌旃天下屯兵處皇威破虜年防秋嫌壘近入塞必身先中外恩重疊科名歲接連散材無所用老向瑣闈眠送楊尚書祭西嶽報功嚴祀典寵詔下明庭酒氣飄林嶺香煙入杳冥樂清三奏備詞直百神聽衣拂雲霞濕詩通水石靈何因逐騶騎暫得到巖扄送李侍御過夏州酬恩不顧名走馬覺身輕迢遞河邊路蒼茫塞上城砂寒無宿鴈虜近少間兵飲罷揮鞭去旁人意氣生送李起居赴池州天子念疲民分憂輟侍臣紅旗髙起熖緑野靜無塵闕下親知别江南惠化新朝昏即千里且願話逡巡送劉詹事赴夀州殷勤莫遽起四坐悉同袍世上詩難得林中酒更髙隋隄傍楊柳楚驛在波濤別後書頻寄無辭費筆毫送裴大夫赴亳州杭人遮道路垂泣浙江前譙國迎舟艦行歌汴水邊周旋君量逺交代我才偏寒日嚴旌戟晴風出管絃一杯誠淡薄四坐願留連異政承殊澤應為天下先送徐州韋僅行軍餞幕儼征軒行軍歸大藩山程度幽谷水驛到夷門曉日詩情逺春風酒色渾逡巡何足貴所貴盡殘樽送劉禹錫郎中赴蘇州二首七言三十年來天下名㗸恩東守闔閭城𥘉經咸谷眠山驛漸入梁園問水程霽日滿江寒浪靜春風繞郭白蘋生虎丘野寺吳中少誰伴吟詩月裏行又州城全是故吳宮香徑難尋古蘚中雲水計程千里逺軒車送別九衢空鶴聲髙下聽無盡潮色朝昏望不同太守吟詩人自理小齋間卧白蘋風送賈謨赴共城營田上國羞長一作平選戎裝貴所從山田依法種兵食及時供水氣詩書軟嵐煙筆硯濃幾時無事優相見得從容送裴宰君見説為官處煙霞思不窮夜猿啼戶外瀑水落厨中名藥人難識仙山路易通還應施靜化誰復與君同送顧非熊下第歸越失意尋歸路親知不復過家山去城逺日月在船多楚塞數逢鴈浙江長有波秋風別鄉去還聽鹿鳴歌送雍陶逰蜀春色三千里愁人意未開木梢穿棧出雨勢隔江來荒館因花宿深山羡客回相如何物在應只有琴臺勢一作氣送崔約下第歸楊州滿座詩人吟送酒離城此會亦應稀春風下第時稱屈秋卷呈親自束歸日晚山花當馬落天隂水鳥傍船飛江邊道路多苔蘚塵土無由得上衣送李廓侍御赴西川行營不道弓箭字罷官唯醉眠何人薦籌䇿走馬逐旌旃陳變孤虛外功成語笑前從今嶲州路無復有烽煙送楊尚書赴東川却榖詩書將㗸恩赴梓州繞身垂印綬護馬執戈矛劔閣和銘峭巴江帶字流從來皆惜別此別復何愁送邢郎中赴太原山將得良䇿恩威作長城如今并州北不見有胡兵晉野雨𥘉足汾河波亦清所從古無比意氣送君行送裴中丞赴華州我夢何曾應看君渡滻川自無仙掌分非是聖心偏去年曾夢除華州刺史故此敘述而巳徑草多生藥庭花半落泉人間有此郡況在鳯城邊送徐貟外赴河中從事赤府從軍羡儒衣結束輕涼飊下山寺曉浪滿關城間坐饒詩景髙眠長道情將軍不戰術計日立功名送殷堯藩侍御赴同州吟詩擲酒船仙掌白樓前從事關中貴主人天下賢此生無了日終嵗踏離筵何計因歸去深山恣意眠送崔中丞赴鄭州僕射陂前郡清髙越四鄰丹霄鳯詔下太守虎符新霧濕關城月花香驛路塵連枝相庭樹嵗嵗一家春送丁端公赴河隂炎天木葉焦曉夕絶涼飊念子獨歸縣何人不在朝市連風浪動帆徹海門遙飲盡樽中酒同年同寂寥送鄭尚書赴興元儒有登壇貴何人得此功紅旗燒密雪白馬踏長風斧鉞來天上詩書理漢中方知百勝略應不在彎弓送田使君赴蔡州長年離別情百盞酒須傾詩外應無思人間半是行路遙嘶白馬林斷出紅旌功業今應立淮西有徑兵送無可上人遊邊一鉢與三衣經行逺近隨出家還養毋持律復能詩春雪離京厚晨鍾近塞遲亦知蓮府客夜坐喜同師送僧人間優優唯間事自見髙人只有詩寂寞嵩峯雲外寺常多夢裏過齋時送宋慎言童稚便知聞如今秪有君百篇詩盡和一盞酒須分驛路多連水州城半在雲離情同落葉向晚更紛紛送家兄赴任昭義早得白眉名之官濠上城別離浮世事迢遞長年情廣陌垂花影遙林起雨聲出關春草長過汴夏雲生黠吏先濳去疲人相次迎宴餘和酒拜魂夢共東行送崔玄亮赴果州冬夜宴韓卿宅蘭燭照重茵飛杯復幾分主人寒不寢上客曉離羣騎吏緣青壁旌旗度白雲劒銘生蘚色巴字疊氷文華省思仙侣疲民愛使君泠泠唯自適郡邸有誰聞送喻鳬校書歸毗陵主人庭葉黑詩藁更誰書闕下科名出鄉中賦籍除山春煙樹衆江逺晚帆踈吾亦家吳者無因到弊廬送董正字武歸常州覲親路歧知不盡離别自無窮行客心方切主人樽未空楚檣收月下江樹在潮中人各還家去還家慶不同送蕭正字往蔡州賀裴相淮西平相府旌旄重還邀上客行今朝郭門路𥘉徹蔡州城從馬唯一作還提酒防身不要兵從來皆作使君去是時平送進士田卓入華山何物隨身去六經與一琴辭家計巳久入谷住應深一作住谷迹應深偶坐僧同石間書葉滿林業成須謁帝無貯白雲心送右司薛貟外赴處州懷中天子書腰下使君魚瀑布和雲落仙都與世踈逺程兼水陸半歲在舟車相送難相別南風入夏𥘉送王建祕書往渭南莊白鬚藝閣吏羸馬月中行莊僻難尋路官間易出城看山多失飰過寺故題名秋日田家作唯添集卷成送殷堯藩侍御遊山南詩境西南好秋深晝夜蛩人家連水影驛路在山峯谷靜雲生石天寒雪覆松我為公府繫不得此相從送李植侍御聖代無邪觸空林獬豸歸誰知隴山鳥長繞玉樓飛風雨依山急雲泉入郭微無同昔年別别後寄書稀送王淡常省為官處門前數樹松尋山屐費齒書石筆無鋒果熟猿偷亂花繁鳥語重今來為客去惜一作借取最髙峯送崔之仁一作別劉德仁欲出還成住前程甚謫遷佯眠隨客醉愁坐似僧禪舊國歸何處春山買欠錢幾時無一事長在故人邊送孫山人山翁來帝里不肯住多時一作山人言語質住世恨多時塵土衣裳重腥羶㒒隸飢林中愁不到城外老應遲喧寂一為別相逢未有期送費驤兄寒弟亦飢力學少間時何路免為客無門賣得詩幾人携酒送獨我入山遲少小同居止今朝始別離送河中楊少府宴崔駙馬宅鳯凰樓下醉醺醺晚出東門蟬漸聞不使鄉人修一作治驛路却將家纍宿一作上山雲間時採藥隨僧去每月請錢共客分縣吏若非三載滿自知無計更尋君送文著上人遊越水石隨緣豈計程東吳相遇別西京夜禪月下袈裟􅊜曉上山巔錫杖鳴念我為官應易老羡師依佛學無生越中多有前朝寺處處鐡鐘石磬聲送無可上人遊越清晨相訪立門前麻履方袍一少年懶讀經文求作佛願攻詩句覔升一作成仙芳春山影花連寺觸夜潮聲月滿船今日送行偏惜別共師文字有因緣送洛陽張貟外餞客未歸城東來騶騎迎千山嵩嶽峭百縣洛陽清朔鴈和雲度川風吹雨一作雪晴蘚庭公事暇一作少應秪獨吟行送少府田中丞入西蕃蕭關路絶久石堠亦為塵護塞空兵帳和戎在使臣風沙去國逺雨雪換衣頻若問涼州事涼州多漢人送王龜處士送客客為誰朱門處士稀唯修曾子行不著老萊衣古寺隨僧飰空林共鳥歸壷中駐年藥燒得獻庭闈送崔郎中赴常州貴是鴒原在紫微榮逢知巳領黃扉人間盛事今全得江上政聲復欲歸風起滿城山果落雨餘穿宅水禽飛昔年嘗作毗陵客石峭泉清天下稀送林使君赴邵州詔書飛下五雲間才子分符不等間驛路算程多是水州圖管地少於山江頭斑竹尋應遍洞裏丹砂自採還清淨化人人自理終朝無事更相關送別友人獨向山中覓紫芝山人勾引住多時摘花浸酒春愁盡燒竹煎茶夜卧遲泉落林梢多碎滴松生石底足旁枝明朝却欲歸城市問我來時總不知姚少監詩集卷第一
