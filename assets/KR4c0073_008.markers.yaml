  - {type: variant, offset: 0, length: 934, content: 姚少監詩集卷第八逰覧宴集五十首過張邯郸荘客行長似病煩熱束四肢到君讀書堂忽若逢良醫堂前水交流堂下樹交枝兩門延風凉洗我昏濁肌與子還徃熟坐卧恣所冝時時相獻酬文字當酒巵野飯具藜藿永日亦不飢苟飡非其所鱠炙為蒺藜時清士人閑耕作唯文詞豈獨郷里薦當取四海知過楊䖏士幽居引水穿風竹幽聲勝逺溪裁衣延野客剪翅飬山鷄酒熟聴琴酌詩成削樹題惟愁春氣暖松下雪和泥過李䖏士山居閑居晝掩扉門栁䕃𬞞畦囙病方牧薬尋僧始度溪少逢人到户時有燕御泥蕭洒身無事名髙孰與齊過無可僧院憶師眠復起永夜思迢迢月下門方掩林中寺更遥鐘聲空下界池色在清霄終擬修禅觀窓間卷𣣔焼過稠上人院清羸一飯師閑院亦披衣應詔常翻譯修心出是非雪中踈磬度林際晚風㱕𬞞食常来此人間䕶浄稀過不疑上人院九經通大義一作通經又議經内典自應精簾冷連松影苔深减履聲相逢幸此日相失一作識恐来生覺路何門去師湏引我行過雲花寳上人院九陌最幽寺吾師院復深煙霜同覆屋松竹雜成林鳥語境彌寂客来機自沉早知如到此應不帶朝簮過杜氏江亭上國千餘里逢春且勝逰暫聞新鳥戯似觧旅人愁野色吞山盡江煙襯水流村醪湏一醉無恨滯行舟過張雲舉院宿不喫胡麻飯杯中自得仙隔籬招好客掃室致芳筵家醖香醪嫰時新異果鮮夜深唯畏暁坐稳豈思眠棊罷嫌無敵詩成貴在前明朝題壁上誰得衆人傳過欽上人院有相無相身唯師説始真修篁半庭影清磬㡬僧隣古壁丹青落虚簷鳥雀馴伊余求了義羸馬徃来頻過無可上人院寥寥聴不盡孤磬與踈鍾煩惱師長別清凉我暫逢蟻行經古蘚鶴毳落深松自想歸時路塵埃復㡬重過城南僧院寺對逺山起幽居仍是師斜陽通暗隙殘雪落踈籬松静鶴栖定廊虚鍾盡遅朝朝趋府吏来此是相冝過靈泉寺偶尋靈跡去幽徑入氲氛轉壑驚飛鳥穿山踏亂雲水從岩下落溪向寺前分释子逰何䖏空堂日漸曛過天津橋晴望閑立津橋上寒光動逺林皇宫對嵩頂清洛貫城心雪路𥘉晴出人家向晚深自従王在鎬天寳至如今春日逰慈㤙寺年長歸何䖏青山未有家賞春無酒飲多㸔寺中花逰天台上方曉上上方髙䖏立路人羡我此時身白雲向我頭上過我更羡他雲路人逰終南山䇿杖度溪橋雲深歩數劳青猿吟嶺際白鶴坐松梢天外浮烟逺山根野水交自縁名利繋好此結蓬茒逰杏溪蘭若踏淂度溪湾晨逰暮不還月明松影路春滿杏花山戯狖跳林末髙僧住石間未肯離腰組来此復何顔逰謝公亭行行方避夢又到謝亭来舉世皆如此伊余何䖏廽竹鮮多透石泉㓗亦無苔坐與僧同語誰能頋酒盃, WYG: ''}
