  - {type: variant, offset: 2567, length: 0, content: '', WYG: 欽定四庫全書姚少監詩集巻八唐姚合撰遊覽宴集五十首過張邯鄲莊客行長似病煩熱束四肢到君讀書堂忽若逢良醫堂前水交流堂下樹交枝兩門延風凉洗我昏濁肌與子還往熟坐臥恣所宜時時相獻酬文字當酒巵野飯具藜藿永日亦不饑苟飡非其所鱠炙為蒺藜時清士人閒耕作唯文詞豈獨鄉里薦當取四海知過楊處士幽居引水穿風竹幽聲勝逺溪裁衣延野客剪翅養山雞酒熟聴琴酌詩成削樹題惟愁春氣暖松下雪和泥過李處士山居閒居晝掩扉門桞䕃蔬畦因病方収藥尋僧始度溪少逢人到戸時有燕銜泥蕭灑身無事名髙孰與齊過無可僧院憶師眠復起永夜思迢迢月下門方掩林中寺更遥鐘聲空下界池色在清宵終擬修禪觀窻間巻欲燒過稠上人院清羸一飯師閒院亦披衣應詔常翻譯修心出是非雪中疏磬度林際晩風歸蔬食常來此人間䕶凈稀過不疑上人院九經通大義一作通經又議經内典自應精簾冷連松影苔深減履聲相逢幸此日相失一作識恐來生覺路何門去師須引我行過雲花寳上人院九陌最幽寺吾師院復深烟霜同覆屋松竹雜成林鳥語境彌寂客來機自沈早知能到此應不戴朝簮過杜氏江亭上國千餘里逢春且勝遊暫聞新鳥戲似解旅人愁野色吞山盡江烟襯水流村醪須一醉無恨滯行舟過張雲舉院宿不喫胡麻飯杯中自得仙隔籬招好客掃室致芳筵家醖香醪嫩時新異果鮮夜深唯畏曉坐穏豈思眠棊罷嫌無敵詩成貴在前明朝題壁上誰得衆人傳過欽上人院有相無相身唯師説始真脩篁半庭影清磬幾僧鄰古壁丹青落虚簷鳥雀馴伊余求了義羸馬往來頻過無可上人院寥寥聴不盡孤磬與疎鐘煩惱師長别清涼我暫逢蟻行經古蘚鶴毳落深松自想歸時路塵埃復幾重過城南僧院寺對逺山起幽居仍是師斜陽通暗隙殘雪落疎籬松靜鶴棲定廊虚鐘盡遲朝朝趨府吏來此是相宜過靈泉寺偶尋靈跡去幽徑入氲氛轉壑驚飛鳥穿山踏亂雲水從巖下落溪向寺前分釋子遊何處空堂日漸曛過天津橋晴望閒立津橋上寒光動逺林皇宫對嵩頂清洛貫城心雪路初晴出人家向晩深自從王在鎬天寳至如今春日遊慈恩寺年長歸何處青山未有家賞春無酒飲多看寺中花遊天台上方曉上上方髙處立路人羨我此時身白雲向我頭上過我更羨他雲路人遊終南山䇿杖度溪橋雲深步數勞青猿吟嶺際白鶴坐松梢天外浮烟逺山根野水交自縁名利繋好此結蓬茒遊杏溪蘭若踏得度溪灣晨遊暮不還月明松影路春滿杏花山戲狖跳林末髙僧住石間未肯離腰組來此復何顏遊謝公亭行行方避夢又到謝亭來舉世皆如此伊余何處迴竹鮮多透石泉潔亦無苔坐與僧同語誰能顧酒杯遊陽河㟁終日遊山困今朝始傍河尋芳愁路盡逢景畏人多鳥語催沽酒魚來已聴歌醉時眠石上肢體自婆娑遊河橋曉望閒上津橋立天涯一望間秋風波上岸旭日氣連山偶聖今方變朝宗豈復還崑崙在蕃界作將亦何顔上一作出界一作激秋夜月中登天壇秋蟾流異彩齋潔上壇行天邇星辰大山深世}
