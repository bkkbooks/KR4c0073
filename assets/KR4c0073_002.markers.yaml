  - {type: variant, offset: 0, length: 293, content: 姚少監詩集卷第二送別下四十三首送張宗原東門送客道春色如死灰一客失意行十客顔色低住者旣無家去者又非歸窮愁一成􅍚百藥不可一作能治子賢我且愚命分不合齊誰開蹇躓門日日同遊栖子行何所之切切食與衣誰䏻買仁義令子無寒饑野田不生草四向生路歧士人甚啇賈終日須東西鴻鴈春北去秋風復南飛勉君向前路無失相見期送王求士有經世籌自無活身策求食道路間勞困甚徒役我身與子同日被饑寒迫側望卿相門難入堅如石爲農昧耕耘作商迷貿易空把書卷行投人一作入買罪責六月南風多苦旱土色赤坐家心尚焦况乃逺作客羸馬出郭門餞飲暁連夕願君似醉腸莫謾生憂蹙送朱慶餘及第後歸越勸君緩上車郷里有吾廬未得同歸去空令相見踈山晴棲鶴起天暁落潮𥘉此慶将誰比獻, WYG: ''}
