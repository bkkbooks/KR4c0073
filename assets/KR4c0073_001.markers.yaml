  - {type: variant, offset: 2675, length: 1, content: 卷, WYG: 巻一欽定四庫全書姚少監詩集巻二唐姚合撰送别下四十三首送張宗原東門送客道春色如死灰一客失意行十客顔色低住者既無家去者又非歸窮愁一成疾百藥不可一作能治子賢我且愚命分不合齊誰開蹇躓門日日同遊栖子行何所之切切食與衣誰能買仁義令子無寒飢野田不生草四向生路岐士人甚商賈終日須東西鴻雁春北去秋風復南飛免君向前路無失相見期送王求士有經世籌自無活身策求食道路間勞困甚徒役我身與子同日被饑寒迫側望卿相門難入堅扵石為農昧耕耘作商迷貿易空把書巻行投人一作入買罪責六月南風多苦旱土色赤坐家心尚焦况乃逺作客羸馬出郭門餞飲曉連夕願君似醉膓莫漫生憂蹙送朱慶餘及}
