front:
  text: 姚少監詩集卷第三
  hash: sha256:35977440df15d123ca165f3d639d3451cd108ae83539f546a127539fb323b0d3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_003-1a}
body:
  text: 寄贈四十七首寄賈島漫一作雖向城中住兒童不識錢甕頭寒絶酒竈額曉一作冷無煙狂發吟如哭愁來坐似禪新詩有幾首旋𬒳世一作衆人傳寄王度居士憔悴王居士顛狂不稱時天公與貧病時輩復輕欺茅屋隨年借一作賃盤飱逐日移棄嫌官似夢珍重酒如師無竹栽蘆看思山疊石為靜窗留客話古寺覓僧棊瘦馬寒來死羸童餓得癡唯應尋阮籍心事逺相知寄楊茂卿校書去年別君時同宿黎陽城黃河凍欲合船入冰罅行君為使滑州我來西入京丈夫不泣別旁人歎無情到京就省試落籍先有名慙辱鄉薦書忽欲自受刑還家豈無路羞為路人輕決心住城中百敗望一成腐草衆所棄猶能化為螢豈我愚暗身終久不發明所悲道路長親愛難合并還如舟與車奔走各異程耳目甚短狹背面若聾肓安得學白日遠見君儀形寄杜師義出處難相見同城似異鄉點兵尋戶籍燒藥試仙方事校千般别心還一種忙黃金如化得相寄一作分減亦何妨寄陸渾縣尉李景先微俸還同請唯君獨自間地偏無驛路藥賤管仙山月色生松裏泉聲在石間吟詩復飲酒何事更相關寄酬盧侍御詩新得意恣狂踈揮手終朝力有餘今到詩家渾手戰欲題名字倩人書寄主客張郎中年長方慕道金丹事參差故園歸未得秋風思難持蹇拙公府棄朴靜髙人知以我齊杖屨昏旭詎相離吟詩紅葉寺對酒黃菊籬所賞未及畢後遊良有期粲粲華省步屑屑旅客姿未同山中去固當殊路歧寄鄠縣尉李廓少府歲滿休為吏吟詩著白衣愛山間卧久在世此心稀聽鶴向風立捕魚乘月歸比君才不及謬得侍彤闈寄紫閣隱者自聞樵客説無計得相尋幾世傳髙卧全家在一林養情書覽苦一作養生書最苦採藥路多一作遊深願得為鄰異鄰里誰能説此心寄國子楊巨源祭酒日日新詩出城中寫不禁清髙疑一作直對竹間雅勝聞琴門户饒秋景兒童解冷吟雲山今作主還借外人尋寄永樂長官殷堯藩故人為吏隱髙卧簿書間繞院唯栽藥逢僧只説山此霄歡不接窮歲信空還何計相尋去嚴風雪滿關冬夜書事寄兩省閣老天寒漸覺鴈聲踈新月微微玉漏𥘉海嶠只宜今日去故鄉巳過十年餘髮稀豈易勝玄冕眼暗應難寫諌書閣下羣公盡髙思誰能携酒訪貧居寄靈一律師𣑽書鈔律千餘紙淨院焚香獨受持童子病來煙火絶清泉潄口過齋時郡中書事寄默然上人郡中饒野興過客亦淹留看月江樓曉尋山石徑秋意歸何處老誰免此生愁長愛東林子安禪百事休寄張傒幽處尋書坐朝朝閉竹扉山僧封茗寄野客乞詩歸秋卷多唯好時名屈更肥明年取前字杯酒賽春輝寄李頻閉門常不出惟覺長庭莎朋友來看少詩書卧讀多命隨才共薄愁與醉相和珍重君名字新登甲乙科寄李群玉九衢名與利無計優間人道逺期輕世才髙貴重身石脂稀勝乳玉粉細於塵骨換肌膚膩心靈一作虛氣色真嵩山髙到日洛水暖如春居住應安隱一作穩黃金幾竈新病中書事寄友人終日自纒繞此身無適緣萬愁生雨夜百病湊衰年多睡憎明屋慵行待暖天瘡頭梳有虱風耳亂無蟬換白方多錯回金法不全家貧何所怨將在老僧邊九日寄錢可復數杯黃菊酒千里白雲天一作仙上國名方振戎州病未痊一作綺陌人消得鄰州客謾顛靜愁惟憶醉間赱一作悶不勝眠惆悵一作應念東門別相逢知一作更幾年春日早朝寄劉起居九衢寒霧斂雙闕曙光分綵仗迎春日香煙接瑞雲珮聲清漏間天語侍臣聞莫笑馮唐老還來謁聖君秋日寄李支使秋思朝來起侵人暑稍微曉眠離北戶午飯尚生衣山靜雲𥘉白枝髙果漸稀聞君家海上莫與燕同歸寄汴州令狐楚相公汴水從今不復渾秋風鼙鼓動城根梁園臺館關東少相府旌旗天下尊詩好四方誰敢和政成三郡自無冤幾時詔下歸丹闕還領千官入閣門寄東都白賔客居易闕下髙眠過十旬南宫印綬乞離身詩中得意應千首海內嫌官只一人賔客分司真是隱山泉繞宅豈辭貧竹齋晚起多無事唯到龍門寺裏頻寄裴起居千官曉立爐煙裏立近丹墀是起居彩筆専書皇帝語書成幾卷太平書寄狄拾遺時魏州從事少在兵馬間長還繫戎職雞飛不得逺豈要生羽翼三年城中遊與君最相識應知我中腸不苟念衣食主人樹勳名欲滅天下賊愚雖乏智謀願陳一人力人生須氣健飢凍縛不得睡當一席寬覺乃千里窄古人不懼死所懼死無益至交不可合一合難離坼君嘗相勸勉苦語毒胸臆百年心聞誰限河南北金州書事寄山中舊友安康雖好郡刺史是憨翁買酒終朝飲吟詩一室空自知為政拙衆亦覺心公親事星河在憂人骨肉同簿書嵐色裏鼓角水聲中井邑神州接帆檣海路通野亭晴帶霧竹寺夏多風溉稻長洲白燒林逺岫紅舊山期巳失一作度芳草思何窮林下無相笑男兒五馬雄寄紫閣無名頭陀自新羅來峭行得如如誰分聖與愚不眠知夢妄無號免人呼山海禪一作法皆遍華夷佛豈殊何因接師話清淨在斯須寄郁上人此生修道淺愁見未來身誰為傳真諦唯應是上人自悲年巳長漸覺事難親不向禪門去他門無了因寄孫路秀才幽居鄰里少江際復山阿潮去一作下蟬聲出天晴鶴語多老人能步蹇才子奈貧何曾見春官語年來虛甲科寄安陸友人別路在春色故人雲夢中鳥啼三月雨蝶舞百花風煙束逺山碧霞欹落照紅想君登此興回首念飄蓬寄馬戴天府鹿鳴客幽山秋未歸我知方甚愛衆説以為非隔屋聞泉細和雲見鶴微新詩此處得清峭比應稀寄賈島時任普州司倉長沙事可悲普掾罪誰知千載人空盡一作老一家冤不移吟寒應齒落才峭自名垂地逺山重疊難傳相憶詞寄楊工部聞毗陵舍弟自罨溪入茶山採茶溪路好花影半浮沉畫舸僧同上春山客共尋芳新生石際幽嫩在山隂色是春光染香驚日氣侵試嘗應酒醒封進定恩深芳貽千里外怡怡太府吟寄陜州王司馬家寄秦城非本心偶然頭上有朝簪自當臺直無因醉一別詩宗更懶吟世事每將愁見擾年光唯與老相侵欲知居處堪長久須向山中學煮金寄賈島寂寞荒原下南山秪隔籬家貧唯我並詩好復誰知草色無窮處蟲聲少盡時朝昏鼓不到間卧益相宜寄崔之仁山人百門坡上住石屋一作室兩三間日月難教老妻兒乞與間仙經揀客問一作仙方揀客示藥一作酒債一作價煮金還何計能相訪一作引終身得在山寄嵩嶽程光範相別何容易相逢便歲年客來嫌路逺誰得到君邊嶽色鳥啼裏鐘聲竹影前只應訪支遁時得話詩篇洛下夜會寄賈島洛下攻詩客相逢秪是吟夜觴歡稍靜寒屋坐多深烏府偶為吏滄江長在心懷一作憶君難就寢燭滅復星沉寄華州李中丞毛女峯前郡煙霞氣轉清庭分靈掌影窗度瀑泉聲蘚徑人稀到松齋藥自生常餐亦芝术間客是公卿看水逢仙鶴登樓見帝城養生非酒病難隱是詩名省署嘗連步江臯欲獨耕偶題無六義聊以逹微誠病中辱朱諌議惠甘菊藥苗因以詩贈蕭蕭一畒宫種菊十餘叢採摘和芳露封題寄病翁􅍄冝茶鼎裏餐稱石甌中香潔將何比從來味不同舟行書事寄杭州崔貟外張頥任酒澆開眼信花燒舊國歸何滯新知別又遙夜行篙觸石晚泊纜依橋若未重相見無門解寂寥寄元緒上人石窗紫蘇墻此世此清涼研露題詩潔消冰煮茗香間雲春影薄孤磬夜聲長何計休為吏從師老草堂寄白閣默然白閣峯頭雪城中望亦寒髙僧多默坐清夜到明看世上無諸苦林間只一餐嘗聞南北教所得比師難夏日書事寄丘亢處士暑天難可度豈復更持觴樹裏鳴蟬咽宫中午漏長病夫心益躁靜者室應涼幾欲相尋去紅塵滿路旁秋中寄崔道士貧居雀喧噪况乃靜巷陌夜眠睡不成空庭聞露滴旁有一杯酒歡然如對客月光久逾明照得筆墨白平生志舒豁難可似兹夕四肢得自便雖勞不為役故人山中住善治活身策五穀口不嘗比僧更間寂我今暫得安自謂脫幽戚君身長逍遙日月爭老得寄華州崔中丞蓮華峯下郡仙洞亦難勝閭里蒼苔水虛空瀑布冰酒香和藥􅍄山峭過雲登清淨黎人泰唯憂急詔徴秋日書事寄祕書竇少監秋氣日騷騷星星雙鬢毛涼天吟自逺清夜夢還髙林下期同去人間共是勞頭巾何所直且漉甕頭糟姚少監詩集卷第三
