front:
  text: 姚少監詩集卷第九
  hash: sha256:f53486e5a63bd90233d178216bf6deae81219fd33ff0ac5366cbb9908d2e6f90
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_009-1a}
body:
  text: 和荅酬謝五十七首和東都令狐㽞守相公除官東守洛陽宫㤙比藩公任更雄拜表出時傳七刻排班衙日有三公旌旗嚴重􅎔関外庭宇清深接禁中三十六峯詩酒思朝朝閑望與誰同和髙諌議䝉兼賔客時入翰苑兼秩㤙㱕第一流時尋仙路向􅌡洲鐘聲迢遞銀河在林色葱籠玉露秋紫殿講筵隣御座青宫賔榻入龍樓従来共結㱕山侣今日多應獨自休和盧給事酬裴貟外南山雪色徹皇州鐘鼔聲交曉氣浮鴛鷺簮𥚑上龍尾蓬莱宫殿壓鼇頭夕郎夜直吟仙掖天楽和聲下禁樓贈荅詩成才思敵病夫𣣔和㡬朝愁和裴結端公早朝魚鑰千門啟鷄人唱暁傳冕旒臨玉殿丞相入鑪煙列位同居左分行忝在前給事中与侍御史班同行在東給事中與在臺官前故有此句仰聞天語近俯拜珮聲連綵仗祥光動彤庭霽色鮮威儀誰可紀柱史有新篇和門下李相餞􅒾蜀相公聖朝同舜日作相有䕫龍理化知無外蒸黎盡可封爕和皆逹識出入並登庸武騎増餘勇儒冠貴所從贈詩全六義出鎮越千峯連日陳天楽芳筵叠酒鍾烏䑓情已洽鳯閤分彌濃无和十四年崔相公与門下相公連御史臺今又在中書矣棧轉旌搖水崕髙馬蹋松㤙深施逺俗化美見前蹤太和四年門下相公出鎮至今西蜀理化清浄民俗歌謡不絶江暁流巴字山晴聳劒鋒㕠油擁上宰四海羡􅎔卭先路聲華逺離京詔旨重歲除今向盡春色即相逢嫩葉抽頳蘂新苔長翠茸水銷魚潎潎林暖鳥噰噰泉落聞難盡花開看不供青城方眷恋黄閤竟從容計日㱕台席還聴長楽鐘和座主相公􅒾亭秋日即事􅒾亭秋望好寕要更垂簾夫子牆還峻鄼侯宅過謙㣲風紅葉下新雨緑苔黏窓外松𥘉長欄中薬旋添海圖装玉軸書目記牙籖竹色晴連地山光逺入簷酒濃盃稍重詩冷語多尖屬和才雖淺題髙免客嫌和秘書崔少監春日逰青龍寺僧院官清書府足閑時暁起攀花折栁枝九陌城中尋不盡千峰寺裏㸔相冝髙人酒味多和薬自古風光只屬詩見説徃来多静者未知前日更逢誰和李紳助教不赴㸔花笑辭聘禮深坊住門舘長閑似退一作野居太學官資清品秩髙人公事説經書年華未是登朝晚春色何囙向酒踈且㸔牡丹吟䴡句不知此外復何如和李十二舍人冬至日獻壽人皆慶南山復北堂從今千萬日此日又𥘉長和裴令公新城緑野堂即事結搆立嘉名軒窓四面明丘墻髙莫比蕭宅僻還清池際亀潜戯庭前薬旋生樹深簷稍邃石峭逕難􅊭道曠襟情逺神閑視聴精古今功獨出大小隠俱成曙雨新苔色秋風長桂聲携詩就竹冩取酒對花傾古寺招僧飯方塘看鶴行人間無此貴伴仗暮㱕城和厲玄侍御題户部李相公廬山西林草堂苑屋􅎔江起登庸復應期遥知㱕去日自致太􅊭時幽薬禅僧䕶髙窓宿鳥窺行人盡歌詠唯子獨能詩和鄭相演楊尚書蜀中唱和詩天福坤維厚忠賢擁莭旄江同渭濵逺山似傳巖髙元氣符才格文星照筆毫五言全䴡則六義出風騷聖日麻㕠下洪爐柄共操寵榮連雨露先後比蕭曺唱絶時難和吟多客詎劳四方雖𥿄貴誰怕費錢刀和户部侍郎省中晚㱕寒日南宫晚閑吟半醉㱕位髙行路静詩好和人希古樹苔文匝遥峯雪色微寕知逢彩筆寂寞有光輝和元八郎中秋居聖代無為化郎中似散仙晚眠随客醉夜坐學僧禅酒用林花醸茶将野水煎人生知此味獨恨少囙縁和李十二舍人裴四二舍人两閣老酬白少傅見寄罷艸王言星歲乆嵩髙山色日相親蕭條雨夜吟連曉撩亂花時看盡春此丗逍遙應獨得古来閑散有誰隣林中長老呼居士天下書生仰逹人酒挈數瓶盃亦濶詩成千首語皆新綸闈並命誠冝賀不念衰年寄上頻和劉禹錫主客冬𥘉拜表懐上都故人九陌喧喧騎吏催百官拜表禁城𨳩林踈曉日明紅葉塵静寒霜覆緑苔玉佩聲㣲班始定金函光動按𥘉来此時共想朝天客謝食方從閣裏廻和太僕田卿酬殷堯藩侍御見寄徃還知分熟酬贈思同新嗜飲殷偏逸閑吟卿亦貧古苔寒更翠修竹静無鄰促席燈浮酒聴鴻霜滿身淺才唯是我髙論更何人携手冝相訪窮行少路塵和膳部李郎中秋夕淅淅復修修凉風似水流此生難免老舉世大同愁螢影明苔蘚鴻聲傍斗牛猶分省署直何日是歸休和前吏部韓侍郎夜泛南溪辭得官来疾漸􅊭世間難有此髙情新秋月滿南溪裏引客乗船䖏䖏行和王郎中題華州李中丞􅈦蓮華峯下郡齋前遶砌穿池貯瀑泉君到亦應閑不淂主人草聖復詩仙和厲玄侍御無可上人㑹宿見寄九衢難㑹宿况復是寒天朝客清貧老林僧黙悟禅眠遅消漏水吟苦墮寒涎異日来尋我滄江有釣船和令狐六貟外直夜即事寄上相公霜臺同䖏軒窓接粉署先登語笑踈皓月滿簾聴玉漏紫泥盈手彂天書吟詩清美一作冷招閑客對酒逍遥卧直廬榮貴人間難有比相公離此十年餘荅孟侍御早朝見寄河傾月向􅒾九陌鼔聲齊塵静霜華逺煙生曙色低禁門人已度宫樹鳥猶栖踈懶勞相問登山有舊梯和友人新居園上新居多野􅋠不似在京城墙上雲相壓庭前竹亂生尋師望薬力依譜上琴聲好色中秋夜無塵有月明和裴令公逰南荘憶白二十韋七二賔客四郊𥘉雨歇髙樹滴猶殘池滿紅蓮湿雲收緑野寛花開半山暁竹動數村寒闘雀翻衣𬒮驚魚觸釣竿罇前多野客膝下盡郎官斸石通泉脉移松出薬欄関東分務重天下比功難半醉思韋白題詩染彩翰和李舍人秋日卧疾言懐閑卧襟情逺西風菊漸芳虚窓通暁景珎簟卷秋光果墜青莎徑塵離緑蘚墙薬奩開静室書閤出藂篁對酒吟難盡思山夢稍長王言生彩筆朝服惹鑪香松影幽連砌蟲聲冷到牀詩成難敢和清思若懐霜和李十二舍人直日放朝對雪今朝街鼓何人聴朝客𨳩門對雪眠豈比直廬丹禁裏九重天近色彌鮮荅李頻秀才一年離九陌壁上掛朝𫀆物外詩情逺人間酒味髙思㱕知病長失寝覺神劳衰老無多思因君把筆毫荅胡遇一㑹一分離貧逰少定期酒多為客稳米貴入城遅晴日偷将睡秋山乞與詩縦然眉得辰不似見君持荅友人招逰不来知盡恠失意懶春逰聞鳥寕驚夢㸔花怕引愁賭棊招敵手沽酒自扶頭何似華筵上推辭候到籌荅竇知言冬日易慘悪㬥風㧞山根塵沙落黄河濁波如地翻飛鳥皆束翼居人不開門獨我赴省期冐此馳轂轅陕城城西邊逢子亦且奔所趋事一心相見如弟昆我慘得子舒我寒得子温同行十日程僮僕性亦敦到京人事多日無閑精䰟念子珎重我吐詞彂䝉昏反復千萬意一百六十言格髙思清冷山低濟渾渾甞聞朋友恵贈言始為㤙金玉日消費好句長存存倒篋別收貯不與俗士論每當清夜吟使我如哀猿酬田就閑居多僻静猶恐道相違只是夜深坐那堪春未㱕嫩苔粘野色香絮撲人衣縦有野僧到終朝不話非酬禮部李貟外見寄本求仙郡是閑居豈向郎官更有書溪石誰思玉匠爱煙鴻願與弋人踈自来江上眠方稳舊在城中病悉除唯見君詩難便捨寒宵吟到暁更𥘉酬令狐郎中見寄昨是兒童今是翁人間日月急一作疾如風常聞𣣔向滄江去除我無人與子同酬李廓精舍南臺望月見寄看月空門裏詩家境有餘露寒僧梵出林静鳥巢踈逺色當秋半清光勝夜𥘉獨無臺上思寂寞守吾廬酬光禄田卿末㐲見寄下伏秋期近還知扇漸踈驚飈墜隣果㬥雨落江魚貴寺雖同秩閒曺只管書朝朝廊下食相庇在肴𦵔酬薛奉禮見寄栖栖蒼海一耕人詔遣江邉作使君山頂雨餘青到地濤頭風起白連雲詩成客見書墻和薬熟僧来就鼎分珎重来章相借問芳名未識已曽聞酬盧汀諌議粟如流水帛如山依念倉邉語笑間篇什縦横文案少親朋撩亂吏人閒杯觴引滿從衣湿墙壁書多任手頑遥賀来年二三月綵衣先軰過春関酬萬年張郎中見寄貢籍常同府周行今一時諌曺誠已忝京邑豈相冝黒髪年来盡滄江㱕去遅何時得携手林下静吟詩酬光禄田卿六䪨見寄以病辭朝謁迂踈種薬翁心彌一作唯念魚鳥詔遣理兵戎遶户旌旗影吹人鼓角風雪晴嵩岳頂樹老陕城宫莅職才微薄㱕山路未通名卿詩句峭誚我在関東酬楊汝士尚書喜人移居未得滄江外衰殘讀藥書聖朝優上秩仁里許閑居樹對枝相接泉同井不踈酬章深自鄙欲寄復躊蹰酬田卿書齋即事見寄幽齋琴思静晚下紫宸朝舊隠同溪逺周行隔品遥深槐蝉唧唧踈竹雨蕭蕭不是相尋懶煩君舉酒瓢酬張籍司業見寄日日在心中青山青桂樷髙人多爱静㱕路亦應同罷吏方無病囙僧𣣔觧空新詩劳見問吟對一作向竹間風謝汾州田大夫寄茸氊葡萄筐封紫葡萄筒卷白茸毛卧暖身應健含消一作清齒免劳衾衣踈不称梨栗鄙難髙暁起題詩報寒凘滿筆毫謝李太尉牧杭州徳𥙿皇息特許拜杭壇欲謝旌旄去就難偷擬白頭瞻画㦸四神俱散髪毛寒杏園宴上謝座主得陪桃李植芳樷別感生成太昊功今日無言春雨後似含冷涕謝東風謝韜光上人上方清净無因住唯願他生得住持只恐無生復無我不知何䖏更逢師謝秦校書與無可上人見訪道同無宿約三伏自從容窓豁山侵座扇摇風下松客吟多遶竹僧飯只慿鐘向晚分㱕路莓苔行跡重喜胡遇至窮居稀出入門户滿塵埃病少閑人問貧唯宻友来茅亝從掃破薬酒遣生𨳩多事經時別還愁不宿廻就林焼嫰筍遶樹揀香梅相對題新什遅成舉罰盃喜賈島至布囊懸蹇驢千里到貧居飲酒誰堪伴㽞詩自與書爱眠知不醉省語似相踈軍吏衣裳窄還應暗笑余喜喻鳬至欲出心還懶閑吟遶寝牀道書蟲食盡酒律客偷将愁至為多病貧来减淂狂見君何所似如熱得清凉喜雍陶秋夜訪宿暁立侍爐煙夜㱕蓬蓽眠露華明菊上螢影滅燈前清漏和碪叠栖禽與葉連髙人来此宿為似在山巔喜賈島雨中訪宿雨裏難逢客閑吟不復眠蟲聲秋併起林色夜相連爱酒此生裏趋朝未老前終湏携手去滄海棹魚船喜馬戴冬夜見過期無可不至客来𥘉夜裏薬酒自開封老漸多㱕思貧唯長病容苦寒燈焰細近暁鼓一作漏聲重僧可還相捨深居閉古松同前内殿臣相命開罇話舊時夜鐘催鳥絶積雪阻僧期林静寒聲逺天隂曙色遅今宵復何夕鳴珮坐難随訪僧法通不遇訪師師不遇禮佛佛無言依舊将煩惱黄昏入宅門夜期友生不至忍寒停飯一作酒侍君来酒作凌凘一作冬凌火作灰半夜出門重立望月明先自下髙臺尋僧不遇入門愁自散不假見僧翁花落煎茶水松生醒酒風拂牀尋古画㧞刺看新樷别有逰人見多疑住此中姚少監詩集卷第九
