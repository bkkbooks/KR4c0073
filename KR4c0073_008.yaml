front:
  text: 姚少監詩集卷第八逰覧宴集五十首
  hash: sha256:181d5f1533a898185a4f75f626694725bf0e2d716bb2f50d389c8bfb5281caa3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_008-1a}
body:
  text: 過張邯郸荘客行長似病煩熱束四肢到君讀書堂忽若逢良醫堂前水交流堂下樹交枝兩門延風凉洗我昏濁肌與子還徃熟坐卧恣所冝時時相獻酬文字當酒巵野飯具藜藿永日亦不飢苟飡非其所鱠炙為蒺藜時清士人閑耕作唯文詞豈獨郷里薦當取四海知過楊䖏士幽居引水穿風竹幽聲勝逺溪裁衣延野客剪翅飬山鷄酒熟聴琴酌詩成削樹題惟愁春氣暖松下雪和泥過李䖏士山居閑居晝掩扉門栁䕃𬞞畦囙病方牧薬尋僧始度溪少逢人到户時有燕御泥蕭洒身無事名髙孰與齊過無可僧院憶師眠復起永夜思迢迢月下門方掩林中寺更遥鐘聲空下界池色在清霄終擬修禅觀窓間卷𣣔焼過稠上人院清羸一飯師閑院亦披衣應詔常翻譯修心出是非雪中踈磬度林際晚風㱕𬞞食常来此人間䕶浄稀過不疑上人院九經通大義一作通經又議經内典自應精簾冷連松影苔深减履聲相逢幸此日相失一作識恐来生覺路何門去師湏引我行過雲花寳上人院九陌最幽寺吾師院復深煙霜同覆屋松竹雜成林鳥語境彌寂客来機自沉早知如到此應不帶朝簮過杜氏江亭上國千餘里逢春且勝逰暫聞新鳥戯似觧旅人愁野色吞山盡江煙襯水流村醪湏一醉無恨滯行舟過張雲舉院宿不喫胡麻飯杯中自得仙隔籬招好客掃室致芳筵家醖香醪嫰時新異果鮮夜深唯畏暁坐稳豈思眠棊罷嫌無敵詩成貴在前明朝題壁上誰得衆人傳過欽上人院有相無相身唯師説始真修篁半庭影清磬㡬僧隣古壁丹青落虚簷鳥雀馴伊余求了義羸馬徃来頻過無可上人院寥寥聴不盡孤磬與踈鍾煩惱師長別清凉我暫逢蟻行經古蘚鶴毳落深松自想歸時路塵埃復㡬重過城南僧院寺對逺山起幽居仍是師斜陽通暗隙殘雪落踈籬松静鶴栖定廊虚鍾盡遅朝朝趋府吏来此是相冝過靈泉寺偶尋靈跡去幽徑入氲氛轉壑驚飛鳥穿山踏亂雲水從岩下落溪向寺前分释子逰何䖏空堂日漸曛過天津橋晴望閑立津橋上寒光動逺林皇宫對嵩頂清洛貫城心雪路𥘉晴出人家向晚深自従王在鎬天寳至如今春日逰慈㤙寺年長歸何䖏青山未有家賞春無酒飲多㸔寺中花逰天台上方曉上上方髙䖏立路人羡我此時身白雲向我頭上過我更羡他雲路人逰終南山䇿杖度溪橋雲深歩數劳青猿吟嶺際白鶴坐松梢天外浮烟逺山根野水交自縁名利繋好此結蓬茒逰杏溪蘭若踏淂度溪湾晨逰暮不還月明松影路春滿杏花山戯狖跳林末髙僧住石間未肯離腰組来此復何顔逰謝公亭行行方避夢又到謝亭来舉世皆如此伊余何䖏廽竹鮮多透石泉㓗亦無苔坐與僧同語誰能頋酒盃界清仙飈石上起海日夜中明何計長来此閑眠過一生逰昊天玄都觀性同相見易紫府共閑行隂逕紅桃落秋壇白石生蘚文連竹色鶴語應松聲風定薬香細樹深泉氣清垂簷靈艸影遶壁古山名圍外坊無禁歸時踏月明同裴起居厲侍御放朝逰曲江暑月放朝頻青槐路絶塵雨晴江色出風動一作度艸香新獨立分幽島同行得静人此歡宜稍滯此去與誰親曉望華清宫暁㸔樓殿更鮮明遥隔朱欄見鹿行武帝自知身不死教修玉殿號長生夏日登樓晚望避暑髙樓上平蕪望不窮鳥穿山色去人歇樹隂中數帶長河水千條弱栁風暗思多少事懶話與芝翁霽後登樓髙樓𥘉霽後逺望思無窮雨洗青山净春蒸大野融碧池舒暖景弱栁亸和風爲有登臨興獨吟落照中早夏郡樓宴集官散有閑情登樓歩稍輕窗雲帶雨氣林鳥雜人聲暁日襟前度㣲風酒上生城中㑹難得掃壁各書名夜宴太僕田卿宅故人九寺長邀我此同歡永夜開筵静中年飲酒難微風侵燭影叠漏過林端臘後分朝日天明㡬刻殘春日同㑹衛尉崔少卿宅詩家㑹詩客池閤暁𥘉晴鳥盡山中語琴多譜外聲映花相勸酒入洞各題名踈野常如此誰人信在城軍城夜㑹軍城夜禁楽飲酒每題詩坐稳吟難盡寒多醉較遅逺鍾經一作驚漏壓微月𬒳燈欺此㑹誠堪惜天明是別離晦日宴劉值録事宅花落鶯飛深院静滿堂賔客盡詩人城中盃酒家家有唯是君家酒送春宴光禄田卿宅行裏開華舘珎羞次第嘗春風酒影動晴日楽聲長乆坐難辭醉衰年亦暫狂慇懃還継燭永夕夢相妨㑹将作崔監東園牆北走紅塵牆東接一作飛白雲山光衣上見薬氣酒中聞此㑹誠堪惜窮秋日又曛人間唯有醉醉後復何云同諸公㑹太府韓卿宅九寺名卿才思雄邀歡筆下與杯中六街鼔絶塵埃息四座筵開語笑同𦦨燄蘭缸明狭室丁丁玉漏彂深宫即聴鳴唱天門暁吏事相牽西復東乞酒聞君有美酒與我正相冝溢瓮清如水粘盃半似脂豈唯消舊病且要引新詩况此便便腹無非是滿巵寄衛拾遺乞酒老人罷巵酒不酔已經年自飲君家酒一盃三日眠味輕花上露色似洞中泉莫厭時時寄湏知法未傳乞新茶嫩緑㣲黄碧澗春採時聞道断葷辛不将錢買将詩乞借問山翁有㡬人西掖寓直春暁聞殘漏直廬仙掖近春氣曙猶寒隠隱銀河在丁丁玉漏殘㣲風飄更切萬籟雜應難鳯閣明𥘉啟雞人唱漸闌静宜来禁裏清是下雲端我識朝天路從容自整冠杭州郡齋南亭符印懸腰下東山不得㱕獨行南北近漸老徃還稀迸笋侵窗長驚蝉出樹飛田田池上葉嘗是使君衣郡中西園西園春𣣔盡芳艸徑難分静語唯幽鳥閑眠獨使君宻林生雨氣古石帶潮文雖去清秋逺朝朝見白雲杭州官舍偶書錢塘刺史謾題詩貧𥚹無㤙懦少威春盡酒盃花影在潮廻畫檻水聲微閑吟山際邀僧上暮入林中㸔鶴㱕無術理人人自理朝朝漸覺簿書稀省直書事黙默滄江老官分右掖荣立朝班近殿奏直上知名暁霧和香氣晴樓下楽聲蜀牋金屑膩月兎筆毫精禁樹非煙覆宫墙瑞艸生露盤秋更出玉漏晝還清碧蘚無塵染寒蝉似鳥鳴竹深雲自宿天近日先明孱懦難封詔踈愚但擲觥素飡終日足寕免衆人輕杭州官舍即事臨江府署清閑坐一作卧復閑行苔蘇踈塵色梧桐出雨聲漸除一作知身外事暗作道家名更喜仙山近庭前薬自生假日書事呈院中司徒十日公府静巾􅌨起清晨寒蝉近衰栁古木似髙人學佛寕憂老為儒自喜貧海山㱕未得芝术夢中春書縣丞舊􅈦宫殿一作樓閤半山上人家向下居古􅈦眠易魘老史語多虚雨水澆荒竹溪沙擁廢渠聖朝收外府皆是九天除縣中秋宿鼓絶門方掩蕭條作吏心露垂庭際艸螢照竹閒禽棊罷嫌無月眠遅聴盡碪還知未離此時復更相尋夏夜宿江驛竹屋􅎔江㟁清宵興自長夜深傾北斗葉落暎横塘渚閙漁歌響風和角糉香却愁南去棹早晚到瀟湘陕城即事左右分京闕黄河與宅連何功来此地竊位已經年天下才彌小関中鎮最先隴山望可見惆悵是窮邊姚少監詩集卷第八
