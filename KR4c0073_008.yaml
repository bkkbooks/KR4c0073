front:
  text: 姚少監詩集卷第八逰覽宴集五十首
  hash: sha256:b10aaaba3ad49c661def69d10a521b05cbe405648df202bbb61902c3dd678259
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_008-1a}
body:
  text: 過張邯鄲莊客行長似病煩熱束四肢到君讀書堂忽若逢良醫堂前水交流堂下樹交枝兩門延風涼洗我昏濁肌與子還往熟坐卧恣所冝時時相獻酬文字當酒巵野飯具藜藿永日亦不飢苟餐非其所鱠炙為蒺藜時清士人間耕作唯文詞豈獨鄉里薦當取四海知過楊處士幽居引水穿風竹幽聲勝逺溪裁衣延野客剪翅飬山雞酒熟聽琴酌詩成削樹題惟愁春氣暖松下雪和泥過李處士山居間居晝掩扉門栁蔭𬞞畦因病方牧藥尋僧始度溪少逢人到户時有燕御泥蕭灑身無事名髙孰與齊過無可僧院憶師眠復起永夜思迢迢月下門方掩林中寺更遙鐘聲空下界池色在清霄終擬修禪觀窗間卷𣣔燒過稠上人院清羸一飯師間院亦披衣應詔常翻譯修心出是非雪中踈磬度林際晚風歸𬞞食常來此人間護淨稀過不疑上人院九經通大義一作通經又議經內典自應精簾冷連松影苔深減履聲相逢幸此日相失一作識恐來生覺路何門去師須引我行過雲花寶上人院九陌最幽寺吾師院復深煙霜同覆屋松竹雜成林鳥語境彌寂客來機自沉早知如到此應不帶朝簮過杜氏江亭上國千餘里逢春且勝逰暫聞新鳥戲似解旅人愁野色吞山盡江煙襯水流村醪須一醉無恨滯行舟過張雲舉院宿不喫胡麻飯杯中自得仙隔籬招好客掃室致芳筵家醖香醪嫩時新異果鮮夜深唯畏曉坐穩豈思眠棊罷嫌無敵詩成貴在前明朝題壁上誰得衆人傳過欽上人院有相無相身唯師説始真修篁半庭影清磬幾僧鄰古壁丹青落虛簷鳥雀馴伊余求了義羸馬往來頻過無可上人院寥寥聽不盡孤磬與踈鍾煩惱師長別清涼我暫逢蟻行經古蘚鶴毳落深松自想歸時路塵埃復幾重過城南僧院寺對逺山起幽居仍是師斜陽通暗隙殘雪落踈籬松靜鶴栖定廊虛鍾盡遲朝朝趨府吏來此是相冝過靈泉寺偶尋靈迹去幽徑入氲氛轉壑驚飛鳥穿山踏亂雲水從岩下落溪向寺前分釋子逰何處空堂日漸曛過天津橋晴望間立津橋上寒光動逺林皇宫對嵩頂清洛貫城心雪路𥘉晴出人家向晚深自從王在鎬天寶至如今春日逰慈恩寺年長歸何處青山未有家賞春無酒飲多看寺中花逰天台上方曉上上方髙處立路人羡我此時身白雲向我頭上過我更羡他雲路人逰終南山䇿杖度溪橋雲深步數勞青猿吟嶺際白鶴坐松梢天外浮煙逺山根野水交自緣名利繫好此結蓬茒逰杏溪蘭若踏淂度溪灣晨逰暮不還月明松影路春滿杏花山戲狖跳林末髙僧住石間未肯離腰組來此復何顔逰謝公亭行行方避夢又到謝亭來舉世皆如此伊余何處廽竹鮮多透石泉潔亦無苔坐與僧同語誰能顧酒杯界清仙飈石上起海日夜中明何計長來此間眠過一生逰昊天玄都觀性同相見易紫府共間行隂徑紅桃落秋壇白石生蘚文連竹色鶴語應松聲風定藥香細樹深泉氣清垂簷靈草影繞壁古山名圍外坊無禁歸時踏月明同裴起居厲侍御放朝逰曲江暑月放朝頻青槐路絶塵雨晴江色出風動一作度草香新獨立分幽島同行得靜人此歡宜稍滯此去與誰親曉望華清宫曉看樓殿更鮮明遙隔朱欄見鹿行武帝自知身不死教修玉殿號長生夏日登樓晚望避暑髙樓上平蕪望不窮鳥穿山色去人歇樹隂中數帶長河水千條弱栁風暗思多少事懶話與芝翁霽後登樓髙樓𥘉霽後逺望思無窮雨洗青山淨春蒸大野融碧池舒暖景弱栁嚲和風為有登臨興獨吟落照中早夏郡樓宴集官散有間情登樓步稍輕窗雲帶雨氣林鳥雜人聲曉日襟前度微風酒上生城中會難得掃壁各書名夜宴太僕田卿宅故人九寺長邀我此同歡永夜開筵靜中年飲酒難微風侵燭影疊漏過林端臘後分朝日天明幾刻殘春日同會衛尉崔少卿宅詩家會詩客池閣曉𥘉晴鳥盡山中語琴多譜外聲映花相勸酒入洞各題名踈野常如此誰人信在城軍城夜會軍城夜禁樂飲酒每題詩坐穩吟難盡寒多醉較遲逺鍾經一作驚漏壓微月𬒳燈欺此會誠堪惜天明是別離晦日宴劉值録事宅花落鶯飛深院靜滿堂賔客盡詩人城中杯酒家家有唯是君家酒送春宴光祿田卿宅行裏開華館珍羞次第嘗春風酒影動晴日樂聲長久坐難辭醉衰年亦暫狂殷勤還繼燭永夕夢相妨會將作崔監東園牆北走紅塵牆東接一作飛白雲山光衣上見藥氣酒中聞此會誠堪惜窮秋日又曛人間唯有醉醉後復何云同諸公會太府韓卿宅九寺名卿才思雄邀歡筆下與杯中六街鼓絶塵埃息四座筵開語笑同𦦨焰蘭缸明狹室丁丁玉漏彂深宫即聽鳴唱天門曉吏事相牽西復東乞酒聞君有美酒與我正相冝溢甕清如水粘杯半似脂豈唯消舊病且要引新詩况此便便腹無非是滿巵寄衛拾遺乞酒老人罷巵酒不醉已經年自飲君家酒一杯三日眠味輕花上露色似洞中泉莫厭時時寄須知法未傳乞新茶嫩緑微黃碧澗春採時聞道斷葷辛不將錢買將詩乞借問山翁有幾人西掖寓直春曉聞殘漏直廬仙掖近春氣曙猶寒隱隱銀河在丁丁玉漏殘微風飄更切萬籟雜應難鳯閣明𥘉啓雞人唱漸闌靜宜來禁裏清是下雲端我識朝天路從容自整冠杭州郡齋南亭符印懸腰下東山不得歸獨行南北近漸老往還稀迸笋侵窗長驚蟬出樹飛田田池上葉嘗是使君衣郡中西園西園春𣣔盡芳草徑難分靜語唯幽鳥間眠獨使君密林生雨氣古石帶潮文雖去清秋逺朝朝見白雲杭州官舍偶書錢塘刺史謾題詩貧𥚹無恩懦少威春盡酒杯花影在潮回畫檻水聲微間吟山際邀僧上暮入林中看鶴歸無術理人人自理朝朝漸覺簿書稀省直書事默默滄江老官分右掖榮立朝班近殿奏直上知名曉霧和香氣晴樓下樂聲蜀箋金屑膩月兔筆毫精禁樹非煙覆宫墻瑞草生露盤秋更出玉漏晝還清碧蘚無塵染寒蟬似鳥鳴竹深雲自宿天近日先明孱懦難封詔踈愚但擲觥素餐終日足寧免衆人輕杭州官舍即事臨江府署清間坐一作卧復間行苔蘇踈塵色梧桐出雨聲漸除一作知身外事暗作道家名更喜仙山近庭前藥自生假日書事呈院中司徒十日公府靜巾􅌨起清晨寒蟬近衰栁古木似髙人學佛寧憂老為儒自喜貧海山歸未得芝术夢中春書縣丞舊􅈦宫殿一作樓閣半山上人家向下居古􅈦眠易魘老史語多虛雨水澆荒竹溪沙擁廢渠聖朝收外府皆是九天除縣中秋宿鼓絶門方掩蕭條作吏心露垂庭際草螢照竹間禽棊罷嫌無月眠遲聽盡砧還知未離此時復更相尋夏夜宿江驛竹屋􅎔江岸清宵興自長夜深傾北斗葉落映橫塘渚閙漁歌響風和角粽香却愁南去棹早晚到瀟湘陕城即事左右分京闕黃河與宅連何功來此地竊位已經年天下才彌小關中鎮最先隴山望可見惆悵是窮邊姚少監詩集卷第八
