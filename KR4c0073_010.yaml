front:
  text: 姚少監詩集卷第十
  hash: sha256:768259aea39e56d1d787ed8b4c9f01e4dcc85899ce0b1419a292cc5611aedf4d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_010-1a}
body:
  text: 花木鳥獸噐用哀挽雜詠五十七首和李𥙷闕曲江㸔蓮花露荷迎曙發灼灼復田田乍見神應駭頻来眼尚顛光凝珠有蔕熖起火無煙粉膩黄絲蘂心重碧玉錢日浮秋轉䴡雨洒晚彌鮮酔艶酣千朶愁紅思一川緑莖扶蕚正翆菂滿房圓淡暈還殊衆繁英得自然髙名猶不厭上客去争先景逸傾芳酒懐濃習綵牋海霞寕有態蜀錦不成妍容至應消病僧来欲破禅暁多􅎔水立夜只傍堤眠金似明沙渚燈疑宿浦船風驚樷乍宻魚戯影微偏穠彩燒晴霧殷姿纈碧泉畫工投粉筆宫女弃花鈿鳥恋驚難起蜂偷困不前遶行香爛熳折贈意纏綿誰計江南曲風流合管絃和王郎中召㸔牡丹葩叠蕚相重燒欄復照空妍姿朝景裏酔艶晚烟中乍恠霞􅎔砌還疑燭出籠遶行驚地赤移坐覺衣紅殷䴡開繁朶香濃彂㡬樷裁綃様豈似染茜色寕同嫰畏人看損鮮愁日炙融婵姢涵宿露爛熳抵春風縦賞襟情合閒吟景思通客来㱕盡懶鶯恋語無窮萬物珎那比千金買不充如今難更有縦有在仙宫詠南池嘉蓮芙蓉池裏葉田田一本㕠花出碧泉濃澹共妍香各散東西分艶蒂相連自知政術無他異縦是禎祥亦偶然四野人聞皆盡喜争来入郭看嘉蓮種葦欲種數莖葦出門来徃頻近陂牧本土選地問幽人静㸔唯思長𥘉移未覺匀坐中尋竹客将去更逡廵採松花擬服松花無䖏學嵩陽道士忽相教今朝試上髙枝採不覺傾翻仙鶴巢詠新菊黄金色未足摘耴且嘗新一作新嘗若待重陽日何曽異衆人一作香楊桺枝詞五首黄金絲掛粉墻頭動似顛狂静似愁逰客見時心自醉無囙得見謝家樓葉葉如眉翆色濃黄鶯偏恋語從容橋邊陌上無人識雨湿烟和思萬重江上東西離別饒舊條折盡折新條亦知春色人将去猶勝狂風取次飄二月楊花觸䖏飛悠悠漠漠自東西謝家詠雪徒相比吹落庭前便作泥江亭楊栁折還垂月照深黄㡬樹絲見説隋隄枯已盡年年行客恠春遅郡中冬夜聞蛩秋蛩聲尚在切切起蒼苔乆是忘情者今還有事来微霜風稍静圓月霧𥘉開此思誰能遣應湏執酒杯聞新蝉寄李餘年六月蝉應到每到聞時骨欲驚今日槐花還似彂却愁聴盡更無聲聞蝉寄賈島未秋吟便苦半咽半随風禅客心應乱愁人耳願聾一作禅客聞心乱愁人願耳聾雨晴煙一作髙樹裏日晚古城中逺思應難盡誰當與我同題鶴雏羽毛生未足一作齊嶛峭醜扵鷄夜一作每夜穿籠出擣衣碪上棲詠鶯春来深谷雪方消鶯別寒林傍翠條到䖏為憐煙景好隔簾多爱語聲嬌不同蜀魄啼殘月唯逐天鷄囀詰朝少婦聴時思舊曲玉樓從此動雲韶老馬卧来扶不起唯向主人嘶惆悵東郊道秋来雨作泥詠鏡鑄為明鏡絶塵埃翡翠窓前掛玉臺繡帶共尋龍口出菱花争向匣中開孤光長見鵉蹤在分䖏還囙鵲影廻好是照身冝謝女嫦娥飛向月宫来詠破屏風時人嫌古画倚壁不曽收露滴膠山断風吹綃海秋殘雲飛屋裏片水落床頭尚勝凡花鳥君能𥙷綴不古碑荒田一片石文字滿青苔不是逢閑客何人肯讀来拾得古硯僻性爱古物終歲求不獲昨朝得古硯黄河灘之側念此黄河中應有昔人宅宅亦作流水斯硯未変易波瀾所激觸背面生罅隙貭狀朴且醜今人作不得捧持且驚歎不敢施筆墨或恐先聖人嘗用修六籍置之㓗净室一日三磨拭大喜豪貴嫌乆長得保惜斐大夫見過湖南譙國盡英髦心事相期莭義髙觧下佩刀無所惜新聞天子付三刀謝韜光上人贈百齡藤杖衰病近来行少力光公乞我百齡藤閑来杖此向何䖏過水縁山只訪僧詠貴逰貴逰多爱向春深到䖏香凝數里塵紅杏花開連錦障緑楊隂合拂朱輪鳯凰尊畔飛金盞絲竹聲中酔玉人日暮垂鞭共㱕去西園賔客附龍鱗窮邉詞二首将軍作鎮古汧洲水膩山春莭氣柔清夜滿城絲管散行人不信是邉頭箭利弓調四鎮兵蕃人不敢近東行沿邊千里渾無事唯見平安大入城劒噐詞三首聖朝能用将破敵速如神掉劔龍纒臂開旗火滿身積屍川有㟁流血野無塵今日當場舞作湏應知是戦人晝一作夜渡黄河水将軍險用師雪光一作聲偏著甲風力不禁旗陣変龍虵活軍雄鼔角知今朝重起舞記得戦酣時破虜行千里三軍意氣麤展旗遮日黒驅馬飲一作踏河枯鄰境求兵畧皇㤙索陣圖元和太􅊭楽自古恐應無従軍楽二首毎日尋兵籍經年別酒徒眼疼長不校肺病且還無僮僕驚衣窄親情覺語麤幾時得㱕去依舊作山夫朝朝十指痛唯署點兵符貧賤依前在顛狂一半無身慚山友棄膽頼酒盃扶誰道従軍楽年来鑷白鬚敬宗皇帝挽詞三首徔諫停東幸垂衣寳暦昌漢昭登位少周代卜年長綵仗三清路麻衣萬國䘮玄宫今一閉終古柏蒼蒼晚色啟重扉旌旗路漸移荆山鼎成日湘浦竹班時臣子終身感山園七月期金莖㸔尚在承露復何為紫陌起仙飈川原共寂寥靈輴萬國䕶儀殿百神朝漏滴秋風路笳吟灞水橋㣲臣空感咽踊絶覺天遙文宗皇帝挽詞三首垂拱開成化愔愔雅楽全千官方就日四海忽無天堯舜非傳子殷周但卜年聖功青史外刋石在陵前代以無為理車書萬國同継兄還付弟授聖悉推公雲霧疑無日笳簫別起風金莖難復見寒露落空中龍㱕攀不淂髯在侍臣邉徹奠新阡起登山吉徔全関河佳氣散夷夏哭聲連寂寞玄宫閉朝昏千萬年荘恪太子挽詞二首暁漏啟嚴城宫臣縞素行靈儀先鹵簿新謚在銘旌雲晦郊原色風連霰雪聲凄凉望苑路春艸即應生寒日青宫閉玄堂渭水濵華夷牋乍絶凶吉禮空新薤露歌連哭泉扉夜作晨吹笙今一去千古在逡廵哭硯山孫道士服儒師道吉旨糲食卧中林誰識先生事無身是本心空山流水逺故國白雲深日夕誰来哭唯應猨鳥吟哭費拾遺徴君脩短皆由命暗懐師出塵豈知脩道者難免不亾身永秘黄庭訣髙懸漉酒巾可憐白犬子閑吠逺行人哭賈島二首白日西邉没滄波東去流名雖千古在身已一生休豈料文章逺那知瑞艸秋曾聞有書劒應是別人收杳杳黄泉下嗟君向此行有名傳後世無子過今生新墓松三尺空堦月二更徔今舊詩卷人覓冩應争楊給事師臯哭亾爱姬英英竊聞詩人多賦囙而継和真珠為土玉為塵未識遥聞鼻亦辛天上還應收至寳世間難得是佳人朱絲自断虚銀燭紅粉潜銷冷繡茵見説忘情唯有酒夕陽對酒更傷神喜覧泾州盧侍御詩卷新詩十九首麗一作髙格出青冥得䖏神應駭成時力盡停正愁聞更喜沉醉見還醒自是天才徤非関筆硯靈喜覧裴中丞詩卷新詩盈道路清䪨似𫾣金調格江山峻功夫日月深蜀牋方入冩越客始消吟後軰難知䖏朝朝枉用心心懐霜𣣔識為欲苦秋霜若在心神清方耿耿氣肅覺沉沉皓素中方委嚴凝得更深依稀輕夕渚髣髴在寒林思劲凄孤䪨聲酸激冷吟還如飲冰士勵莭望知音聴僧雲端講經無生深旨誠難觧唯是師言得正真逺近持亝来諦聴酒坊魚市盡無人臘日獵健天結束執旌旗暁渡長江自合圍野外狐狸搜得盡天邉鴻鴈射来稀蒼鷹落日飢唯急白馬平川走似飛蜡莭畋逰非為已莫驚刺史夜深師聞魏州賊破生靈蘇息到元和上将功成自執戈煙霧掃開尊北岳蛟龍斬断净南河旗廻海眼軍容壮兵合天心殺氣多從此四方無一事朝朝雨露是㤙波南一作黄下第枉為郷里舉射鵠藝渾踈㱕路羞人問春城賃舎居閉門辭雜客開箧讀生書以此投一作求知已還囙勝自餘得舍弟書親戚多離散三年獨在城貧居深稳卧一作睡晚學弟有書至異郷無地行悲歡相併起何䖏説心情病僧三年病不出苔蘇滿藤鞋倚壁看經坐聞鐘喫薬齋茶煙燻殺竹簷雨滴穿堦無睱頻相訪秋風一作来寂寞懐成名後留別從兄一辭山舍廢躬耕無事悠悠住帝城爲客衣裳多不稳和人詩句固難精㡬年秋賦唯知病昨日春闈偶有名却出関東悲復喜㱕尋弟妹別仁兄佛舍見胡子有嘲明明復夜夜胡子卽成翁唯是真知性不来生㓕中太尉李徳裕自城外拜辞後㱕弊居瞻望音徽卽書一絶寄上千騎紅旗不可攀水頭獨立暮方還家人恠我渾如病罇酒休傾筆硯閑姚少監詩集卷第十終
