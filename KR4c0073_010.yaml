front:
  text: 姚少監詩集卷第十
  hash: sha256:768259aea39e56d1d787ed8b4c9f01e4dcc85899ce0b1419a292cc5611aedf4d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_010-1a}
body:
  text: 花木鳥獸器用哀挽雜詠五十七首和李輔闕曲江看蓮花露荷迎曙發灼灼復田田乍見神應駭頻來眼尚顛光凝珠有蒂熖起火無煙粉膩黃絲蘂心重碧玉錢日浮秋轉麗雨灑晚彌鮮醉艷酣千朵愁紅思一川緑莖扶蕚正翆菂滿房圓淡暈還殊衆繁英得自然髙名猶不厭上客去爭先景逸傾芳酒懷濃習綵箋海霞寧有態蜀錦不成妍容至應消病僧來欲破禪曉多􅎔水立夜只傍堤眠金似明沙渚燈疑宿浦船風驚叢乍密魚戲影微偏穠彩燒晴霧殷姿纈碧泉畫工投粉筆宫女棄花鈿鳥戀驚難起蜂偷困不前繞行香爛熳折贈意纏綿誰計江南曲風流合管絃和王郎中召看牡丹葩疊蕚相重燒欄復照空妍姿朝景裏醉艷晚煙中乍怪霞􅎔砌還疑燭出籠繞行驚地赤移坐覺衣紅殷麗開繁朵香濃彂幾叢裁綃樣豈似染茜色寧同嫩畏人看損鮮愁日炙融嬋姢涵宿露爛熳抵春風縱賞襟情合間吟景思通客來歸盡懶鶯戀語無窮萬物珍那比千金買不充如今難更有縱有在仙宫詠南池嘉蓮芙蓉池裏葉田田一本雙花出碧泉濃淡共妍香各散東西分艷蒂相連自知政術無他異縱是禎祥亦偶然四野人聞皆盡喜爭來入郭看嘉蓮種葦欲種數莖葦出門來往頻近陂牧本土選地問幽人靜看唯思長𥘉移未覺勻坐中尋竹客將去更逡巡採松花擬服松花無處學嵩陽道士忽相教今朝試上髙枝採不覺傾翻仙鶴巢詠新菊黃金色未足摘耴且嘗新一作新嘗若待重陽日何曽異衆人一作香楊柳枝詞五首黃金絲挂粉墻頭動似顛狂靜似愁逰客見時心自醉無因得見謝家樓葉葉如眉翆色濃黃鶯偏戀語從容橋邊陌上無人識雨濕煙和思萬重江上東西離別饒舊條折盡折新條亦知春色人將去猶勝狂風取次飄二月楊花觸處飛悠悠漠漠自東西謝家詠雪徒相比吹落庭前便作泥江亭楊栁折還垂月照深黃幾樹絲見説隋隄枯已盡年年行客怪春遲郡中冬夜聞蛩秋蛩聲尚在切切起蒼苔久是忘情者今還有事來微霜風稍靜圓月霧𥘉開此思誰能遣應須執酒杯聞新蟬寄李餘年六月蟬應到每到聞時骨欲驚今日槐花還似彂却愁聽盡更無聲聞蟬寄賈島未秋吟便苦半咽半隨風禪客心應亂愁人耳願聾一作禪客聞心亂愁人願耳聾雨晴煙一作髙樹裏日晚古城中逺思應難盡誰當與我同題鶴雛羽毛生未足一作齊嶛峭醜于雞夜一作每夜穿籠出搗衣砧上棲詠鶯春來深谷雪方消鶯別寒林傍翠條到處為憐煙景好隔簾多愛語聲嬌不同蜀魄啼殘月唯逐天雞囀詰朝少婦聽時思舊曲玉樓從此動雲韶老馬卧來扶不起唯向主人嘶惆悵東郊道秋來雨作泥詠鏡鑄為明鏡絶塵埃翡翠窗前挂玉臺繡帶共尋龍口出菱花爭向匣中開孤光長見鵉蹤在分處還因鵲影回好是照身冝謝女嫦娥飛向月宫來詠破屏風時人嫌古畫倚壁不曽收露滴膠山斷風吹綃海秋殘雲飛屋裏片水落床頭尚勝凡花鳥君能輔綴不古碑荒田一片石文字滿青苔不是逢間客何人肯讀來拾得古硯僻性愛古物終歲求不獲昨朝得古硯黃河灘之側念此黃河中應有昔人宅宅亦作流水斯硯未變易波瀾所激觸背面生罅隙質狀朴且醜今人作不得捧持且驚歎不敢施筆墨或恐先聖人嘗用修六籍置之潔淨室一日三磨拭大喜豪貴嫌久長得保惜斐大夫見過湖南譙國盡英髦心事相期莭義髙解下佩刀無所惜新聞天子付三刀謝韜光上人贈百齡藤杖衰病近來行少力光公乞我百齡藤間來杖此向何處過水緣山只訪僧詠貴逰貴逰多愛向春深到處香凝數里塵紅杏花開連錦障緑楊隂合拂朱輪鳯凰尊畔飛金盞絲竹聲中醉玉人日暮垂鞭共歸去西園賔客附龍鱗窮邉詞二首將軍作鎮古汧洲水膩山春莭氣柔清夜滿城絲管散行人不信是邉頭箭利弓調四鎮兵蕃人不敢近東行沿邊千里渾無事唯見平安大入城劒器詞三首聖朝能用將破敵速如神掉劔龍纒臂開旗火滿身積尸川有岸流血野無塵今日當場舞作須應知是戰人晝一作夜渡黃河水將軍險用師雪光一作聲偏著甲風力不禁旗陳變龍蛇活軍雄鼓角知今朝重起舞記得戰酣時破虜行千里三軍意氣粗展旗遮日黑驅馬飲一作踏河枯鄰境求兵略皇恩索陳圖元和太􅊭樂自古恐應無從軍樂二首每日尋兵籍經年別酒徒眼疼長不校肺病且還無僮僕驚衣窄親情覺語粗幾時得歸去依舊作山夫朝朝十指痛唯署點兵符貧賤依前在顛狂一半無身慚山友棄膽賴酒杯扶誰道從軍樂年來鑷白鬚敬宗皇帝挽詞三首徔諫停東幸垂衣寶曆昌漢昭登位少周代卜年長綵仗三清路麻衣萬國喪玄宫今一閉終古柏蒼蒼晚色啓重扉旌旗路漸移荆山鼎成日湘浦竹班時臣子終身感山園七月期金莖看尚在承露復何為紫陌起仙飈川原共寂寥靈輴萬國護儀殿百神朝漏滴秋風路笳吟灞水橋微臣空感咽踊絶覺天遙文宗皇帝挽詞三首垂拱開成化愔愔雅樂全千官方就日四海忽無天堯舜非傳子殷周但卜年聖功青史外刋石在陵前代以無為理車書萬國同繼兄還付弟授聖悉推公雲霧疑無日笳簫別起風金莖難復見寒露落空中龍歸攀不淂髯在侍臣邉徹奠新阡起登山吉徔全關河佳氣散夷夏哭聲連寂寞玄宫閉朝昏千萬年莊恪太子挽詞二首曉漏啓嚴城宫臣縞素行靈儀先鹵簿新諡在銘旌雲晦郊原色風連霰雪聲凄涼望苑路春草即應生寒日青宫閉玄堂渭水濵華夷箋乍絶凶吉禮空新薤露歌連哭泉扉夜作晨吹笙今一去千古在逡巡哭硯山孫道士服儒師道吉旨糲食卧中林誰識先生事無身是本心空山流水逺故國白雲深日夕誰來哭唯應猿鳥吟哭費拾遺徴君修短皆由命暗懷師出塵豈知修道者難免不亡身永祕黃庭訣髙懸漉酒巾可憐白犬子間吠逺行人哭賈島二首白日西邉沒滄波東去流名雖千古在身已一生休豈料文章逺那知瑞草秋曾聞有書劒應是別人收杳杳黃泉下嗟君向此行有名傳後世無子過今生新墓松三尺空階月二更徔今舊詩卷人覓寫應爭楊給事師臯哭亡愛姬英英竊聞詩人多賦因而繼和真珠為土玉為塵未識遙聞鼻亦辛天上還應收至寶世間難得是佳人朱絲自斷虛銀燭紅粉潛銷冷繡茵見説忘情唯有酒夕陽對酒更傷神喜覽涇州盧侍御詩卷新詩十九首麗一作髙格出青冥得處神應駭成時力盡停正愁聞更喜沉醉見還醒自是天才健非關筆硯靈喜覽裴中丞詩卷新詩盈道路清䪨似𫾣金調格江山峻功夫日月深蜀箋方入寫越客始消吟後輩難知處朝朝枉用心心懷霜𣣔識為欲苦秋霜若在心神清方耿耿氣肅覺沉沉皓素中方委嚴凝得更深依稀輕夕渚髣佛在寒林思徑凄孤䪨聲酸激冷吟還如飲冰士勵莭望知音聽僧雲端講經無生深旨誠難解唯是師言得正真逺近持亝來諦聽酒坊魚市盡無人臘日獵健天結束執旌旗曉渡長江自合圍野外狐狸搜得盡天邉鴻鴈射來稀蒼鷹落日飢唯急白馬平川走似飛蠟莭畋逰非為已莫驚刺史夜深師聞魏州賊破生靈蘇息到元和上將功成自執戈煙霧掃開尊北嶽蛟龍斬斷淨南河旗回海眼軍容壯兵合天心殺氣多從此四方無一事朝朝雨露是恩波南一作黃下第枉為鄉里舉射鵠藝渾踈歸路羞人問春城賃舍居閉門辭雜客開篋讀生書以此投一作求知已還因勝自餘得舍弟書親戚多離散三年獨在城貧居深穩卧一作睡晚學弟有書至異鄉無地行悲歡相併起何處説心情病僧三年病不出苔蘇滿藤鞋倚壁看經坐聞鐘喫藥齋茶煙燻殺竹簷雨滴穿階無睱頻相訪秋風一作來寂寞懷成名後留別從兄一辭山舍廢躬耕無事悠悠住帝城為客衣裳多不穩和人詩句固難精幾年秋賦唯知病昨日春闈偶有名却出關東悲復喜歸尋弟妹別仁兄佛舍見胡子有嘲明明復夜夜胡子即成翁唯是真知性不來生滅中太尉李德裕自城外拜辭後歸弊居瞻望音徽即書一絶寄上千騎紅旗不可攀水頭獨立暮方還家人怪我渾如病樽酒休傾筆硯間姚少監詩集卷第十終
