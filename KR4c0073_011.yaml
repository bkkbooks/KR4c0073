body:
  text: 唐書載合子姚崇傳中甚略余按合乃宰相崇之曽孫未詳其字元和十一年李逢吉知舉進士調武功主簿世號姚武功又為冨􅊭萬年尉寶應中歷監察殿中御史户部貟外郎出荆杭二州刺史為户刑二部郎中諌議大夫給事中陕虢觀察使開成末終祕書監與馬戴費冠卿殷堯藩張籍逰喜採僧詩如清教云香連雲舍像雲容云木末上明星荆州僧云犬熟護鄰房吟之不輟李頻師之方玄英哭之云入室幾人為弟子為儒是處哭先生仰止極矣隱湖晉潛在丁酉春朝識于追雲舫中天啓丁卯余梓極玄集乃姚武功取王維至戴叔倫二十餘人詩一百首曰此詩家射雕手也遂願遘其本集卒不可得偶閲緇林法語見移花兼蝶至買石得雲饒十字叱謂禪悟後語既讀主客圖方知出武功手繼從紀事又讀一日看除目終年損道心豈食煙火人能道隻字廣搜慱訪十有餘年真所謂求之不得窹寐􅋠服也逮崇禎壬午秋忽從餳籠中獲此本凡十卷蓋吾宗圖記印抄宋刻豈武功有靈錫我百朋耶擊莭欣賞三日夜急授諸梓未知海內亦有如飢如渴如余者否但未及招與公于臨頓里中亦用率更筆法與浪仙長吉㜶美洵一恨事晉又識此浙本也川本編次稍異余向藏宋治平四年王頥石刻武功縣中詩三十首詮次不同縣去亰城遠一方拙天然性二微官如馬足三縣僻仍寥落四簿書多不會五曉鐘驚睡覺六自下青山路七性踈常愛卧八日出方能起九客至皆相笑十一日看除目十一作吏荒城裡十二誰念東山客十三鄰里皆相愛十四窮逹天應與十五閉門風雨裡十六朝朝眉不展十七簿藉誰能問十八腥羶都不食十九宦名渾不計二十假日都無事草一一官無限日草二朝朝門不閉草三欲依循循術草四漫作容身計草五主印三年坐草六長憶青山下草七自知狂僻性草八作吏渾無􅋠草九門外青山路三十其字句差池夾注行間石本今已失去每咏表聖亡書久似憶良朋之句為之泫然晉又識
