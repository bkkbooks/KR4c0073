front:
  text: 姚少監詩集卷第四
  hash: sha256:9ab52b5a869da20f50e4199009af129888f13b947f92b279a37e0722ae192088
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_004-1a}
body:
  text: 寄贈下四十四首寄送盧拱祕書遊魏州元和中太行山下路荆棘昨來平一自開元後今逢上客行地形吞北虜人事接東京掃灑氛埃靜遊從氣味生薊門春不艷淇水暖還清看野風情逺尋一作緣花酒病成官間身自在詩逸語縱橫一作詩好語分明車馬回應晚煙光滿去程秋晚夜坐寄院中諸曹長腰間垂印囊白髮未歸鄉還往應相責朝昏亦自傷窮愁山影峭獨夜漏聲長寂寞難成寐寒燈侵曉光書懷寄友人精心奉北宗微宦在南宫舉世勞為適開門事不窮四鄰寒稍靜九陌夜方空知老何山是思歸愚谷中寄無可上人十二門中寺詩僧寺獨幽多年松色別後夜磬聲秋見世慮皆盡來生事更修終須執瓶鉢一作屨相逐入牛頭寄暉上人日出月復沒悠悠昏與明修持經幾劫清淨到今生林下知無相人間苦是情終期逐師去一作作禪去不擬老塵纓寄李干尋常自怪詩無味雖𬒳人吟不喜聞見説與君同一格數篇到火却休焚寄賈島浪仙悄悄掩門扉窮窘自維縶世途已昧履生計復乖緝踈我非常性端峭爾孤立往還縱云久貧蹇豈自習所居率荒野寧似在京邑院落夕彌空蟲聲鴈相及衣巾半僧施𬞞藥常自拾凛凛寢席單翳翳竈煙濕頽籬里人度敗壁鄰燈入曉思巳暫舒暮愁還更集風淒林葉萎苔糝行徑澀海嶠誓同歸橡栗充朝給寄九華費拾遺逍遙罾繳外髙鳥與濳魚闕下無朝籍林間有詔書夜眠青玉洞曉飯白雲𬞞四海人空老九華君獨居此心誰復識日與世情踈寄不疑上人是法修行遍方棲不二門隨緣嫌寺著見性覺經繁所歎身將老始聞師一言塵沙千萬劫劫盡佛長存寄主客劉郎中漢朝共許賈生賢遷謫還應是宿緣仰德多時方會面拜兄何暇更論年嵩山晴色來城裏洛水寒光出岸邊清景早朝吟麗思題詩應費益州箋寄周十七起居鼕鼕九陌鼓聲齊百辟朝天馬亂嘶月照濃霜寒更逺風吹紅燭舉還低官清立在金爐北仗下歸眠玉殿西莫笑老人多獨出晴山荒景覓詩題秋夜寄默然上人霜月靜幽居間吟夢覺𥘉秋深夜迢遞年長意蕭踈海上歸難遂人間事盡虛賴師方便語漸得識真如寄王玄伯夜歸曉出滿衣塵轉覺才名帶纍身莫覔舊來一作時終日醉世間杯酒屬間人寄山中友人昨秋今復春役役是非身海上無歸路城中作老人流年何處在白日每朝新聞有長生術將求未有因寄陜府內兄郭冏端公蹇鈍無大計酷嗜進士名為文性不髙三年住西京相府執文柄念其心專精薄藝不退辱特列為門生事出非自意喜常少於驚春榜四散飛數日遍八紘眼始見花發耳得聞鳥鳴免同去年春兀兀聾與盲家寄河朔間道路出陜城聧違逾十年一會豁素誠同遊山水窮狂飲飛大觥起坐不相離有若親弟兄中外無親踈所算在其情久客貴優饒一醉舊疾平家逺歸思切風雨甚亦行到兹戀仁賢淹滯一月程新詩忽見示氣逸言縱橫纒綿意千里騷雅文發明永晝吟不休咽喉乾無聲羇貧重金玉今日金玉輕寄蔡州蔣亭兼簡田使君幾歲亂軍裏蔣亭名不銷無人知舊徑有藥長新苗樹宿山禽靜池通野水遙何因同此醉永望思蕭條山居寄友生獨在山阿裏朝朝遂性情曉泉和雨落秋草上墻生因客始沽酒借書方到城詩情聊自遣不是趂聲名寄崔之仁山人不得之仁消息久秋來體色復何如苦將一作痛持杯酒判身病狂作文章信手書官職卑微從客笑性靈間野一作雅向錢踈幾時月一作家計渾無事㨂取深山一處居寄主客劉貟外禹錫蟬稀蟲唧唧露重思悠悠靜者多便夜豪家不見秋同歸方欲就一作遂微恙幾時瘳今日滄江上何人理釣舟山中寄友人路歧何渺邈在客易蹉跎却是去家逺因循住日多幾看春草緑又見塞鴻過未有進身處忍教拋薜蘿寄友人日暮掩重扉抽簮復解衣漏聲林下靜螢色月中微秋霽露華結夜深人語稀殷勤故山路誰與我同歸寄李餘卧疾窮節彌慘栗我詎自云樂伊人嬰疾恙所對唯苦藥寂寞行稍稀清羸餐自薄幽齋外浮事夢寐亦簡略雪戶掩復明風簾卷還落方持數杯酒勉子同斟酌寄白石師師無名常居白石谷中因為號白石師何在師禪白石中無情雲可比不食鳥難同屨下蒼苔雪龕前瀑布風相尋未有計只是禮虛空寄賈島踈拙秪如此此身誰與同髙情向酒上無事在山中漸老病難理久貧吟益空賴君時訪宿不避北齋風寄默然上人晨餐夜復眠日與月相連天下誰無病人間樂是禪幾生通佛性一室但香煙結得無為社還應有宿緣寄不出院僧不行門外地齋戒得淸真長食施來飯深居鎖定身朝昏常傍佛起坐省逢人非獨心長淨衣無一點塵萬年縣中雨夜會宿寄皇甫甸縣齋還寂寞夕雨洗蒼苔清氣燈微潤寒聲竹共來蟲移上階返客一作人起到門回想得吟詩處唯應一作應當對酒杯寄舊山隱者別君須臾間曆日兩度新念彼白日長復值人事并未改當時居心事如野雲朝朝恣行坐百事都不聞奈何道未盡出山最艱辛奔走衢路間四枝俗作肢不屬身名在進士場筆毫爭等倫我性本朴直詞理一作野安得文縱然自稱心又不合衆人以此名字低不如風中塵昨逢賣藥客云是居山鄰説君憶我心憔悴其形神昔是同枝鳥今作萬里分萬里亦未進喧靜終難羣所居秋夕寄李廓羇滯多共趣屢屢同空眠稍暇更訪詣寧唯候招延愧君備𬞞藥識我性所便罷吏童僕去灑掃或自專古巷人易息踈逈自江邊幸當中秋夕復此無雲天月華更漏清露葉光彩鮮四鄰亦悄悄中懷益纒綿兹境罕能致居間得彌偏數杯罷復飲共想山中年贈盧大夫將軍將軍身在城詎得虜塵清釀酒邀間客吟詩直禁營蒼鷹春不下戰馬夜空鳴碣石應無業皇州獨有名上山嫌髀重拔劍歎衣生公議今如此登壇到即行贈供奉僧次融會解如來意僧家獨有君開經對天子騎馬過聲聞本寺逺於日新詩髙似雲熱時吟一句涼冷勝秋分贈王尊師先生自説􅌡洲路多在青松白石間海岸夜中常見日仙宫深處却無山犬隨鶴去遊諸洞龍作人來問大還今日偶聞塵外事朝簪未擲復何顔贈常州院僧一住毗陵寺師應秪信緣院貧人施食窗靜鳥窺禪古磬聲難盡秋燈色更鮮仍聞開講日湖上少魚船贈盧沙彌小師怕見世間事削頭披佛衣年小未受戒會解如老師天與出家腸一食齋不飢麻履踏雪路與馬不肯騎嫌我身腥羶似我見戎夷彼比見會異對面成別離我師文宣王立教垂詩書但全仁義心自然便慈悲兩教大體同無處辨一作辨是非莫以衣服別到頭不相知贈張籍太祝妙絶江南曲凄涼愍女詩古風無手敵新語是人知飛動應一作終由格功夫過却竒麟臺一作儒書添集卷樂府換歌詞李白應先拜一作許劉禛一作郎必自疑貧須君子救病合國家醫野客開山借鄰僧與米炊甘貧辭聘幣依選受官資多見愁連曉稀聞債盡時聖朝文物盛太祝獨低眉贈兵郎中繞籬栽杏種黃精曉侍罏煙暮出城萬事將身求揔易學君難得是長生贈王建司馬久向空門隱交親亦不知文髙輕古意官冷似前資老覺僧齋健貧還酒債遲仙方小字寫行坐把相隨贈任士曹憲皇十一祀共得春闈書道直淹曹掾命通侍玉除浮生年月促九陌笑言踈何計同歸去滄江有弊廬贈劉義自君離海上垂釣更何人獨宿空堂雨間行九陌塵避時曾變一作改姓救難似嫌身何處相期宿咸陽酒市春贈僧紹明西方清淨路此路出何門見説師知處從來佛不言今生多病惱自曉至黃昏唯寐方無事郍堪夢亦喧贈張質山人先生居處僻荆棘與墻齊酒好寧論價詩狂不著題燒成度世藥踏盡上山梯懶聽間人語一作疑道人間語爭如谷鳥啼贈少室山麻襦僧秪辮麻為衲此中經幾春庵前多猛獸徑小絶行人泉近濆一作漬瓶履山深少垢塵想師正法指喻我獨迷津贈王山人賢哲論猶誕吾宗次定今詩吟天地廣覺印果因深教演歸恭敬名標中外欽既能施六度了悟逹雙林贈終南山傅山人七十未成事終南蒼鬢翁老來詩興苦貧去酒腸空蟠蟄身仍病鵬搏力未通巳無燒藥本唯有著書功白馬時何晚老君度關事也青龍歲欲終星紀躔次之義生涯枯葉下家口亂雲中潭靜魚驚水天晴鶴唳風悲君還姓傅獨不夢髙宗姚少監詩集卷第四
