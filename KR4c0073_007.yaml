front:
  text: 姚少監詩集卷第七
  hash: sha256:0ed4283d099742ed71b5f113d4214da51148e32759e4cace067e90714ede174d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_007-1a}
body:
  text: 題詠四十九首題鳯翔西郭新亭􅒾郭塵埃外新亭制度竒地形當要處人力是間時結搆方殊絶髙低更合冝棟梁清俸買松竹逺山移佛一作僧寺幽難敵仙家景一作境可追一作遺良功慙巧盡上客恨逢遲兩面寒一作清波漲當前軟一作嫩栁垂清虛冝月入涼冷勝風吹宴賞軍容靜登臨樂妓隨魚龍聽絃管鳬鶮識旌旗泛鷁春流濶飛觴白日欹間花一作雲長在户嫩蘚乍緣墀永望情無極頻來困不辭雲峰晴轉出一作翠煙樹曉逾滋向野惟貪靜􅎔空遽覺危行人如不到逰樂更何為一作逰樂信虛為題金州西園九首江榭亭亭白雲榭下有清江流見江不得親不如波上鷗有榭江可見無榭無雙眸藥堂僮僕不到閾雙扉常自關四壁畫逺水堂前聳秋山時聞有仙鼠竊藥簷隙間草閣編草覆柏椽軒扉皆竹織閣成似僧居學僧居未得有時公府勞還復來此息松壇盤盤松上蓋下覆青石壇月中零露垂日出露尚漙山翁稱絶境海橋無所觀葼徑藥院徑亦髙往來踏葼影方當繁暑日草屩微微冷愛此不能行折薪坐煎茗垣竹種竹愛庭際亦以資玩賞窮秋雨蕭條但見墻垣長宣尼髙數仭固應非土壤石庭布石滿山庭磷磷潔還清幽人常履此月下屐齒鳴藥草枝葉動似向山中生莓苔茅堂階豈髙數寸是苔蘚只恐秋雨中窗户亦不濺眼前無此物我情何由遣芭蕉屏芭蕉叢叢生月照參差影數葉大如牆作我門之屏稍稍聞見稀耳目得安靜杏溪十首杏溪桃花四散飛桃子壓枝垂寂寂青隂裏幽人舉步遲殷勤念此徑我去復來誰蓮塘方塘菡蓞髙繁豔相照耀幽人夜眠起忽疑野中􆇐曉尋不知休白石岸亦峭架水藤濛濛紫花藤下復清溪水若遣隨波流不如風飄起風飄或近堤隨波千萬里石潭曉向潭上行夕就潭邊宿清冷無波瀾潎潎魚相逐釣翁坐不起見我往來熟溪路此路何瀟灑永無公卿迹日日多往來藜杖與桑屐路邊何所有磊磊青渌石望江峯念昔有此峯在彼江陵先舉世未能知遇亦望同賢我來心益悶𣣔上天公箋杏水不與江水接自出林中央穿花復逺水一山聞杏香我來持茗甌日屢此來嘗渚上竹葉葉新春筠下復清淺流微風屢此來決決復修修詩人月下吟月墮吟不休楓林堰森森楓樹林護此石門堰杏隄數里餘楓影覆亦遍鸕鷀與釣童質異同所願石瀨散漫復潺湲半砂半和石清風波亦無厯厯魚可搦我來亦屢久歸路常日夕陕下厲玄侍御宅五題濯纓溪舊山寧要去此有濯纓泉曉景松枝覆秋光月色連行尋屐齒盡坐對角巾偏寂寂幽棲處無妨請俸錢垂釣亭由釣起茅亭柴扉復竹楹波清見絲影坐久識魚情白鳥依窗宿青蒲傍砌生欲同漁父舍須自減逢迎吟詩島幽島蘚層層詩人日日登坐危石是榻吟冷唾成氷靜對唯秋水同來只一作但老僧竹一作松枝題字處小篆復誰能竹裏徑微徑嬋娟裏唯聞靜者知迹深苔長處步狹笋生時髙是連幽樹窮應到曲池紗巾靈壽杖行樂復相冝泛觴泉不上酒家樓池邊日獻酬杯來轉巴字客坐繞方流酹滴苔文斷泉連石岸秋若能山下置歲晚願同逰題僧院引泉泉眼髙千尺山僧耴得歸架空橫竹引鑿石透渠飛洗藥溪流濁澆花雨力微朝昏長繞看護惜似持衣題家園新池數日自穿池引泉來近陂尋渠通咽處繞岸待清時深好求魚飬間堪與鶴期幽聲聽難盡入夜睡常遲詠盆池浮萍重疊水團圓客繞千遭屐齒痕莫驚池裏尋常滿一井清泉是上源買太湖石我嘗逰太湖愛石青嵯峨波瀾取不淂自後長咨嗟竒哉賣石翁不傍豪貴家屓石聽苦吟雖貧亦來過貴我辨識精取價復不多比之昔所見珍怪頗更加背面淙注痕孔隙若琢磨水稱至柔物湖乃生壯波或云此天生嵌空亦非他氣質偶不合如地生江河置之書房前曉霧常紛羅碧光入四鄰墻壁難蔽遮客來謂我宅忽若巖之阿天竺寺殿前立石輔天殘片女媧拋撲落禪門壓地拗霹靂劃深龍舊欔屈槃痕淺乕新㧓苔粘月眼風挑剔塵結雲頭雨磕敲秋至莫言長矻立春來自有薜蘿交杭州觀潮樓有章亭號濤來自古今勢連滄海闊色比白雲深怒雪驅寒氣狂雷散大音浪髙風更起波急石難沉鳥懼多遙過龍驚不敢吟拗如開玉穴危似走瓊岑但禠千人魄那知伍相心岸摧連古道洲漲踣叢林跳沫山皆濕當江日半隂天然與禹鑿此理遣誰尋題李頻新居賃居求賤處深僻任人嫌蓋地花如繡當門竹勝簾勸僧嘗藥酒教僕辨一作認書簽庭際山冝小休令著石添寄題縱上人院營營是與非前樂後還悲今世已如此他生願似師禪房空旦暮畫壁半陳隋繞徑一作竹蒼苔迹幽人來是誰題山寺千重山崦裏樓閣影參差未暇尋僧院先看置寺碑竹深行漸暗石穩坐多時古塔蟲蛇善隂廊鳥雀癡雲開上界近泉落下方遲為愛青桐葉因題滿樹詩題貞女祠此女骨為土貞名不可移精靈閟何處蘋藻奠空祠水石生異狀杉松無病枝我來方謝雨延滯失歸期題刑部馬貟外修行里南街新居帝里誰無宅青山秪屬君間窗連竹色幽砌上苔文逺近髙低樹東􅒾南北雲朝朝常獨見免𬒳四鄰分題郭侍郎親仁里幽居入門塵外思苔徑藥苗間洞裏應生玉庭前自有山帝城唯此靜朝客更誰間野鶴松中語時時去復還題宣義池亭春入池亭好風光暖更蘚尋芳行不困逐勝坐還遷細草亂如髮幽禽鳴似絃苔文翻古篆一作畫石色學秋天花落能漂酒萍開解避船暫來還差一作猶愈疾久住合成仙迸笋搘階起垂藤壓樹偏此生應借看自計一作謂買無錢題薛十二池亭每日樹邊消一日繞池行過又須行異花多是非時有好竹皆當要處生斜立小橋看島勢逺移幽石作泉聲浮萍著岸風吹歇水面無塵晚更清題大理崔少卿駙馬林亭每來歸意懶都尉似山人臺榭栖一作停雙鷺松篁隔四鄰迸泉清勝雨深洞暖如春更看題詩處前軒粉壁新題杭州南亭舊隱即雲林思歸日日深如今來此地無復有前心古石生靈草長松栖異禽暮潮簷下過濺浪濕衣襟題鄭一作崔駙馬林亭東園連宅起勝事與心期幽洞自生藥新篁迸入池密林行不盡芳草坐難移石翠疑無質鶯歌似有詞莎臺髙出樹蘚壁淨題詩我獨多來賞九衢人不知題厲玄侍御所居幽棲一畞宫清峭似山峰鄰里不通徑俸錢唯買松野人時寄宿谷鳥自相逢朝路床前是誰知曉起慵題田將軍宅焚香書院最風流莎草緣墻緑蘚秋近砌別穿澆藥井臨街新起看山樓棲禽戀竹明猶在間客觀花夜未休好是暗移城裏宅清涼渾得似江頭題崔駙馬宅心在林泉身在城鳯凰樓下得間名洞中見鑿尋仙路月裏猶燒煮藥鐺數樹異花皆敕賜並竿修竹自天生詩人多説離君宅不得青苔地上行題河上亭亭亭河上亭魚躑水禽鳴九曲何時盡千峯今日清晨光秋更逺暑氣夏常輕杯裏移檣影琴中有浪聲岸莎連砌靜漁火入窗明來此多沉醉神髙無宿酲題長安薛貟外水閣亭亭新閣成風景益鮮明石盡太湖色水多湘渚聲翠筠和粉長零露逐荷傾時倚髙窗望幽尋小徑行林踈看鳥語池近識魚情政暇招間客唯將酒送迎題梁國公主池亭􅊭陽池館枕秦川門鎖南山一帶煙素奈花開西子面緑榆枝種沈郎錢裝簾玳瑁隨風落庭岸鵁鶄趂暖眠寂寞空餘歌舞地玉簫驚起鳯歸天寄題尉遲少卿郊居卿侍在關東林居思不窮朝衣挂壁上廄馬放田中隅坐唯禪子隨行只藥童砌莎留宿露庭竹出清風濃翠生苔點辛香彂桂叢蓮池伊水入石徑逺山通愚者心還靜髙人迹自同無能相近住終日羡鄰翁姚少監詩集卷第七
