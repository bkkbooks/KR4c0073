front:
  text: 姚少監詩集卷第二
  hash: sha256:ebdf4478e7c1db323f52b92eedff7f4c69eaab41c1cb17da9d4d76d20e916569
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_002-1a}
body:
  text: 送別下四十三首送張宗原東門送客道春色如死灰一客失意行十客顔色低住者既無家去者又非歸窮愁一成􅍚百藥不可一作能治子賢我且愚命分不合齊誰開蹇躓門日日同遊栖子行何所之切切食與衣誰能買仁義令子無寒飢野田不生草四向生路歧士人甚啇賈終日須東西鴻鴈春北去秋風復南飛勉君向前路無失相見期送王求士有經世籌自無活身策求食道路間勞困甚徒役我身與子同日被飢寒迫側望卿相門難入堅如石為農昧耕耘作商迷貿易空把書卷行投人一作入買罪責六月南風多苦旱土色赤坐家心尚焦况乃逺作客羸馬出郭門餞飲曉連夕願君似醉腸莫謾生憂蹙送朱慶餘及第後歸越勸君緩上車鄉里有吾廬未得同歸去空令相見踈山晴棲鶴起天曉落潮𥘉此慶將誰比獻送君一壷酒相別野庭邊馬上過秋色舟中到錦川峽猿啼夜雨蜀鳥噪晨煙莫便不回首風光促幾年送杜立歸蜀迢遞三千里西南是去程杜陵家巳盡蜀國客重行雪照巴江色風吹棧閣聲馬嘶山梢暖人語店𥘉明旅夢心多感孤吟氣一作意不平誰為李白後為訪錦官城送韓湘赴江西從事年少登科客從軍詔命新行裝有兵器祖席盡詩人細雨湘城暮微風楚水春潯陽應足鴈夢澤豈無塵猿呌來山頂潮痕在樹身從容多暇日佳句寄須頻送潘傳秀才歸宣州李白墳三尺嵯峨萬古名因君還故里為我吊先生晴日移虹影空山出鶴聲老郎間未得無計此中行送僧默然出家侍母前至孝自通禪伏曰江頭別秋風檣下眠鳥聲猿更促石色樹相連此路多如此師行亦有緣送陟遐一作霞上人遊天台萬疊赤城路終年遊客稀朝來送師去自覺有家非石淨山光逺雲深海色微此詩成亦鄙為我寫巖扉送盛秀才赴舉重重吳越浙江潮刺史何門始得消五字州人唯有此四鄰風景合相饒橘村籬落香潛度竹寺虛空翠自飄君去九衢須説我病成踈懶懶趨朝送僧貞實歸杭州天笁石橋寺裏最清涼聞説茆庵寄上方林外猿聲連院磬月中潮色到禪牀他生念我身何在此世唯師性亦忘九陌相逢千里別青山重疊樹蒼蒼送盧二弟茂才罷舉遊洛謁新相踏碎作賦筆驅車出上京離筵俯歧路四坐半公卿守命貧難擲憂身夢數驚今朝赴知已休詠苦辛行送任畹及第歸蜀中覲親子規啼欲死君聽固一作故無愁闕下聲名出鄊中意氣遊東川橫劒閣南斗近刀州神聖題前字千人看不休送杜觀罷舉東遊秋風離九陌心事豈云安曾是求名苦當知此去難辛勤程自逺寂寞夜多寒詩句無人識應須把劒看送狄兼譽下第歸故山慈恩塔上名昨日敗垂成賃舍應無直居山豈釣聲半年猶小隱數日得間行映竹窺猿劇尋雲探鶴情愛花髙酒戶煮藥汚茶鐺莫便多時住煙霄路在城送源中丞赴新羅赤墀賜對使殊方官重霜臺紫綬光玉節在船清海怪金函開詔拜夷王雲晴漸覺山川異風便那一作寧知道路長誰得似君將雨露海東萬里􅎈扶桑送陳倜一作稠赴江陵從事荆州勝事衆皆聞幕下今朝又得君才子何須藉一作中科第男兒終久要功勳江村竹樹多於草山路塵埃半是雲新什定知饒景思不應一向賦從軍送張郎中副使赴澤路曉陌事戎裝風流粉署郎機籌一作權通變化除拜出尋常地冷饒霜氣山髙礙鴈行應無離别恨車馬自生光送陸暢侍御歸楊州故園偏接近霅水洞庭邊歸去知何日相逢各長年山川南北路風雪別離天楚色窮冬燒淮聲獨夜船從軍丞相府談笑酒杯前送韋瑶校書赴越寄家臨禹穴乘傳出秦關霜落橘滿地潮來帆近山相門賔益貴水國事多間晨省髙堂後餘歡杯酒間送雍陶及第歸覲獻親冬集書比橘復何如此去關山逺相思笑語踈路尋丹一作青壑斷人近白雲居幽石題名處憑君亦紀一作記余送李秀才赴舉羅剎樓頭醉送君西入京秦吳無限地山水半分程海上煙霞濕關中日月明登科舊鄉里當為改嘉名送李傳秀才歸宣州謝守青山宅山孤宅亦平池塘無復見春草野中生常日登樓望今朝送客行殷勤拂石壁為我一書名送元緒上人遊商山萬法空門裏師修歷幾生過來心巳悟未到行彌精溪寂鐘還度林昏錫獨鳴朝簪抽未得此別豈忘情送僧栖真歸杭州天笁寺吏事日紛然無因到佛前勞師相借問知我亦通禪古寺杉松出殘陽鐘磬連草庵盤石上歸此是因緣送敬法師歸福州結得隨緣伴蟬鳴方出關新經譯舊寺故國與誰還齋為無鐘早心因罷講間東南數千里何處不逢山送清敬闍梨歸浙西大地無生理吳中豈是歸自翻貝葉偈人施福田衣夏盡灘聲出潮來日色微郡齋師去後寂寞夜吟稀送賈島及鍾渾日日攻詩亦自強年年供應在名場春風驛路歸何處紫閣山邊是草堂送僧遊邊師向邊頭去邊人業障輕腥羶齋自潔部落講還成傳教多離寺隨緣不計程三千世界內何處是無生送澄江上人赴興元鄭尚書招師經非紙上師佛在心中覺路何曾異行人自不同水雲晴亦一作忽雨山木一作舍夜多風聞結西方社尚書待逺公送馬戴下第客遊昨來送君處亦是九衢中此日殷勤别前時寂寞同鳥啼寒食雨花落暮春風向晚離人起筵收樽未空送薛二十三郎中赴婺州我住浙江西君去浙江東日日心來往不畏浙江風送獨孤煥評事赴豐州東門携酒送廷評結束從軍塞上行深磧路移唯馬覺斷蓬風起與雕平煙生逺戍侵雲色氷疊黃河長雪聲須鑿燕然山上石登科記裏是間名送張齊物主簿赴內鄉幾年山下事仙翁名在長生籙籍中燒得藥成須寄我曾為主簿與君同送王嗣之典儀城日日思朝位偷間城外行唯求採藥者一作法不道在官名一作行好異嫌山淺尋幽喜徑生病來文字拙不要把歸城別賈島懶作住山人貧家日賃身書多筆漸重睡少枕長新野客狂無過詩仙瘦始真秋風千里去誰與我相親一作官家月賃身別李餘病童隨瘦馬難算往來程野寺僧相送河橋酒滯行足愁無道性久客會人情何計羇窮盡同居不出城别胡逸記得春闈同席試逡巡何啻十年餘今日相逢又相送豫乘五馬子單車惜別酒闌歌罷更遲留携手思量憑翠樓桃李華容猶歎月風流才器亦悲秋光隂不覺朝昏過歧路無窮早晚休似把剪刀裁別恨兩人分得一般愁欲別山川重疊逺茫茫欲別先憂別恨長紅芍藥花雖共醉影又分將鴛鴦有路髙低去鴻鴈南飛一兩行惆悵與君煙景逈不知何日到瀟湘別杭州醉與江濤別江濤惜我遊他年婚嫁了終到此江頭姚少監詩集卷第二
