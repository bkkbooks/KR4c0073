front:
  text: 姚少監詩集目録
  hash: sha256:d23d35149577768a71ef25dc4a6a724697133e969bc2eefefc09c1d8490b98a7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_000-1a}
body:
  text: 祕書少監杭州刺史姚合第一卷送別上五十首送狄尚書鎭太原送楊尚書祭西嶽送李侍御過夏州送李起居赴池州送劉詹事赴夀州送裴大夫赴亳州送韋僅行軍送劉禹錫赴蘇州二首送賈謩赴共城送裴宰君送顧非熊歸越送雍陶遊蜀送崔約歸揚州送李侍御赴行營送楊尚書赴東川送邢郎中赴太原送裴中丞赴華州送徐貟外赴河中送殷侍御赴同州送崔中丞赴鄭州送丁端公赴河隂送鄭尚書赴興元送田使君赴蔡州送無可上人遊􅁁送僧送宗愼言送家兄赴任送崔玄亮赴果州送喻校書歸毗陵送董正字歸常州送蕭正字往蔡州送田卓入華山送薛右司赴處州送王建往渭南送殷侍御遊山南送李植侍御送王澹送崔之仁送孫山人送費驤送楊少府送文著上人遊越送無可上人遊越送洛陽張貟外送田中丞入西蕃送王亀送崔􅀰中赴常州送林使君赴邵州送別友人第二卷送別下四十三首送張宗原送王求送朱餘慶及第歸送朱慶餘歸覲送任尊師歸蜀送友人遊蜀送杜立歸蜀送韓湘赴江西從事送潘傅歸宣州送僧黙然送陟遐上人送盛秀才赴舉送僧貞實歸杭州送盧二弟送任畹及第歸送杜觀送狄兼譽歸故山送源中丞赴新羅別李餘別胡逸惜別欲別別杭州送王玄伯第三卷􅀉贈上四十七首􅀉賈島􅀉王度居士􅀉楊茂卿校書􅀉杜師義􅀉李景先􅀉酬盧侍御􅀉主客張􅀰中􅀉李廓少府􅀉紫閣隠者􅀉楊巨源祭酒􅀉殷尭藩􅀉兩省閣老􅀉靈一律師􅀉黙然上人􅀉張傒􅀉李頻􅀉李群玉病中書事􅀉友人九日􅀉錢可復􅀉劉起居秋日􅀉李支使􅀉令狐楚相公􅀉東都白賔客􅀉裴起居􅀉狄拾遺􅀉山中舊友􅀉無名頭陁􅀉郁上人􅀉孫路秀才􅀉安陸友人􅀉馬戴􅀉賈司倉􅀉楊工部􅀉陜州王司馬􅀉賈島􅀉崔之仁山人􅀉嵩嶽程光範洛下夜會􅀉賈島􅀉華州李中丞􅀉朱諌議􅀉杭州崔貟外􅀉元緒上人􅀉白閣黙然􅀉丘元處士􅀉崔道士􅀉華州崔中丞􅀉祕書竇少監第四卷􅀉贈下四十四首􅀉送盧栱祕書􅀉院中諸曹長書懐􅀉友人􅀉無可上人􅀉暉上人􅀉李干􅀉賈島浪仙􅀉九華費拾遺􅀉不疑上人􅀉主客劉􅀰中􅀉周十七起居秋夜􅀉黙然上人􅀉王玄伯􅀉山中友人􅀉内兄郭端公􅀉􅃽亭兼簡田使君山居􅀉友生􅀉崔之仁山人􅀉主客劉貟外山中􅀉友人西園夜􅀫􅀉友人卧疾􅀉李餘􅀉白石師􅀉賈島􅀉黙然上人􅀉不出院僧􅀉皇甫甸􅀉舊山隠者􅀉李廓贈盧大夫􅀅軍贈供奉僧次融贈王尊師贈常州院僧贈盧沙彌小師贈張籍太祝贈丘郎中贈王建司馬贈任士曹贈劉义贈僧紹明贈張質山人贈少室山麻襦僧贈王山人贈終南山傅山人第五卷閑適五十一首閑居遣懐十首武功縣中三十首罷武功縣二首秋日閑居二首晚􅁨閑居閑居街西居三首閑居遣興閑居第六卷閑適時序風月六十二首荘居即事親仁里居荘居野行春日閑居獨居早春閑居原上新居将歸山山中述懐偶然書懐客舎有懐及第後夜中書事偶題感時憶山客遊旅懐迎春遊春十二首賞春春日即事春日江次揚州春詞三首寒食書事二首暮春書事別春夏夜春晚而中送春秋日有懐秋夕遣懐秋中夜坐同崔卿九月六日飲九日憶硯山舊居秋晚江次除夜二首晦日送窮三首詠雲詠雪郡中對雪對月八月十五夜㸔月賦月華臨静夜酬任疇雨中見􅀉和座主相公雨中作惡神行雨第七卷題詠四十九首題鳯翔西郭新亭題金州西園九首江榭垣竹薬堂石庭草閣莓苔松壇􅛟􅈳芭蕉屏杏溪十首杏溪蓮塘望江峯杏水架水藤渚上竹石潭溪路楓林堰石瀬陜下厲玄侍御宅五題濯纓溪竹裏􅈳垂釣亭汎觴泉吟詩島題僧院引泉題家園新池詠盆池買太湖石天笁寺殿前立石杭州􅀚潮題李頻新居􅀉題縱上人院題山寺題貞女祠題馬貟外新居題郭侍􅀰幽居題宣義池亭題薛十二池亭題崔駙馬林亭題杭州南亭題鄭駙馬林亭題厲玄侍御所居題田将軍宅題崔駙馬宅題河上亭題長安薛貟外水閣題梁園公主池亭􅀉題尉遲少卿郊居第八卷遊覽宴集五十首過張邯鄲荘過楊處士幽居過李䖏士山居過無可僧院放朝同遊曲江暁望華清宫夏日登樓晚望霽後登樓早夏郡樓宴集夜宴太僕田卿宅春日㑹崔少卿宅軍城夜㑹晦日燕劉録事宅宴光禄田卿宅會将作崔監東園同會太府韓卿宅乞酒􅀉衛拾遺乞酒乞新茶西掖寓直春暁聞殘屚杭州郡齋南亭郡中西園杭州官舎偶書省直書事杭州官舎即事假日書事呈院中司徒書縣丞舊㕔縣中秋􅀫夏夜􅀫江驛陜城即事第九卷和荅酬謝五十七首和令狐留守相公和髙諌議入翰苑和盧給事酬裴貟外和裴端公早朝和李相餞西蜀相公和座主相公秋日即亊和崔少監遊僧院和李紳不赴㸔花和李舎人冬至日和裴令公新成緑野堂即亊和題李相草堂和鄭相唱和詩和戸部侍􅀰省中暁歸和元八郎中秋居和酬白少傅見􅀉和劉禹錫拜表懐都故人和酬殷侍御見􅀉和李膳部秋夕和韓侍􅀰夜泛溪和題李中丞㕔和厲玄無可㑹􅀫見􅀉和令狐貟外直夜即事和孟侍御早朝見􅀉和友人新居園上和裴令公遊南荘和李舎人言懐和李舎人對雪荅李頻秀才荅胡遇荅友人招遊荅竇知言酬田就酬李貟外見􅀉酬令狐郎中見􅀉酬李廓望月見􅀉酬田卿末伏見􅀉酬薛奉常見贈之什酬盧汀諌議酬張郎中見􅀉酬田卿六韻見􅀉酬楊尚書喜移居酬田卿即事見􅀉酬張籍司業見􅀉謝田大夫􅀉茸氊葡萄謝李太尉牧杭州杏園宴上謝座主謝韜光上人謝秦校書無可上人見訪喜胡遇至喜賈島至喜喻鳬至喜雍陶秋夜訪􅀫喜賈島雨中訪􅀫喜馬戴見過同前訪僧法通不遇夜期友生不至尋僧不遇第十卷花木鳥獸器用哀挽雜詠五十七首和李􅀘闕㸔蓮花和王郎中召㸔牡丹詠南池嘉蓮題葡萄架􅆣種葦採松花詠新菊楊栁枝詞五首郡中冬夜聞蛩聞新蟬􅀉李餘聞蟬􅀉賈島題鶴雛詠鶯老馬詠鏡詠破屏風古碑拾得古硯裴大夫見過謝贈百齡藤杖詠貴遊窮􅁁詞二首劍器詞三首從軍樂二首敬宗皇帝挽詞三首文宗皇帝挽詞三首荘恪太子挽詞二首哭費拾遺徴君哭硯山孫道士哭賈島二首和楊給事哭愛􅁎喜覽盧侍御詩卷喜覽裴中丞詩卷心懐霜聽僧雲端講􅀴臘日獵聞魏州賊破下第得舎弟書病僧成名後留別從兄佛舎見胡子有嘲歸弊居􅀉李太尉姚少監詩集目録終
