front:
  text: 姚少監詩集􅃃第七
  hash: sha256:19881a2a31b9141b6a4c181224af302cda2e4f6c3dfed96b0e5f49059bcfe3a5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_007-1a}
body:
  text: 題詠四十九首題鳯翔西郭新亭􅒾郭塵埃外新亭制度竒地形當要䖏人力是閑時結搆方殊絶髙低更合冝棟梁清俸買松竹逺山移佛一作僧寺幽難敵仙家景一作境可追一作遺良功慙巧盡上客恨逢遅兩面寒一作清波漲當前軟一作嫩栁垂清虚冝月入凉冷勝風吹宴賞軍容静登臨楽妓随魚龍聴絃管鳬鶮識旌旗泛鷁春流濶飛觴白日欹閑花一作雲長在户嫰蘚乍縁墀永望情無極頻来困不辭雲峰晴轉出一作翠煙􅀣暁逾滋向野惟貪静􅎔空􅃍覺危行人如不到逰楽更何爲一作逰楽信虚爲題金州西園九首江榭亭亭白雲榭下有清江流見江不得親不如波上鷗有榭江可見無榭無雙眸藥堂僮僕不到閾雙扉常自関四壁畫逺水堂前􅋍秋山時聞有仙䑕􅀼藥簷隙間草閣編草覆柏椽軒扉皆竹織閤成似僧居學僧居未得有時公府勞還復来此息松壇盤盤松上蓋下覆青石壇月中零露垂日出露尚漙山翁􅁛􅅸境海橋無􅀁􅀚葼徑藥院徑亦髙徃来􅂿葼影方當繁暑日草屩㣲㣲冷爱此不􅀎行折薪坐煎茗垣竹種竹爱庭際亦以資翫賞窮秋雨蕭條但見墻垣長宣尼髙數仭固應非土壌石庭布石滿山庭磷磷㓗還清幽人常􅂂此月下􅄚齒鳴藥艸枝葉動似向山中生莓苔茅堂堦豈髙數寸是苔蘚只恐秋雨中窗户亦不濺眼前無此物我情何由遣芭蕉屏芭蕉樷樷生月照参差影數葉大如􅉹作我門之屏稍稍聞見稀耳目得安静杏溪十首杏溪桃花四散飛桃子壓枝垂􅄫􅄫青隂裏幽人舉􅇍遅慇懃念此徑我去復来誰蓮塘方塘菡蓞髙繁􅃩相照耀幽人夜眠起忽疑野中􆇐曉尋不知休白石㟁亦峭架水藤濛濛紫花藤下復清溪水若遣随波流不如風飄起風飄或近堤随波千萬里石潭曉向潭上行夕就潭􅁁􅀫清冷無波瀾潎潎魚相逐釣翁坐不起見我徃来熟溪路此路何瀟洒永無公卿跡日日多徃来藜杖與桑􅄚路􅁁何􅀁有磊磊青渌石望江峯念昔有此峯在彼江陵先舉世未􅀎知遇亦望同賢我来心益悶􅁒上天公牋杏水不與江水接自出林中央穿花復逺水一山聞杏香我来持茗甌日屡此来嘗渚上竹葉葉新春筠下復清淺流㣲風屡此来决决復脩脩詩人月下吟月墮吟不休楓林堰森森楓􅀣林䕶此石門堰杏隄數里餘楓影覆亦徧鸕鷀與釣童貭異同􅀁願石瀬散漫復潺湲半砂半和石清風波亦無厯厯魚可搦我来亦屡乆歸路常日夕陕下厲玄侍御宅五題濯纓溪􅃇山寕要去此有濯纓泉暁景松枝覆秋光月色連行尋􅄚齒盡坐對角巾偏􅄫􅄫幽棲䖏無妨請俸錢垂釣亭由釣起茅亭柴扉復竹楹波清見絲影坐乆識魚情白鳥依􅆤􅀫青蒲傍砌生欲同漁父舎湏自减逢迎吟詩島幽島蘚層層詩人日日登坐危石是榻吟冷唾成氷静對唯秋水同来只一作但老僧竹一作松枝題字䖏小􅂐復誰􅀎竹裏徑㣲徑婵娟裏唯聞静者知跡深苔長䖏歩狭笋生時髙是連幽􅀣窮應到曲池紗巾靈壽杖行楽復相冝泛觴泉不上酒家樓池􅁁日獻酬杯来轉巴字客坐遶方流酹滴苔文断泉連石㟁秋若􅀎山下置􅀊晚願同逰題僧院引泉泉眼髙千尺山僧耴得㱕架空横竹引鑿石透渠飛洗藥溪流濁澆花雨力微朝昏長遶㸔䕶惜似持衣題家園新池數日自穿池引泉来近陂尋渠通咽䖏遶㟁待清時深好求魚飬閑堪與鶴期幽聲聴難盡入夜睡常遅詠盆池浮萍重叠水團圓客遶千遭􅄚齒痕莫驚池裏尋常滿一井清泉是上源買太湖石我嘗逰太湖爱石青嵯峨波瀾取不淂自後長咨嗟竒㢤賣石翁不傍豪貴家屓石聴苦吟雖貧亦来過貴我辨識精取價復不多比之昔􅀁見珍恠頗更加背面淙注痕孔隙若琢磨水􅁛至柔物湖乃生壮波或云此天生嵌空亦非他􅂔貭偶不合如地生江河置之書房前暁霧常紛羅碧光入四隣墙壁難蔽􅃒客来謂我宅忽􅀂巖之阿天竺寺殿前立石􅀘天殘片女媧抛撲落禅門壓地􅉾霹􅆮劃深龍舊欔屈槃痕淺乕新㧓苔粘月眼風挑剔塵結雲頭雨磕敲秋至莫言長矻立春来自有薜蘿交杭州􅀚潮樓有章亭􅃅濤来自古今勢連滄海闊色比白雲深怒雪驅寒􅂔狂雷散大音浪髙風更起波急石難沉鳥懼多遥過龍驚不敢吟􅉾如開玉穴危似走瓊岑但禠千人魄那知伍相心岸摧連古道洲漲踣樷林跳沬山皆濕當江日半隂天然與禹鑿此理遣誰尋題李頻新居賃居求賤䖏深僻任人嫌蓋地花如綉當門竹勝􅄕􅂆僧嘗藥酒教僕辨一作認書簽庭際山冝小休令着石添􅀉題縦上人院營營是與非前樂後還悲今世已如此他生願似師禅房空旦暮􅀞壁半陳隋遶徑一作竹蒼苔跡幽人来是誰題山寺千重山崦裏樓閣影参差未暇尋僧院先㸔置寺碑竹深行漸暗石稳坐多時古塔蟲蛇善隂廊鳥雀癡雲開上界近泉落下方遅為爱青桐葉囙題滿􅀣詩題貞女祠此女􅇧為􅁟貞名不可移精靈閟何䖏蘋藻奠空祠水石生異状杉松無病枝我来方謝雨延滯失歸期題刑部馬貟外修行里南街新居帝里誰無宅青山秪屬君閑窓連竹色幽砌上苔文逺近髙低􅀣東􅒾南北雲朝朝常獨見免􅀍四隣分題郭侍􅀰親仁里幽居入門塵外思苔徑薬苗間洞裏應生玉庭前自有山帝城唯此静朝客更誰閑野鶴松中語時時去復還題宣義池亭春入池亭好風光暖更蘚尋芳行不困逐勝坐還􅁶細草亂如髪幽禽鳴似絃苔文翻古􅂐一作畫石色學秋天花落􅀎漂酒萍開觧避船暫来還差一作猶愈疾乆住合成仙迸笋搘堦起垂藤壓􅀣偏此生應借看自計一作謂買無錢題薛十二池亭每日􅀣􅁁消一日遶池行過又湏行異花多是非時有好竹皆當要䖏生斜立小橋㸔島􅀔逺移幽石作泉聲浮萍著㟁風吹歇水面無塵晚更清題大理崔少卿駙馬林亭每来㱕意􅂴都尉似山人臺榭栖一作停雙鷺松篁隔四隣迸泉清勝雨深洞暖如春更㸔題詩䖏前軒粉壁新題杭州南亭舊隠即雲林思㱕日日深如今来此地無復有前心古石生靈艸長松栖異禽暮潮簷下過濺浪濕衣􅁭題鄭一作崔駙馬林亭東園連宅起勝事與心期幽洞自生薬新篁迸入池宻林行不盡芳草坐難移石翠疑無貭鶯歌似有詞莎䑓髙出􅀣蘚壁浄題詩我獨多来賞九衢人不知題厲玄侍御􅀁居幽棲一畞宫清峭似山峰隣里不通徑俸錢唯買松野人時􅀉􅀫谷鳥自相逢朝路床前是誰知暁起慵題田将軍宅焚香書院最風流莎艸縁墻緑蘚秋近砌別穿澆藥井臨街新起㸔山樓棲禽戀竹明猶在閑客􅀚花夜未休好是暗移城裏宅清凉渾得似江頭題崔駙馬宅心在林泉身在城鳯凰樓下得閑名洞中見鑿尋仙路月裏猶燒煑薬鐺數􅀣異花皆勅賜竝竿脩竹自天生詩人多説離君宅不得青苔地上行題河上亭亭亭河上亭魚躑水禽鳴九曲何時盡千峯今日清晨光秋更逺暑􅂔夏常輕盃裏移檣影琴中有浪聲㟁莎連砌静漁火入􅆤明来此多沉醉神髙無􅀫酲題長安薛貟外水閤亭亭新閣成風景益鮮明石盡太湖色水多湘渚聲翠筠和粉長零露逐荷傾時􅀝髙􅆤望幽尋小徑行林踈看鳥語池近識魚情政暇招閑客唯􅀅酒送迎題梁國公主池亭􅊭陽池舘枕秦川門鏁南山一帯􅃄素柰花開西子面緑榆枝種沈􅀰錢装簾玳􅈘随風落庭㟁鵁鶄趂暖眠􅄫寞空餘歌舞地玉簫驚起鳯歸天􅀉題尉遅少卿郊居卿侍在関東林居思不窮朝衣掛壁上廐馬放田中隅坐唯禅子随行只薬童砌莎留􅀫露庭竹出清風濃翠生苔􅀧辛香彂桂樷蓮池伊水入石徑逺山通愚者心還静髙人跡自同無能相近住終日羡隣翁姚少監詩集􅃃第七
