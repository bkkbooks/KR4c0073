front:
  text: 姚少監詩集卷第四
  hash: sha256:9ab52b5a869da20f50e4199009af129888f13b947f92b279a37e0722ae192088
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_004-1a}
body:
  text: 􅀉贈下四十四首􅀉送盧拱秘書遊魏州元和中太行山下路荆􅁄昨來平一自開元後今逢上客行地形吞北虜人事接東京掃灑氛埃静遊從氣味生薊門春不艶淇水暖還清㸔野風情逺尋一作縁花酒病成官閑身自在詩逸語縱橫一作詩好語分明車馬廻應晚煙􅊍滿去程秋晚夜坐􅀉院中諸曹長腰間垂印嚢白髪未歸郷還往應相責朝昏亦自傷窮愁山影峭獨夜漏聲長􅄫寞難成寐寒燈侵暁光書懐􅀉友人精心奉北宗微宦在南宫舉世勞爲適開門事不窮四隣寒稍靜九陌夜方空知老何山是思歸愚谷中􅀉無可上人十二門中寺詩僧寺獨幽多年松色別後夜磬聲秋見世慮皆盡來生事更修終須執瓶鉢一作屨相逐入牛頭􅀉暉上人日出月復没悠悠昏與明脩持􅀴㡬刼清浄到今生林下知無相人間苦是情終期逐師去一作作禪去不擬老塵纓􅀉李干尋常自恠詩無味雖􅀍人吟不喜聞見􅀃與君同一格數篇到火􅁍休焚􅀉賈島浪仙悄悄掩門扉窮窘自維縶世途已昧履生計復乖緝踈我非常性端峭爾􅀌立徃還縱云乆貧蹇豈自習所居率荒野寜似在京邑院落夕彌空蟲聲鴈相及衣巾半僧施􅂼薬常自拾凛凛寝席單翳翳竈􅃄濕頽籬里人度敗壁隣燈入暁思巳暫舒暮愁還更集風淒林葉萎苔糝行􅈳澁海嶠誓同歸橡栗充朝給􅀉九華費拾遺逍遥罾繳外髙鳥與濳魚􅆣下無朝籍林間有詔書夜眠青玉洞曉飯白雲􅂼四海人空老九華君獨居此心誰復識日與世情踈􅀉不疑上人是法修行遍方棲不二門隨縁嫌寺着見性覺􅀴繁所歎身将老始聞師一言塵沙千萬刼刼盡佛長存􅀉主客劉郎中漢朝共許賈生賢遷謫還應是􅀫縁仰徳多時方會面拜兄何暇更論年嵩山晴色來城裏洛水寒光出岸􅁁清景早朝吟䴡思題詩應費益州牋􅀉周十七起居鼕鼕九陌皷聲齊百辟朝天馬亂嘶月照濃霜寒更逺風吹紅燭舉還低官清立在金鑪北仗下歸眠玉殿西莫􅀏老人多獨出晴山荒景覓詩題秋夜􅀉黙然上人霜月静幽居閑吟夢覺􅀄秋􅀷夜迢逓年長意蕭踈海上歸難遂人間事盡虚賴師方便語漸得識眞如􅀉王玄伯夜歸暁出滿衣塵轉覺才名帶累身莫覔舊來一作時終日醉世間盃酒屬閑人􅀉山中友人昨秋今復春役役是非身海上無歸路城中作老人流年何處在白日每朝新聞有長生術将求未有因􅀉陜府内兄郭冏端公蹇鈍無大計酷嗜進士名為文性不髙三年住西京相府執文柄念其心專精薄藝不退辱特列為門生事出非自意喜常少於驚春牓四散飛數日徧八紘眼始見花􅀤耳得聞鳥鳴免同去年春兀兀聾與盲家􅀉河朔間道路出陜城聧違逾十年一會豁素誠同游山水窮狂飲飛大觥起坐不相離有􅀂親弟兄中外無親踈所筭在其情乆客貴􅄖饒一醉舊疾平家逺歸思切風雨甚亦行到兹戀仁賢淹滯一月程新詩忽見示氣逸言縱横纒緜意千里騷雅文􅀤明永晝吟不休􅍋喉乾無聲覉貧重金玉今日金玉􅁿􅀉蔡州蒋亭兼簡田使君㡬􅀊亂軍裏蒋亭名不銷無人知舊􅈳有藥長新苗樹􅀫山禽静池通野水遥何因同此醉永望思蕭條山居􅀉友生獨在山阿裏朝朝遂性情暁泉和雨落秋草上墻生因客始沽酒借書方到城詩情聊自遣不是趂聲名􅀉崔之仁山人不得之仁消息乆秋來體色復何如苦􅀅一作痛持盃酒判身病狂作文章信手書官軄卑微從客􅀏性靈閑野一作雅向錢踈㡬時月一作家計渾無事㨂取深山一處居􅀉主客劉貟外禹錫蟬稀蟲唧唧露重思悠悠静者多便夜豪家不見秋同歸方欲就一作遂微恙㡬時瘳今日滄江上何人理釣舟山中􅀉友人路歧何􅄅邈在客易蹉跎􅁍是去家逺因循住日多㡬㸔春草緑又見塞鴻過未有進身處忍教抛薜蘿􅀉友人日暮掩重扉抽簮復解衣漏聲林下静螢色月中微秋霽露華結夜􅀷人語稀慇懃故山路誰與我同歸􅀉李餘卧疾窮節彌惨慄我詎自云樂伊人嬰疾恙所對唯苦藥􅄫寞行稍稀清羸飡自薄幽齋外浮事夢寐亦簡略雪戸掩復明風簾卷還落方持數盃酒勉子同斟酌􅀉白石師師無名常居白石谷中因為號白石師何在師禪白石中無情雲可比不食鳥難同屨下蒼苔雪龕前瀑布風相尋未有計只是禮虚空􅀉賈島踈拙秪如此此身誰與同髙情向酒上無事在山中漸老病難理乆貧吟益空賴君時訪􅀫不避北齋風􅀉黙然上人晨飡夜復眠日與月相連天下誰無病人間樂是禪㡬生通佛性一室但香煙結得無為社還應有􅀫縁􅀉不出院僧不行門外地齋戒得淸真長食施來飯深居鏁定身朝昏常傍佛起坐省逢人非獨心長浄衣無一􅀧塵萬年縣中雨夜會􅀫􅀉皇甫甸縣齋還寂寞夕雨洗蒼苔清氣燈㣲潤寒聲竹共來蟲移上階返客一作人起到門廻想得吟詩處唯應一作應當對酒杯􅀉舊山隠者別君須􅁷間暦日兩度新念彼白日長復值人事并未改當時居心事如野雲朝朝恣行坐百事都不聞柰何道未盡出山最艱辛奔走衢路間四枝俗作肢不屬身名在進士場筆毫争䒭倫我性本朴直詞理一作野安得文縱然自稱心又不合衆人以此名字低不如風中塵昨逢賣藥客云是居山鄰􅀃君憶我心顦顇其形神昔是同枝鳥今作萬里分萬里亦未進喧静終難羣所居秋夕􅀉李廓覉滯多共􅃐屢屢同空眠稍暇更訪詣寕唯候招延媿君備􅂼藥識我性所便罷吏童僕去灑掃或自專古巷人易息踈逈自江􅁁幸當中秋夕復此無雲天月華更漏清露葉光彩鮮四鄰亦悄悄中懐益纒綿兹境罕䏻致居閑得彌偏數盃罷復飲共想山中年贈盧大夫将軍将軍身在城詎得虜塵清釀酒邀閑客吟詩直禁營蒼鷹春不下􅀾馬夜空鳴碣石應無業皇州獨有名上山嫌䯗重拔劍歎衣生公議今如此登壇到即行贈供奉僧次融會解如來意僧家獨有君開経對天子􅀐馬過聲聞本寺逺於日新詩髙似雲􅀬時吟一句涼冷勝秋分贈王尊師先生自􅀃􅌡洲路多在青松白石間海岸夜中常見日仙宫深處却無山犬隨鶴去遊諸洞龍作人來問大還今日偶聞塵外亊朝簪未擲復何顔贈常州院僧一住毗陵寺師應秪信縁院貧人施食䆫静鳥窺禪古磬聲難盡秋燈色更鮮仍聞開講日湖上少魚船贈盧沙彌小師怕見世間事削頭披佛衣年小未受戒會解如老師天與出家腸一食齋不飢麻履踏雪路與馬不肯􅀐嫌我身腥羶似我見戎夷彼比見㑹異對面成別離我師文宣王立敎垂詩書但全仁義心自然便慈悲兩敎大體同無處辨一作辯是非莫以衣服別到頭不相知贈張籍太祝妙絶江南曲凄涼愍女詩古風無手敵新語是人知飛動應一作終由格功夫過却竒麟臺一作儒書添集卷樂府換歌詞李白應先拜一作許劉禛一作􅀰必自疑貧須君子救病合􅀦家醫野客開山借隣僧與米炊甘貧辭聘幣依選受官資多見愁連暁稀聞債盡時聖朝文物盛太祝獨低眉贈兵郎中繞籬栽杏種黃精暁侍罏􅃄暮出城萬事将身求揔易學君難得是長生贈王建司馬乆向空門􅀮交親亦不知文髙􅁿古意官冷似前資老覺僧齋徤貧還酒債遲仙方小字寫行坐把相隨贈任士曹憲皇十一祀共得春闈書道直淹曹􅁺命通侍玉除浮生年月促九陌􅀏言踈何計同歸去滄江有弊廬贈劉义自君離海上垂釣更何人獨􅀫空堂雨閑行九陌塵避時曾変一作改姓救難似嫌身何處相期宿咸陽酒市春贈僧紹明西方清浄路此路出何門見􅀃師知處從來佛不言今生多病惱自暁至黃昏唯寐方無事郍堪夢亦喧贈張質山人先生居處僻荆􅁄與墻齊酒好寕論價詩狂不著題焼成度世藥踏盡上山梯􅂴聴閑人語一作疑道人間語争如谷鳥啼贈少室山麻襦僧秪辮麻爲衲此中経㡬春庵前多猛獸􅈳小絶行人泉近濆一作漬瓶履山􅀷少垢塵想師正法指喻我獨迷津贈王山人賢哲論猶誕吾宗次定今詩吟天地廣覺印果因􅀷敎演歸恭敬名標中外欽旣䏻施六度了悟逹雙林贈終南山傅山人七十未成事終南蒼髩翁老來詩興苦貧去酒腸空蟠蟄身仍病鵬􅅮力未通巳無焼藥本唯有著書功白馬時何晚老君度関事也青龍􅀊欲終星紀􅄤次之義生涯枯葉下家口亂雲中潭静魚驚水天晴鶴唳風悲君還姓傅獨不夢髙宗姚少監詩集卷第四
