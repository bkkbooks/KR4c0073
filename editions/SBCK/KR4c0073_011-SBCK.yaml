body:
  text: 唐書載合子姚崇傳中甚略余按合乃宰相崇之曽孫未詳其字元和十一年李逢吉知舉進士調武功主簿世號姚武功又爲冨􅊭萬年尉寳應中歴監察殿中御史户部貟外􅀰出荆杭二州刺史爲户刑二部􅀰中諌議大夫給事中陕虢􅀚察使開成末終秘書監與馬戴費冠卿殷尭藩張籍逰喜採僧詩如清教云香連雲􅃕像雲容云木末上朙星荆州僧云犬熟䕶鄰房吟之不輟李頻師之方玄英􅂘之云入室㡬人為弟子為儒是䖏哭先生仰止極矣隠湖晉潜在丁酉春朝識于追雲舫中天啟丁夘余梓極玄集廼姚武功取王維至戴叔倫二十餘人詩一百首曰此詩家射雕手也遂願遘其本集䘚不可得偶閲緇林㳒語見移花兼蝶至買石得雲饒十字叱謂禅悟後語旣讀主客圖方知出武功手􅁇從紀事又讀一日看除目終年損道心豈食烟火人􅀎道􅃗字廣捜慱訪十有餘年眞􅀁謂求之不得窹􅄰􅋠服也迨崇禎壬午秋忽從餳籠中􅀗此本凡十􅃃盖吾宗圖記印抄宋刻豈武功有靈錫我百朋􅁘撃莭欣賞三日夜急授諸梓未知海内亦有如飢如渇如余者否但未及招與公于臨頓里中亦用率更筆法與浪仙長吉㜶美洵一恨事晉又識此浙本也川本編次稍異余向藏宋治平四年王頥石刻武功縣中詩三十首詮次不同縣去亰城遠一方拙天然性二㣲官如馬􅁕三縣僻仍寥落四簿書多不㑹五暁鐘驚睡覺六自下青山路七性踈常爱卧八日出方􅀎起九客至皆相笑十一日看除目十一作吏荒城􅂻十二誰念東山客十三鄰里皆相愛十四竆逹天應與十五閉門風雨􅂻十六朝朝眉不展十七簿藉誰􅀎問十八腥羶都不食十九䆠名渾不計二十假日都無事廿一一官無限日廿二朝朝門不閉廿三欲依循循術廿四漫作容身計廿五主印三年坐廿六長憶青山下廿七自知狂僻性廿八作吏渾無􅋠廿九門外青山路三十其字句差池夹注行間石本今已失去每咏表聖亾書乆似憶良朋之句為之泫然晉又識
