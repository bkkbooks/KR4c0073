body:
  text: 送别上五十首送狄尚書鎮太原授鉞儒生貴傾朝赴餞筵麾幢官在省禮樂將臨邊代馬龍相雜汾河海暗連逺戎移帳幕髙鳥避旌旃天下屯兵處皇威破虜年防秋嫌壘近入塞必身先中外恩重疊科名嵗接連散材無所用老向瑣闈眠送楊尚書祭西嶽報功嚴祀典寵詔下明庭酒氣飄林嶺香烟入杳㝠樂清三奏備詞直百神聴衣拂雲霞濕詩通水石靈何因逐騶騎暫得到巖扄送李侍御過夏州酬恩不顧名走馬覺身輕迢逓河邊路蒼茫塞上城砂寒無宿鴈虜近少閒兵飲罷揮鞭去旁人意氣生送李起居赴池州天子念疲民分憂輟侍臣紅旗髙起焰緑野靜無塵闕下親知别江南恵化新朝昏即千里且願話逡巡送劉詹事赴夀州慇勤莫遽起四坐悉同袍世上詩難得林中酒更髙隋堤傍楊柳楚驛在波濤别後書頻寄無辭費筆毫送裴大夫赴亳州杭人遮道路垂泣浙江前譙國迎舟艦行歌汴水邊周旋君量逺交代我才偏寒日嚴旌㦸晴風出管絃一杯誠淡薄四坐願留連異政承殊澤應為天下先送徐州韋僅行軍餞幕儼征軒行軍歸大藩山程度函谷水驛到夷門曉日詩情逺春風酒色渾逡巡何足貴所貴盡殘罇送劉禹錫郎中赴蘇州三十年來天下名銜恩東守闔閭城初經咸谷眠山驛漸入梁園問水程霽日滿江寒浪靜春風遶郭白蘋生虎丘野寺呉中少誰伴吟詩月裏行又州城全是故呉宫香徑難尋古蘚中雲水計程千里逺軒居送别九衢空鶴聲髙下聴無盡潮色朝昬望不同太守吟詩人自理小齋閒卧白蘋風送賈謨赴共城營田上國羞長一作平選戎裝貴所從山田依法種兵食及時供水氣詩書軟嵐烟筆硯濃㡬時無事擾相見得從容送裴宰君見説為官處烟霞思不窮夜猿啼户外瀑水落厨中名藥人難識仙山路易通還應施靜化誰復與君同送顧非熊下第歸越失意尋歸路親知不復過家山去城逺日月在船多楚塞數逢雁浙江長有波秋風别鄉去還聴鹿鳴歌送雍陶遊蜀春色三千里愁人意未開木梢穿棧出雨勢隔江来荒館因花宿深山羡客迴相如何物在應只有琴臺勢一作氣送崔約下第歸揚州滿座詩人吟送酒離城此㑹亦應稀春風下第時稱屈秋巻呈親自束歸日晩山花當馬落天隂水鳥傍船飛江邊道路多苔蘚塵土無由得上衣送李廓侍御赴西川行營不道弓箭字罷官惟醉眠何人薦籌策走馬逐旌旃陣變孤虛外功成語笑前從今嶲州路無復有烽烟送楊尚書赴東川郤縠詩書将銜恩赴梓州遶身垂印綬䕶馬執戈矛劍閣和銘峭巴江帶字流從来皆惜别此别復何愁送邢郎中赴太原上將得良策恩威作長城如今并州北不見有胡兵晉野雨初足汾河波亦清所從古無比意氣送君行送裴中丞赴華州我夢何曽應看君渡滻川自無仙掌分非是聖心偏去年曽夢除華州刺史故此叙述而已徑草多生藥庭花半落泉人間有此郡况在鳳城邊送徐員外赴河中從事赤府從軍羡儒衣結束輕凉飊下山寺曉浪滿關城閒坐饒詩景髙眠長道情將軍不戰術計日立功名送殷堯藩侍御赴同州吟詩擲酒船仙掌白樓前從事關中貴主人天下賢此生無了日終嵗踏離筵何計因歸去深山恣意眠送崔中丞赴鄭州僕射陂前郡清髙越四鄰丹霄鳯詔下太守虎符新霧濕關城月花香驛路塵連枝相庭樹嵗嵗一家春送丁端公赴河隂炎天木葉焦曉夕絶凉飈念子獨歸縣何人不在朝市連風浪動帆徹海門遥飲盡樽中酒同年同寂寥送鄭尚書赴興元儒有登壇貴何人得此功紅旗燒密雪白馬踏長風斧鉞來天上詩書理漢中方知百勝略應不在彎弓送田使君赴蔡州長年離别情百盞酒須傾詩外應無思人間半是行路遥嘶白馬林斷出紅旌功業今應立淮西有勁兵送無可上人遊邊一鉢與三衣經行逺近隨出家還養母持律復能詩春雪離京厚晨鐘近塞遲亦知蓮府客夜坐喜同師送僧人間擾擾唯閒事自見髙人只有詩寂寞嵩峰雲外寺常多夢裡過齋時送宋慎言童穉便知聞如今秪有君百篇詩盡和一盞酒須分驛路多連水州城半在雲離情同落葉向晩更紛紛送家兄赴任昭義早得白眉名之官濠上城别離浮世事迢逓長年情廣陌垂花影遥林起雨聲出關春草長過汴夏雲生黠吏先潛去疲人相次迎宴餘和酒拜魂夢共東行送崔𤣥亮赴果州冬夜宴韓卿宅蘭燭照重茵飛盃復㡬分主人寒不寢上客曉離羣騎吏緣青壁旌旗度白雲劍銘生蘚色巴字疊冰文華省思仙侣疲民愛使君泠泠唯自適郡邸有誰聞送喻鳬校書歸毘陵主人庭葉黒詩藁更誰書闕下科名出鄉中賦籍除山春烟樹衆江逺晩帆疎吾亦家呉者無因到弊廬送董正字武歸常州覲親路歧知不盡離别自無窮行客心方切主人罇未空楚檣収月下江樹在潮中人各還家去還家慶不同送蕭正字徃蔡州賀裴相淮西平相府旌旄重還邀上客行今朝郭門路初徹蔡州城從馬唯一作還提酒防身不要兵從來皆作使君去是時平送進士田卓入華山何物隨身去六經與一琴辭家計已久入谷住應深一作住谷跡應深偶坐僧同石閒書葉滿林業成須謁帝無貯白雲心送右司薛員外赴處州懐中天子書腰下使君魚瀑布和雲落仙都與世疎逺程兼水陸半嵗在舟車相送難相别南風入夏初送王建秘書徃渭南莊白鬚芸閣吏羸馬月中行莊僻難尋路官閒易出城看山多失飰過寺故題名秋日田家作唯添集巻成送殷堯藩侍御遊山南詩境西南好秋深晝夜蛩人家連水影驛路在山峰谷靜雲生石天寒雪覆松我為公府繫不得此相從送李植侍御聖代無邪觸空林獬豸歸誰知隴山鳥長繞玉樓飛風雨依山急雲泉入郭㣲無同昔年别别後寄書稀送王澹常省為官處門前數樹松尋山屐費齒書石筆無鋒果熟猿偷亂花繁鳥語重今來為客去惜一作借取最髙峰送崔之仁一作别劉得仁欲出還成住前程甚謫遷佯眠隨客醉愁坐似僧禪舊國歸何處春山買欠錢㡬時無一事長在故人邊送孫山人山翁來帝里不肯住多時一作山人言語質住世恨多時塵土衣裳重腥羶僕𨽻饑林中愁不到城外老應遲喧寂一為别相逢未有期送費驤兄寒弟亦饑力學少閒時何路免為客無門賣得詩㡬人擕酒送獨我入山遲少小同居止今朝始别離送河中楊少府宴崔駙馬宅鳳凰樓下醉醺醺晩出東門蟬漸聞不使鄉人修一作治驛路却將家累宿一作上山雲閒時採藥隨僧去毎月請錢共客分縣吏若非三載滿自知無計更尋君送文著上人逰越水石隨緣豈計程東呉相遇别西京夜禪月下袈裟濕曉上山巔錫杖鳴念我為官應易老羡師依佛學無生越中多少前朝寺處處鐵鐘石磬聲送無可上人遊越清晨相訪立門前麻履方袍一少年嬾讀經文求作佛願攻詩句覓昇一作成仙芳春山影花連寺觸夜潮聲月滿船今日送行偏惜别共師文字有因緣送洛陽張員外餞客未歸城東方騶騎迎千山嵩岳峭百縣洛陽清朔雁和雲度川風吹雨一作雪晴蘚庭公事暇一作少應祗獨吟行送少府田中丞入西蕃蕭闗路絶久石堠亦為塵䕶塞空兵帳和戎在使臣風沙去國逺雨雪換衣頻若問凉州事凉州多漢人送王龜處士送客客為誰朱門處士稀唯修曽子行不着老萊衣古寺隨僧飰空林共鳥歸壺中駐年藥燒得獻庭闈送崔郎中赴常州貴是鴒原在紫薇榮逢知巳領黄扉人間盛事今全得江上政聲復欲歸風起滿城山果落雨餘穿宅水禽飛昔年嘗作毗陵客石峭泉清天下稀送林使君赴邵州詔書飛下五雲間才子分符不等閒驛路算程多是水州圖管地少扵山江頭斑竹尋應遍洞裏丹砂自採還清淨化人人自理終朝無事更相關送别友人獨向山中覓紫芝山人勾引住多時摘花浸酒春愁盡燒竹煎茶夜卧遲泉落林梢多碎滴松生石底足旁枝明朝却欲歸城市問我來時總不知姚少監詩集巻一欽定四庫全書姚少監詩集巻二唐姚合撰送别下四十三首送張宗原東門送客道春色如死灰一客失意行十客顔色低住者既無家去者又非歸窮愁一成疾百藥不可一作能治子賢我且愚命分不合齊誰開蹇躓門日日同遊栖子行何所之切切食與衣誰能買仁義令子無寒飢野田不生草四向生路岐士人甚商賈終日須東西鴻雁春北去秋風復南飛免君向前路無失相見期送王求士有經世籌自無活身策求食道路間勞困甚徒役我身與子同日被饑寒迫側望卿相門難入堅扵石為農昧耕耘作商迷貿易空把書巻行投人一作入買罪責六月南風多苦旱土色赤坐家心尚焦况乃逺作客羸馬出郭門餞飲曉連夕願君似醉膓莫漫生憂蹙送朱慶餘及第後歸越勸君緩上車鄉里有吾廬未得同歸去空令相見疎山晴棲鶴起天曉落潮初此慶將誰比獻親冬集書送朱慶餘越中歸覲鄉書落姓名太守拜親榮訪我波濤郡還家霧雨城海山窓外近鏡水世間清何計隨君去鄰牆過此生送任尊師歸蜀覲親白雲修道者歸去春風前玉簡通仙籍金丹駐母年錦文江一色酒氣雨相連衆説君平死真師易義全送友人遊蜀
