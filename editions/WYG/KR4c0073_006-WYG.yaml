front:
  text: 適時序風月六十二首
  hash: sha256:ae27eaec85f4f891176fcad0942b7f76781ef338830c52694017d6106ff70b07
body:
  text: 莊居即事休看小字大書名向日持經眼却明時過無心求富貴身閒不夢見公卿因尋岳寺葷辛斷自到王城禮數生斜月照牀新睡覺窻風半夜鶴來聲親仁里居三年賃舎親仁里寂寞何曽似在城飲酒自縁防冷病尋人多是為閒行軒車無路通門巷親友因詩道姓名自别青山歸未得羨君長聴石泉聲莊居野行客行野田間比屋皆閉戸借問屋中人盡去作商賈官家不税商税農服作苦居人盡東西道路侵壠畝採玉上山顛探珠入水府邉兵索衣食此物同泥土古來一人耕三人食猶饑如今千萬家無一把鋤犁我倉常空虚我田生蒺藜上天不雨粟何由活烝黎春日閒居居止日蕭條庭前惟藥苗身閒眠自久眼荖視還遥簷燕酬鶯語鄰花雜絮飄客來無酒飲搔首擲空瓢獨居深閉柴門長一作多不出功夫自課少閒時翻音免問他人字覆局一作勢何勞對手棋生計如雲無定所窮愁似影巧一作毎相隨到頭歸向一作去青山是塵路茫茫欲告誰早春閒居寂寞日何為貧一作閒居春色遲驚風起庭雪寒雨長簷澌强飲區一作樽中事一作酒嘲山世外詩此生仍且在難與老相離原上新居秋來梨果熟行哭小兒饑鄰富雞長往莊一作家貧客漸稀借牛耕地晩賣樹納錢遲牆下當官道依前夾竹籬將歸山野人慣去山中住自到城來悶不勝宫樹蟬聲多却樂侯門月色少於燈饑來惟擬重餐藥歸去還應只别僧聞道舊溪茆屋畔春風新上數枝藤山中述懐為客乆未歸寒山獨掩扉曉來山鳥散雨過杏花稀天逺雲空積溪深水自微此情對春色盡醉欲忘機偶然書懐十年通籍入金門自愧名微枉縉紳錬得丹砂疑不食從兹白髪日一作自相親家山迢逓歸無路盃酒稀疎病到一作在身漢有馮唐唐有我老為郎吏更何人客舎有懐旅人無事喜終日一作夜思悠悠逢酒嫌盃淺尋書怕字稠貧來許錢聖夢覺見身愁寂寞中林下饑鷹望到秋及第後夜中書事夜睡常驚起春光屬野夫新銜添一字舊友遜前途喜過還疑夢狂來不似儒愛花持燭看憶酒犯街沽天上名應定人間盛更無報恩丞相閤何啻殺微軀偶題年年九陌看春還舊隠空勞夢寐間遲日逍遥芸草長聖朝清浄諫臣一作書閒偶逢遊客同傾酒自有前騶恥見山道侣書來相責誚朝朝欲報作一作又何顔感時憶昔未出身索寞無精神逢人話天命自賤如埃塵君今纔出身䬃爽鞍馬春逢人話天命自重如千鈞信涉名利道舉動皆喪真君今自世情何况天下人憶山閒處無人到乖疎稱野情日髙搔首起林下散衣行泉引窻前過雲看石罅生别來愁欲老虚負出山名客遊旅懐客行無定止終日路岐間馬為賒來貴僮因借得頑詩書愁觸雨店舎喜逢山舊業嵩陽下三年未得還迎春半年留醉待花開曉去迎春夜始迴風煖慢行尋曲水天晴逺望立髙臺亦知無處將詩請唯得終朝把酒催今日桞條全弄色遊人相伴看春來遊春十二首正月一日後尋春更不眠自知還近僻衆説過於顛看水寧依路登山欲到天悠悠芳思起多是晩風前卑官長少事僻縣又無城未曉衝寒起迎春忍病行樹枝風掉軟菜甲土浮輕好箇林間鵲今朝足喜聲詩酒相牽引朝朝思不窮苔痕雪水裏春色竹烟中迎雨縁池草摧花倚樹風書非名利事愛此少人同塵中主印吏誰遣有髙情趂煖簷前坐尋芳樹底行土融凝墅色氷敗滿池聲漸覺春相泥朝來睡不輕疎頑無異事隨例但添年舊厯藏深篋新衣薄絮綿暖風渾酒色晴日暢琴絃同伴無辭困遊春貴在先看春長不足豈更覺身勞寺裏花枝淨山中水色髙嫩一作懶雲輕似絮新草細如毛併起詩人思還應費筆毫悠悠小縣吏顦顇入新年逺思遭詩惱閒情被酒牽戀花林下飲愛草野中眠疎懶今成性誰人肯更憐處處春光遍遊人亦不稀向陽傾冷酒看影試一作着新衣嫩樹行移長幽禽語旋飛同來皆去盡衝夜獨吟一作行歸朝朝看春色春色似相憐酒醒鶯啼裏詩成蝶舞前摘花盈手露折竹滿庭煙親故多相笑疎狂似少年卑官還不惡行止得逍遥晴野花侵路春陂水上橋塵埃生暖色藥草長新苗看却煙光散狂風處處飄身被春光引經時更不歸嚼花香滿口書竹粉粘衣弄日鶯狂語迎風蝶倒飛自知疎懶性得事亦􅀿稀曉脱青衫出閒行氣味長一瓶春酒色數頃野花香朝客聞應羨山僧見亦一作似狂不將童僕去恐謂一作為損風光賞春閒人祇是愛春光迎得春來喜欲狂買酒怕遲令走馬看花嫌逺自移牀嬌鶯語足方離樹戲蝶飛髙始過牆顛倒醉眠三數日人間百事不思量春日即事春來眠不得誰復念生涯夜聽四鄰樂朝尋九陌花輕烟浮草色微雨濯年華乞假非關病朝衣在酒家春日江次野步出茒齋閒行坐石臺久悲鄉路逺猶喜杏花開鷗鷺皆飛去帆檣何處來因凝千里目落日尚徘徊揚州春詞三首廣陵寒食天無露復無煙煖日凝花栁春風散管絃園林多是宅車馬少於船莫喚遊人住遊人困不眠滿郭是春光街衢土亦香竹風輕履舄花露膩衣裳谷鳥鳴還艷山夫到亦狂可憐遊賞地煬帝國傾亡江北煙光裏淮南勝事多市􅆵持燭入鄰里漾船過有地惟栽竹無家不養鵝春風蕩城郭滿耳是笙歌寒食二首今朝一百五出戸雨初晴舞愛雙飛蝶歌聞百囀鶯江深青草岸花滿白雲城為政多孱懦應無酷吏名出城烟火少况復是今朝閒坐將誰語臨觴只自謡堦前春蘚徧衣上落花飄伎樂州人戲使君心寂寥暮春即事窮巷少芳菲蒼苔一徑微酒醒聞客别年長送春歸宿願眠雲嶠浮名繫鏁闈未因丞相庇難得脱一作解朝衣春晩雨中寂寞春將老閒人强自歡迎風鶯語澀帶雨蝶飛難傍砌木初長眠花景漸闌臨軒平目望情思若為寛送春昨吟一作迎今復送來晩去逡巡芳盡空繁樹愁多獨病身静思傾酒懶閑望上樓頻為向春風道明年早報春别春留春不得被春欺春若無情遣泥誰寂寞自疑生冷病淒涼還似别親知随風未辨歸何處澆酒唯求住少時一去近當三百日從朝至夜是相思夏夜閒齋深夜靜獨坐又閒行密樹月籠影疎籬水隔聲㫁猿時呌谷棲鳥每揺檉寂寞求名士誰知此夕情秋日有懐秋來不復眠但覺思悠然菊色欲經露蟲聲漸替蟬詩情生酒裏心事在山邊舊里無因到西風又一年秋夕遣懐昨宵白露下秋氣滿山城風勁衣巾脆窗虚筆墨輕臨書愛真跡避酒怕狂名秖擬随麋鹿悠悠過一生秋中夜坐疎散永無事不眠常夜分月中松露滴風引鶴同聞同衛尉崔少卿九月六日飲酒熟菊還芳花漂盞亦香與君先一醉舉世待重陽風色初晴利蟲聲向晩長此時如不飲心事亦應傷九日憶硯一作峴山舊居帝里閒人少誰同把酒杯硯山籬下菊今日幾枝開曉角驚眠起秋風引病來長年歸思切更值鴈聲催秋晩江次蕭蕭晩景寒獨立望江壖沙渚幾行鴈風灣一隻船落霞澄返照孤嶼隔微煙極目思無盡鄉心到眼前除夜二首衰殘歸未遂寂寞此宵情舊國當千里新年隔數更寒猶近北峭風漸向東生誰見一作想長安陌晨鐘度火城慇懃惜此夜此夜住逡巡燭盡年還别鷄鳴老更新儺聲方去疫酒色已迎春明日持盃處誰為最後人晦日送窮三首年年到此日瀝酒拜街中萬戸千門看無人不送窮送窮窮不去相泥欲何為今日官家宅淹留又幾時古人皆恨别此别恨消魂只是空相送年年不出門詠雲靄靄紛紛不可窮戛笙歌處盡隨龍來依銀漢一千里歸傍巫山十二峰呈瑞每聞開麗色避風仍見挂喬松憐君翠染雙蟬鬢鏡裏朝朝近玉容詠雪愁雲殘臘下陽臺混却乾坤六出開與月交光呈瑞色共花爭豔傍寒梅飛隨郢客歌聲逺散逐宫娥舞袖迴其那知音不相見剡溪乗興為君來郡中對雪霏微著草樹漸布與堦平逺近如空色飄颺無落聲飛鵶疑翅重去馬覺蹄輕遥想故山下樵夫應滯行對月銀輪玉兔向東流瑩淨三更正好遊一片黒雲何處起皂羅籠却水精毬八月十五夜看月亭亭千萬里三五復秋中此夕光應絶常時思不同九霄微有露四海靜無風惆悵逡巡别誰能看碧空賦月華臨靜夜長空埃􅅽滅皎皎月華臨色正秋將半光鮮夜自深九霄晴更徹四野氣難侵靜照遥山出孤明列宿沈髙人應不寐驚鵲復何心漏盡東方曉佳期何處尋酬任疇協律夏中苦雨見寄銀漢波瀾溢經旬雨未休細聴宜隔牖逺望憶髙樓風急飄還㫁雲低落更稠走童驚掣電饑鳥啄浮漚絲網張空際蛛繩續瓦溝青蛙多入戸潢潦欲勝舟雷怒疑山破池渾似土流灰人漫禳厭水馬恣沈浮廣陌應翻浪貧居恐作湫陽精藏不耀隂氣盛難収逺色重林暮繁聲四壁秋望晴思見日防冷欲披裘枕潤眠還懶車羸出轉憂散空烟漠漠迸溜竹脩脩樹暗蟬吟咽巢傾燕語愁琴書涼簟凈燈燭夜窻幽天下那能向龍邊豈易求濕烟凝竈額荒草覆牆頭酒思淒方罷詩情耿始抽下牀先仗屐汲井恐飄甌危坐徒相憶佳期未有由勞君寄新什終日不能酬和座主相公雨中作清氣潤華屋東風吹雨匀花低驚豔重竹淨覺聲真山際凝如霧雲中散似塵蕭蕭下碧落㸃㸃救生民緩灑雷霆細微沾瓦礫新詩成難繼和造化筆通神惡神行雨面神扇簸惡神行汹湧挨排白霧生風撃水凹波撲凸雨漴山口地嵌坑龍噴黑氣翻騰滚鬼掣紅光劈劃揁哮吼忽雷聲掲石滿天啾唧閙轟轟姚少監詩集巻六欽定四庫全書姚少監詩集巻七唐姚合撰
