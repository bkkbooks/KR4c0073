body:
  text: 花木鳥獸器用哀挽雜詠五十七首和李補闕曲江看蓮花露荷迎曙發灼灼復田田乍見神應駭頻來眼尚顛光凝珠有蔕焰起火無烟粉膩黄絲蘂心重碧玉錢日浮秋轉麗雨洒晩彌鮮醉艶酣千朶愁紅思一川緑莖扶萼正翠菂滿房圓淡暈還殊衆繁英得自然髙名猶不厭上客去爭先景逸傾芳酒懐濃習綵牋海霞寜有態蜀錦不成妍客至應消病僧來欲破禪曉多臨水立夜只傍隄眠金似眀沙渚燈疑宿浦船風驚叢乍宻魚戲影㣲偏穠彩燒晴霧殷姿纈碧泉畫工投粉筆宫女弃花鈿鳥戀驚難起蜂偷困不前遶行香爛漫折贈意纏綿誰計江南曲風流合管絃和王郎中召看牡丹葩疊萼相重燒欄復照空妍姿朝景裏醉艷晚烟中乍怪霞臨砌還疑燭出籠遶行驚地赤移坐覺衣紅殷麗開繁朶香濃發㡬叢裁綃樣豈似染茜色寜同嫩畏人看損鮮愁日炙融嬋娟涵宿露爛漫抵春風縦賞襟情合閒吟景思通客來歸盡懶鶯戀語無窮萬物珍那比千金買不充如今難更有縦有在仙宫詠南池嘉蓮芙蓉池裏葉田田一本雙花出碧泉濃澹共妍香各散東西分艷蒂相連自知政術無他異縦是禎祥亦偶然四野人聞皆盡喜爭來入郭看嘉蓮種葦欲種數莖葦出門來往頻近坡收本土選地問幽人靜看唯思長初移未覺勻坐中㝷竹客將去更逡巡採松花擬服松花無處學嵩陽道士忽相教今朝試上髙枝採不覺傾翻仙鶴巢詠新菊黄金色未足摘取且嘗新一作新嘗若待重陽日何曽異衆人一作香楊栁枝詞五首黄金絲掛粉墻頭動似顛狂靜似愁逰客見時心自醉無因得見謝家樓葉葉如眉翠色濃黄鶯偏戀語従容橋邊陌上無人識雨濕烟和思萬重江上東西離别饒舊條折盡折新條亦知春色人将去猶勝狂風取次飄二月楊花觸處飛悠悠漠漠自東西謝家詠雪徒相比吹落庭前便作泥江亭楊栁折還垂月照深黄幾樹絲見說隋隄枯已盡年年行客怪春遲郡中冬夜聞蛩秋蛩聲尚在切切起蒼苔久是忘情者今還有事來㣲霜風稍靜圓月霧初開此思誰能遣應須執酒杯聞新蟬寄李餘年年六月蟬應到每到聞時骨欲驚今日槐花還似發却愁聽盡更無聲聞蟬寄賈島未秋吟便苦半咽半隨風禪客心應亂愁人耳願聾一作禪客聞心亂愁人願耳聾雨晴烟一作髙樹裏日晩古城中遠思應難盡誰當與我同題鶴雛羽毛生未足一作齊嶛峭醜於鷄夜一作毎夜穿籠出𢷬衣砧上棲詠鶯春來深谷雪方消鶯别寒林傍翠條到處為憐烟景好隔簾多愛語聲嬌不同蜀魄啼殘月唯逐天雞囀詰朝少婦聴時思舊曲玉樓従此動雲韶老馬卧來扶不起唯向主人嘶惆悵東郊道秋來雨作泥詠鏡鑄為眀鏡絶塵埃翡翠牕前掛玉臺繡帶共尋龍口出菱花爭向匣中開孤光常見鸞蹤在分處還因鵲影迴好是照身宜謝女嫦娥飛向月宫來詠破屏風時人嫌古畫倚壁不曽收露滴膠山㫁風吹絹海秋殘雲飛屋裏片水落牀頭尚勝凡花鳥君能補綴不古碑荒田一片石文字滿青苔不是逢閒客何人肯讀來拾得古硯僻性愛古物終嵗求不獲昨朝得古硯黃河灘之側念此黄河中應有昔人宅宅亦作流水斯硯未變易波瀾所激觸背面生罅隙質狀朴且醜今人作不得捧持且驚歎不敢施筆墨或恐先聖人嘗用修六籍置之潔淨室一日三磨拭大喜豪貴嫌久長得保惜裴大夫見過湖南譙國盡英髦心事相期節義髙解下佩刀無所惜新聞天子付三刀謝韜光上人贈百齡藤杖衰病近來行少力光公乞我百齡藤閒來杖此向何處過水縁山只訪僧詠貴逰貴遊多愛向春深到處香凝數里塵紅杏花開連錦幛緑楊隂合拂朱輪鳳凰尊畔飛金盞絲竹聲中醉玉人日暮垂鞭共歸去西園賓客附龍麟窮邊詞二首将軍作鎮古汧洲水膩山春節氣柔清夜滿城絲管散行人不信是邊頭箭利弓調四鎮兵蕃人不敢近東行沿邊千里渾無事唯見平安火入城劍氣詞三首聖朝能用将破敵速如神掉劔龍纒臂開旗火滿身積屍川有岸流血野無塵今日當塲舞一作須應知是戰人晝一作夜渡黄河水将軍險用師雪光一作聲偏著甲風力不禁旗陣變龍蛇活軍雄鼓角知今朝重起舞記得戰酣時破虜行千里三軍意氣麤展旗遮日黑驅馬飲一作踏河枯鄰境求兵畧皇恩索陣圖元和太平樂自古恐應無従軍樂二首毎日㝷兵籍經年别酒徒眼疼長不校肺病且還無僮僕驚衣窄親情覺語麤幾時得歸去依舊作山夫朝朝十指痛唯署㸃兵符貧賤依前在顛狂一半無身慚山友棄膽賴酒杯扶誰道従軍樂年來鑷白鬚敬宗皇帝挽詞三首従諫停東幸垂衣寳厯昌漢昭登位少周代卜年長綵仗三清路麻衣萬國䘮𤣥宫今一閉終古柏蒼蒼晩色啓重扉旌旗路漸移荆山鼎成日湘浦竹斑時臣子終身感山園七月期金莖看尚在承露復何為紫陌起仙飈川原共寂寥靈輴萬國䕶儀殿百神朝漏滴秋風路笳吟灞水橋㣲臣空感咽踊絶覺天遥文宗皇帝挽詞三首垂拱開成化愔愔雅樂全千官方就日四海忽無天堯舜非傳子殷周但卜年聖功青史外刋石在陵前代以無為理車書萬國同繼兄還付弟授聖悉推公雲霧疑無日笳簫别起風金莖難復見寒露落空中龍歸攀不得髯在侍臣邊徹奠新阡起登山吉従全闗河佳氣散夷夏哭聲連寂寞𤣥宫閉朝昏千萬年莊恪太子挽詞二首曉漏啓嚴城宫臣縞素行靈儀先鹵簿新諡在銘旌雲晦郊原色風連霰雪聲凄凉望苑路春草即應生寒日青宫閉𤣥堂渭水濱華夷牋乍絶凶吉禮空新薤露歌連哭泉扉夜作晨吹笙今一去千古在逡巡哭費拾遺徵君服儒師道㫖糲食卧中林誰識先生事無身是本心空山流水遠故國白雲深日夕誰來哭唯應猨鳥吟哭硯山孫道士脩短皆由命暗懐師出塵豈知修道者難免不亡身永祕黄庭訣髙懸漉酒巾可憐白犬子閒吠遠行人哭賈島二首白日西邊沒滄波東去流名雖千古在身已一生休豈料文章遠那知瑞草秋曽聞有書劔應是别人收杳杳黄泉下嗟君向此行有名傳後世無子過今生新墓松三尺空堦月二更従今舊詩巻人覓寫應爭楊給事師臯哭亡愛姬英英竊聞詩人多賦因而繼和真珠為土玉為塵未識遥聞鼻亦辛天上還應收至寳世閒難得是佳人朱絲自㫁虚銀燭紅粉潛銷冷繡裀見說㤀情唯有酒夕陽對酒更傷神喜覽涇州盧侍御詩巻新詩十九首麗一作髙格出青㝠得處神應駭成時力盡停正愁聞更喜沉醉見還醒自是天才健非闗筆硯靈喜覽裴中丞詩巻新詩盈道路清韻似敲金調格江山峻功夫日月深蜀牋方入寫越客始消吟後輩難知處朝朝枉用心心懐霜欲識為詩苦秋霜若在心神清方耿耿氣肅覺沈沈皓素中方委嚴凝得更深依稀輕夕渚髣髴在寒林思勁凄孤韻聲酸激冷吟還如飲氷士勵節望知音聴僧雲端講經無生深㫖誠難解唯是師言得正真遠近持齋來諦聴酒坊魚市盡無人臘日獵健天結束執旌旗曉渡長江自合圍野外狐狸搜得盡天邊鴻雁射來稀蒼鷹落日飢唯急白馬平川走似飛蜡節畋逰非為已莫驚刺史夜深師聞魏州賊破生靈蘇息到元和上將功成自執戈煙霧掃開尊北岳蛟龍斬㫁凈南河旗迴海眼軍容壮兵合天心殺氣多從此四方無一事朝朝雨露是恩波南一作黄下第枉為鄉里舉射鵠藝渾踈歸路羞人問春城賃舎居閉門辭雜客開箧讀生書以此投一作求知已還因勝自餘得舎弟書親戚多離散三年獨在城貧居深穏卧一作睡妙㫖契荘生舍弟有書至異鄉無地行悲歡相併起何處說心情病僧三年病不出苔蘚滿藤鞋倚壁看經坐聞鐘喫藥齋茶烟燻殺竹簷雨滴穿堦無暇頻相訪秋風一作来寂寞懐成名後留别從兄一辭山舍廢躬耕無事悠悠住帝城為客衣裳多不穏和人詩句固難精㡬年秋賦唯知病昨日春闈偶有名却出闗東悲復喜歸㝷弟妹别仁兄佛舍見胡子有嘲明明復夜夜胡子即成翁唯是真知性不來生滅中太尉李徳裕自城外拜辭後歸弊居瞻望音徽即書一絶寄上千騎紅旗不可攀水頭獨立暮方還家人怪我渾如病罇酒休傾筆硯閒姚少監詩集跋
