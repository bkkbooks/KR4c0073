front:
  text: 酬謝五十七首
  hash: sha256:d0b46efd62c128e8243bfa7ea070c866b8078fd158fd524f6af6dce2554b875d
body:
  text: 和東都令狐留守相公除官東守洛陽宫恩比藩方任更雄拜表出時傳七刻排班衙日有三公旌旗嚴重臨關外庭宇清深接禁中三十六峰詩酒思朝朝閒望與誰同和髙諌議䝉兼賔客時入翰苑兼秩恩歸第一流時尋仙路向瀛洲鐘聲迢遞銀河在林色䓤蘢玉露秋紫殿講筵鄰御座青宫賔榻入龍樓從来共結歸山侣今日多應獨自休和盧給事酬裴員外南山雪色徹皇州鐘鼓聲交曉氣浮鴛鷺簪裾上龍尾蓬莱宫殿壓鼇頭夕郎夜直吟仙掖天樂和聲下禁樓贈答詩成才思敵病夫欲和幾朝愁和裴結端公早朝魚鑰千門啓雞人唱曉傳冕旒臨玉殿丞相入鑪烟列位同居左分行忝在前給事中與侍御史班同行在東給事中立在臺官前故有此句仰聞天語近俯拜珮聲連綵仗祥光動彤庭霽色鮮威儀誰可紀柱史有新篇和門下李相餞西蜀相公聖朝同舜日作相有䕫龍理化知無外蒸黎盡可封爕和皆達識出入並登庸武騎増餘勇儒冠貴所從贈詩全六義出鎮越千峰連日陳天樂芳筵疊酒鍾烏臺情已洽鳯閣分彌濃元和十四年崔相公與門下相公連御史臺今又在中書矣棧轉旌揺水崕髙馬踏松恩深施逺俗化美見前蹤太和四年門下相公出鎮至今西蜀理化清淨民俗歌謡不絶江曉流巴字山晴聳劒峰雙油擁上宰四海羨臨邛先路聲華逺離京詔㫖重歳除今向盡春色即相逢嫩葉抽頳蘂新苔長翠茸水銷魚潎潎林煖鳥噰噰泉落聞難盡花開看不供青城方眷戀黄閣竟從容計日歸台席還聼長樂鐘和座主相公西亭秋日即事西亭秋望好寧要更垂簾夫子牆還峻鄼侯宅過謙微風紅葉下新雨緑苔黏忩外松初長欄中藥旋添海圖装玉軸書目記牙籖竹色晴連地山光逺入簷酒濃盃稍重詩冷語多尖屬和才雖淺題髙免客嫌和秘書崔少監春日遊青龍寺僧院官清書府足閒時曉起攀花折桞枝九陌城中尋不盡千峰寺裏看相宜髙人酒味多和藥自古風光只屬詩見説往來多靜者未知前日更逢誰和李紳助教不赴看花笑辭聘禮深坊住門館長閒似退一作野居太學官資清品秩髙人公事説經書年華未是登朝晩春色何因向酒疎且看牡丹吟麗句不知此外復何如和李十二舎人冬至日獻夀人皆慶南山復北堂從今千萬日此日又初長和裴令公新城緑野堂即事結搆立嘉名軒窻四面明丘牆髙莫比蕭宅僻還清池際龜潜戲庭前藥旋生樹深簷稍邃石峭徑難平道曠襟情逺神閒視聴精古今功獨出大小隠俱成曙雨新苔色秋風長桂聲携詩就竹冩取酒對花傾古寺招僧飯方塘看鶴行人間無此貴半仗暮歸城和厲𤣥侍御題戸部李相公廬山西林草堂茒屋臨江起登庸復應期遥知歸去日自致太平時幽藥禪僧䕶髙窻宿鳥窺行人盡歌詠唯子獨能詩和鄭相演楊尚書蜀中唱和詩天福坤維厚忠賢擁節旄江同渭濵逺山似傅巖髙元氣符才格文星照筆毫五言全麗則六義出風騷聖日麻雙下洪爐柄共操寵榮連雨露先後比蕭曹唱絶時難和吟多客詎勞四方雖紙貴誰怕費錢刀和戸部侍郎省中晩歸寒日南宫晩閒吟半醉歸位髙行路靜詩好和人稀古樹苔文匝遥峰雪色微寧知逢彩筆寂寞有光輝和元八郎中秋居聖代無為化郎中似散仙晩眠隨客醉夜坐學僧禪酒用林花釀茶將野水煎人生知此味獨恨少因縁和李十二舎人裴四二舎人兩閣老酬白少傅見寄罷草王言星嵗久嵩髙山色日相親蕭條雨夜吟連曉撩亂花時看盡春此世逍遥應獨得古來閒散有誰鄰林中長老呼居士天下書生仰達人酒挈数瓶杯亦濶詩成千首語皆新綸闈並命誠宜賀不念衰年寄上頻和劉禹錫主客冬初拜表懐上都故人九陌喧喧騎吏催百官拜表禁城開林疎曉日明紅葉塵靜寒霜覆緑苔玉佩聲微班始定金函光動按初來此時共想朝天客謝食方從閣裏迴和太僕田卿酬殷堯藩侍御見寄往還知分熟酬贈思同新嗜飲殷偏逸閒吟卿亦貧古苔寒更翠修竹靜無鄰促席燈浮酒聴鴻霜滿身淺才唯是我髙論更何人携手宜相訪窮行少路塵和膳部李郎中秋夕淅淅復修修涼風似水流此生難免老舉世大同愁螢影明苔蘚鴻聲傍斗牛猶分省署直何日是歸休和前吏部韓侍郎夜泛南溪辭得官來疾漸平世間難有此髙情新秋月滿南溪裏引客乗船處處行和王郎中題華州李中丞㕔蓮華峰下郡齋前遶砌穿池貯瀑泉君到亦應閒不得主人草聖復詩仙和厲𤣥侍御無可上人㑹宿見寄九衢難㑹宿况復是寒天朝客清貧老林僧黙悟禪眠遲消漏水吟苦墮寒涎異日來尋我滄江有釣船和令狐六員外直夜即事寄上相公霜臺同處軒窻接粉署先登語笑疎皓月滿簾聴玉漏紫泥盈手發天書吟詩清美一作冷招閒客對酒逍遥卧直廬榮貴人間難有比相公離此十年餘答孟侍御早朝見寄河傾月向西九陌鼓聲齊塵靜霜華逺烟生曙色低禁門人已度宫樹鳥猶栖疎懶勞相問登山有舊梯和友人新居園上新居多野思不似在京城牆上雲相壓庭前竹亂生尋師望藥力依譜上琴聲好色中秋夜無塵有月明和裴令公遊南莊憶白二十韋七二賔客四郊初雨歇髙樹滴猶殘池滿紅蓮濕雲収緑野寛花開半山曉竹動數村寒鬬雀翻衣袂驚魚觸釣竿罇前多野客膝下盡郎官斸石通泉脉移松出藥欄關東分務重天下比功難半醉思韋白題詩染彩翰和李舎人秋日卧疾言懐閒臥襟情逺西風菊漸芳虚窻通曉景珍簟巻秋光果墜青莎徑塵離緑蘚牆藥奩開淨室書閤出叢篁對酒吟難盡思山夢稍長王言生彩筆朝服惹鑪香松影幽連砌蟲聲冷到牀詩成誰敢和清思若懐霜和李十二舎人直日放朝對雪今朝街鼓何人聽朝客開門對雪眠豈比直廬丹禁裏九重天近色彌鮮答李頻秀才一年離九陌壁上掛朝袍物外詩情逺人間酒味髙思歸知病長失寢覺神勞衰老無多思因君把筆毫答胡遇一㑹一分離貧遊少定期酒多為客穏米貴入城遲晴日偷將睡秋山乞與詩縱然眉得展不似見君時答友人招遊不來知盡怪失意懶春遊聞鳥寧驚夢看花怕引愁賭棊招敵手沽酒自扶頭何似華筵上推辭候到籌答竇知言冬日易慘惡暴風拔山根塵沙落黄河濁波如地翻飛鳥皆束翼居人不開門獨我赴省期冒此馳轂轅陜城城西邊逢子亦且奔所趨事一心相見如弟昆我慘得子舒我寒得子温同行十日程僮僕性亦敦到京人事多日無閒精魂念子珍重我吐辭發䝉昏反覆千萬意一百六十言格髙思清冷山低濟渾渾嘗聞朋友惠贈言始為恩金玉日消費好句長存存倒篋别収貯不與俗士論每當清夜吟使我如哀猿酬田就閒居多僻靜猶恐道相違只是夜深坐那堪春未歸嫩苔粘野色香絮撲人衣縱有野僧到終朝不話非酬禮部李員外見寄本求仙郡是閒居豈向郎官更有書溪石誰思玉匠愛烟鴻願與弋人疎自來江上眠方穏舊在城中病悉除唯見君詩難便捨寒宵吟到曉更初酬令狐郎中見寄昨是兒童今是翁人間日月急一作疾如風常聞欲向滄江去除我無人與子同酬李廓精舎南臺望月見寄看月空門裏詩家境有餘露寒僧梵出林靜鳥巢疎逺色當秋半清光勝夜初獨無臺上思寂寞守吾廬酬光禄田卿末伏見寄下伏秋期近還知扇漸疎驚飈墜鄰果暴雨落江魚貴寺雖同秩閒曹只管書朝朝廊下食相庇在肴葅酬薛奉禮見寄栖栖滄海一耕人詔遣江邊作使君山頂雨餘青到地濤頭風起白連雲詩成客見書牆和藥熟僧來就鼎分珍重來章相借問芳名未識已曽聞酬盧汀諌議粟如流水帛如山依念倉邊語笑間篇什縱横文案少親朋撩亂吏人閒杯觴引滿從衣濕牆壁書多任手頑遥賀來年二三月綵衣先輩過春關酬萬年張郎中見寄貢籍常同府周行今一時諫曹誠已忝京邑豈相宜黒髪年來盡滄江歸去遲何時得携手林下靜吟詩酬光禄田卿六韻見寄以病辭朝謁迂疎種藥翁心彌一作唯念魚鳥詔遣理兵戎遶戸旌旗影吹人鼓角風雲晴嵩岳頂樹老陜城宫莅職才微薄歸山路未通名卿詩句峭誚我在關東酬楊汝士尚書喜人移居未得滄江外衰殘讀藥書聖朝優上秩仁里許閒居樹對枝相接泉同井不疎酬章深自鄙欲寄復躊蹰酬田卿書齋即事見寄幽齋琴思靜晩下紫宸朝舊隠同溪逺周行隔品遥深槐蟬喞喞疎竹雨蕭蕭不是相尋懶煩君舉酒瓢酬張籍司業見寄日日在心中青山青桂叢髙人多愛靜歸路亦應同罷吏方無病因僧欲解空新詩勞見問吟對一作向竹間風謝汾州田大夫寄茸氊蔔萄筐封紫蔔萄筒巻白茸毛臥煖身應健含消一作清齒免勞衾衣疎不稱梨栗鄙難髙曉起題詩報寒澌滿筆毫牧杭州謝李太尉徳裕皇恩特許拜杭壇欲謝旌旄去就難偷擬白頭瞻畫㦸四神俱散髪毛寒杏園宴上謝座主得陪桃李植芳叢别感生成太昊功今日無言春雨後似含冷涕謝東風謝韜光上人上方清淨無因住唯願他生得住持只恐無生復無我不知何處更逢師謝秦校書與無可上人見訪道同無宿約三伏自從容窻豁山侵座扇揺風下松客吟多遶竹僧飯只憑鐘向晩分歸路莓苔行跡重喜胡遇至窮居稀出入門戸滿塵埃病少閒人問貧唯宻友來茅齋從掃破藥酒遣生開多事經時别還愁不宿迴就林燒嫩筍遶樹揀香梅相對題新什遲成舉罸杯喜賈島至布囊懸蹇驢千里到貧居飲酒誰堪伴留詩自與書愛眠知不醉省語似相疎軍吏衣裳窄還應暗笑余喜喻鳬至欲出心還懶閒吟遶寢牀道書蟲食盡酒律客偷將愁至為多病貧來減得狂見君何所似如熱得清涼喜雍陶秋夜訪宿曉立侍爐烟夜歸蓬蓽眠露華明菊上螢影滅燈前清漏和碪疊栖禽與葉連髙人來此宿為似在山巔喜賈島雨中訪宿雨裏難逢客閒吟不復眠蟲聲秋併起林色夜相連愛酒此生裏趨朝未老前終須携手去滄海棹魚船喜馬戴冬夜見過期無可不至客來初夜裏藥酒自開封老漸多歸思貧惟長病容苦寒燈焰細近曉鼓一作漏聲重僧可還相捨深居閉古松其二内殿臣相命開罇話舊時夜鐘催鳥絶積雪阻僧期林靜寒聲逺天隂曙色遲今宵復何夕鳴珮坐難隨訪僧法通不遇訪師師不遇禮佛佛無言依舊將煩惱黄昏入宅門夜期友生不至忍寒停飯一作酒待君來酒作凌凘一作冬凌火作灰半夜出門重立望月明先自下髙臺尋僧不遇入門愁自散不假見僧翁花落煎茶水松生醒酒風拂牀尋古畫拔刺看新叢别有遊人見多疑住此中姚少監詩集巻九欽定四庫全書姚少監詩集巻十唐姚合撰
