front:
  text: 五
  hash: sha256:c9b87f516a38ea36a0ca35f5137d4676a0705b6af36302cac4b68927a1e42c60
body:
  text: 唐姚合撰閒適上五十首閒居遣懐一十首身外無徭役開門百事閒倚松聴唳鶴䇿杖望秋山萍任連池緑苔從匝地斑料無車馬客何必掃柴關其二閒卧銷長日親朋笑我疎詩篇隨分有人事度年無情性僻難改愁懐酒為除誰能思此計空備滿牀書其三白日逍遥過看山復遶池展書尋古事翻巻改新詩賒酒風前酌留僧竹裏棊同人笑相問羡我足閒時其四好景時牽目茅齋興有餘逺山經雨後庭樹得秋初道侣憐栽藥髙人笑養魚優游隨本性甘被棄慵疎其五永日厨煙絶何曽暫廢吟閒詩隨思緝小酒恣情斟看月嫌松宻垂綸愛水深世間多少事無事可關心其六一生能幾日愁恨也無端遇酒酕醄飲逢花爛漫看青雲非失路白髪未相干以此多携解將心但自寛其七萬事徒紛擾難關枕上身朗吟銷白日沈醉度青春演步憐山近閒眠厭客頻市朝曽不到長免滿衣塵其八野性多疎惰幽棲更稱情獨行看影笑閒坐弄琴聲懶拜腰肢硬慵趨禮樂生業文隨日遣不是為求名其九生計甘寥落髙名愧自由慣無身外事不信世間愁好酒盈盃酌閒詩任筆酬凉風從入户雲水更宜秋其十拙直難和洽從人笑掩關不能行戸外寧解走塵間被酒長酣思無愁可上顏何言歸去事着處是青山武功縣中作三十首縣去帝一作京城逺為官與隠齊馬隨山鹿放雞雜野禽棲遶一作連舎惟藤架侵堦是藥畦更師嵇叔夜不擬作書一作詩題其二方拙天然性為官是事疎惟尋向山路一作道不寄入城書因病多一作方収藥縁餐學釣魚養身成好事此外更一作盡空虚其三微官如馬足秪是在泥塵到處貧隨我終年老趂人簿書銷眼力盃酒耗心神早作歸休計深居養一作過此身其四簿書多不㑹薄俸亦難銷醉卧慵開眼閒行懶繫腰移花兼蝶至買石得雲饒且自心中樂從他笑寂寥其五曉鐘驚睡覺事一作是事便相關小市柴薪貴貧家砧杵閒讀書多旋忘賒酒數空還長羨劉伶一作靈輩一作醉髙眠出世間其六性疎常愛卧親故笑悠悠縱出多携枕一作酒因衙始裹頭上山方覺老過寺暫忘愁三考千餘日低腰不擬休其七客至皆相笑詩書滿卧牀愛閒求病假因醉一作酒棄官方鬢髪寒惟短衣衫瘦漸長自嫌多檢束不似舊來狂其八一日看除目終年損道心山宜衝雪上詩好一作入帶風吟野客嫌知印家人笑買琴只應隨分一作日過已一作定是錯彌深其九鄰里皆相愛門開數見過秋凉送客逺夜靜詠詩多就架題書目尋欄記藥窠到官無别事種得滿庭莎其十窮達天應與人間事莫論微官從一作長似客逺縣豈勝村竟日多無食連宵不閉門齋心調筆硯唯寫五千言其十一縣僻仍牢一作寥落遊人到便迴路當邊地去村入郭門來酒戸愁偏長詩情病不開可曽衙小吏恐謂踏青苔其十二自下青山路三年著緑衣官卑食肉僣才短事人非野一作閒客教長醉髙僧勸却歸不知何計是免與本心違事一作字其十三日出方能起庭前看種莎吏來山鳥散酒熟野人過岐路荒城少煙霞逺縣多同官數相引下馬上西坡其十四作吏荒城裏窮愁欲不勝病多唯識藥一作鬼年老漸親僧夢覺空堂月詩成滿硯氷故人多得路寂寞不相稱其十五誰念東山客栖栖守印牀何年得事盡終日逐人忙醉卧誰知呌閒書不着一作正行人間長一作尚檢束與此豈相當其十六朝朝眉不展多病怕逢迎引水逺通澗壘山髙過城秋燈照樹色寒雨落池聲好是吟詩夜披衣坐到明其十七簿籍誰能問風寒趂早一作暇眠毎旬常一作外乞一作假假隔月探支錢一作請官錢還往嫌詩僻親情怪酒顛謀身須上計終久是歸田其十八閉門風雨裏落葉與堦齊野客嫌盃小山翁喜枕低聴琴知道性尋藥得詩題誰更能騎馬閒行祇一作只杖藜其十九腥羶都不食稍稍覺神清夜犬因一作風風吠鄰雞帶一作雨雨鳴守官常卧病學道别稱名小有洞中路誰能引我行其二十宦名渾不計酒熟且開封晴月銷燈一作雲色寒天挫筆鋒驚禽時並起閒客數一作夜相逢舊國蕭條思青山隔幾重其二十一假日多無事誰知我獨忙移山入縣宅種竹上城牆驚蝶遺花蘂遊蜂帶蜜香唯愁明早出端坐吏人旁其二十二門外青山路因循自不歸養生宜縣僻説一作手品喜官微淨愛山僧飯閒披野客衣誰憐幽谷鳥不解入城飛其二十三一官無限日愁悶欲何如掃舎驚巢燕尋方落壁魚從僧乞浄水憑客報閒書白髪誰能鑷年來四十餘其二十四朝朝門不閉長似在山時賔旅一作客抽書讀兒童斫竹騎久貧還易老多病懶能醫道友應相怪休官日已遲其二十五戚戚常無思循資格上官閒人得事晩常骨覓一作學仙難愁一作醉卧疑身病貧居覺道一作抱寛新詩久不冩自算少人看其二十六漫作容身計今知一作朝拙有餘青衫一作袍迎驛使白髪憶山居道友憐蔬一作􅀢食吏人嫌草書須為長久事歸去自耕鋤憐一作喜其二十七主印三年坐山家一作居百事休焚香開勑庫踏月上城樓飲酒多成一作如病吟詩易一作長長一作似愁慇懃問漁者暫借手中鈎其二十八長憶青山下深居遂性情壘堦溪石淨燒竹竈煙輕㸃筆圖雲勢彈琴學鳥聲一作鳴今朝知縣印夢裏百憂生其二十九自知狂僻性吏事固相疎秪是看山立無因出縣居印朱沾墨硯戸籍雜經書月俸尋常請無妨一作嫌乏斗儲其三十作吏無一作渾能一作無事一作思為文舊致一作著功詩標八病外心落百憂中拜别登朝客歸依錬藥翁不知還往内誰與此心同罷武功縣將入城乍抛衫笏覺身輕依舊還稱學道名欲泥山僧分一作求屋住羞從野老借牛耕妻兒盡怕為逋客親故相邀遣到城無奈同官珍重意幾迴臨路却休行其二青衫脫下便狂歌種薤一作李栽莎一作桃斸古坡野客相逢添酒病春山暫上著詩魔亦知官罷貧還甚且喜閒來睡得多欲與九衢親故别明朝拄杖始經過秋日閒居九陌宅重重何門憐此翁荒庭唯菊茂幽徑與山通落葉帶衣上閒雲來酒中此心誰得見林下鹿應同其二先憶花時節家山聴更歸愛詩看古集憶酒典寒衣睡少身還健愁多食不肥自憐疎懶性無事出門稀閒居晩夏閒居無事擾舊病亦多痊選字詩中老看山屋外眠片霞侵落日繁葉咽鳴蟬對此心還樂誰知乏酒錢閒居不自識疎鄙終年住在城過門無馬跡滿宅是蟬聲帶病吟雖苦休官夢巳清何當學禪觀依止古先生街西居受得山野性住城多事違青山在宅南回首東西稀淺淺一泉井數家同汲之獨我惡水濁鑿井庭之陲自鑿還自飲亦為衆所非吁嗟世間事潔身誠難為其二日出窮巷喜温然勝重衣重衣豈不煖所煖人不齊兀兀復行行不離階與墀其三丈夫非馬蹄安得知路岐窮賤飱茹薄興與養性宜乃知長生術豪貴難得之閒居遣興終年城裏住門戸似山林客怪聲一作身名晩妻嫌酒病深冩方多識藥失譜廢彈琴文字非經濟空虚用破心姚少監詩集巻五欽定四庫全書姚少監詩集巻六唐姚合撰閒
