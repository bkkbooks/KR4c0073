canonical_identifier: bkk:krp/KR4c0073/WYG/v1/juan/8
seq: 8
front:
  text: 界清仙飈石上起海日夜中明何計長來此閒眠過一生
  hash: sha256:6b75c0bc4f9694ccd9d5a310118b658301550ec8a40546ce960b6cfc5e2d45a6
body:
  text: 遊昊天𤣥都觀性同相見易紫府共閒行隂徑紅桃落秋壇白石生蘚文連竹色鶴語應松聲風定藥香細樹深泉氣清垂簷靈草影遶壁古山名圍外坊無禁歸時踏月明同裴起居厲侍御放朝遊曲江暑月放朝頻青槐路絶塵雨晴江色出風動一作度草香新獨立分幽島同行得靜人此歡宜稍滯此去與誰親曉望華清宫曉看樓殿更鮮明遥隔朱欄見鹿行武帝自知身不死教修玉殿號長生夏日登樓晩望避暑髙樓上平蕪望不窮鳥穿山色去人歇樹隂中數帶長河水千條弱桞風暗思多少事懶話與芝翁霽後登樓髙樓初霽後逺望思無窮雨洗青山淨春蒸大野融碧池舒煖景弱桞嚲和風為有登臨興獨吟落照中早夏郡樓宴集官散有閒情登樓步稍輕窻雲帶雨氣林鳥雜人聲曉日襟前度微風酒上生城中㑹難得掃壁各書名夜宴太僕田卿宅故人九寺長邀我此同歡永夜開筵靜中年飲酒難微風侵燭影疊漏過林端臘後分朝日天明幾刻殘春日同會衛尉崔少卿宅詩家㑹詩客池閤曉初晴鳥盡山中語琴多譜外聲映花相勸酒入洞各題名疎野常如此誰人信在城軍城夜㑹軍城夜禁樂飲酒每題詩坐穏吟難盡寒多醉較遲逺鐘經一作驚漏壓微月被燈欺此㑹誠堪惜天明是别離晦日宴劉值録事宅花落鶯飛深院靜滿堂賔客盡詩人城中盃酒家家有唯是君家酒送春宴光禄田卿宅竹裏開華館珍羞次第嘗春風酒影動晴日樂聲長久坐難辭醉衰年亦暫狂慇懃還繼燭永夕夢相妨㑹將作崔監東園牆北走紅塵牆東接一作飛白雲山光衣上見藥氣酒中聞此㑹誠堪惜窮秋日又曛人間唯有醉醉後復何云同諸公㑹太府韓卿宅九寺名卿才思雄邀歡筆下與盃中六街鼓絶塵埃息四座筵開語笑同燄燄蘭缸明狹室丁丁玉漏發深宫即聴鷄唱天門曉吏事相牽西復東乞酒聞君有美酒與我正相宜溢瓮清如水粘盃半似脂豈唯消舊病且要引新詩况此便便腹無非是滿巵寄衞拾遺乞酒老人罷巵酒不醉已經年自飲君家酒一盃三日眠味輕花上露色似洞中泉莫厭時時寄須知法未傳乞新茶嫩緑微黄碧澗春採時聞道斷葷辛不將錢買将詩乞借問山翁有幾人西掖寓直春曉聞殘漏直廬仙掖近春氣曙猶寒隠隠銀河在丁丁玉漏殘微風飄更切萬籟雜應難鳯閣明初啓雞人唱漸䦨靜宜來禁裏清是下雲端我識朝天路從容自整冠杭州郡齋南亭符印懸腰下東山不得歸獨行南北近漸老往還稀迸笋侵窻長驚蟬出樹飛田田池上葉嘗是使君衣郡中西園西園春欲盡芳草徑難分靜語唯幽鳥閒眠獨使君宻林生雨氣古石帶潮文雖去清秋逺朝朝見白雲杭州官舎偶書錢塘刺史漫題詩貧褊無恩懦少威春盡酒盃花影在潮迴畫檻水聲微閒吟山際邀僧上暮入林中看鶴歸無術理人人自理朝朝漸覺簿書稀省直書事黙黙滄江老官分右掖榮立朝班近殿奏直上知名曉霧和香氣晴樓下樂聲蜀牋金屑膩月兎筆毫精禁樹非烟覆宫牆瑞草生露盤秋更出玉漏晝還清碧蘚無塵染寒蟬似鳥鳴竹深雲自宿天近日先明孱懦難封詔疎愚但擲觥素飡終日足寧免衆人輕杭州官舎即事臨江府署清閒坐一作臥復閒行苔蘚疎塵色梧桐出雨聲漸除一作知身外事暗作道家名更喜仙山近庭前藥自生假日書事呈院中司徒十日公府靜巾櫛起清晨寒蟬近衰桞古木似髙人學佛寧憂老為儒自喜貧海山歸未得芝术夢中春書縣丞舊㕔宫殿一作樓閣半山上人家向下居古㕔眠易魘老吏語多虚雨水澆荒竹溪沙擁廢渠聖朝収外府皆是九天除縣中秋宿鼓絶門方掩蕭條作吏心露垂庭際草螢照竹間禽棊罷嫌無月眠遲聽盡碪還知未離此時復更相尋夏夜宿江驛竹屋臨江㟁清宵興自長夜深傾北斗葉落映横塘渚閙漁歌響風和角糉香却愁南去棹早晩到瀟湘陜城即事左右分京闕黄河與宅連何功來此地竊位已經年天下才彌小關中鎮最先隴山望可見惆悵是窮邊姚少監詩集巻八欽定四庫全書姚少監詩集巻九唐姚合撰和答
