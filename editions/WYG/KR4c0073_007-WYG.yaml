body:
  text: 題詠四十九首題鳯翔西郭新亭西郭塵埃外新亭制度竒地形當要處人力是閒時結搆方殊絶髙低更合宜棟梁清俸買松竹逺山移佛一作僧寺幽難敵仙家景一作境可追一作遺良功慙巧盡上客恨逢遲兩面寒一作清波漲當前軟一作嫩桞垂清虚宜月入涼冷勝風吹宴賞軍容靜登臨樂妓隨魚龍聴絃管鳬鶴識旌旗泛鷁春流濶飛觴白日敧閒花一作雲長在戸嫩蘚乍縁墀永望情無極頻來困不辭雲峰晴轉出一作翠煙樹曉逾滋向野惟貪靜臨空遽覺危行人如不到遊樂更何為一作遊樂信虚為題金州西園九首江榭亭亭白雲榭下有清江流見江不得親不如波上鷗有榭江可見無榭無雙眸藥堂僮僕不到閾雙扉常自關四壁畫逺水堂前聳秋山時聞有仙鼠竊藥簷隙間草閣編草覆柏椽軒扉皆竹織閤成似僧居學僧居未得有時公府勞還復來此息松壇盤盤松上蓋下覆青石壇月中零露垂日出露尚漙山翁稱絶境海嶠無所觀葼徑藥院徑亦髙往來踏􅛟影方當繁暑日草屩微微冷愛此不能行折薪坐煎茗垣竹種竹愛庭際亦以資玩賞窮秋雨蕭條但見牆垣長宣尼髙數仭固應非土壤石庭布石滿山庭磷磷潔還清幽人常履此月下屐齒鳴藥草枝葉動似向山中生莓苔茅堂堦豈髙數寸是苔蘚只恐秋雨中窻戸亦不濺眼前無此物我情何由遣芭蕉屏芭蕉叢叢生月照參差影數葉大如牆作我門之屏稍稍聞見稀耳目得安靜杏溪十首杏溪桃花四散飛桃子壓枝垂寂寂青隂裏幽人舉步遲慇懃念此徑我去復來誰蓮塘方塘菡萏髙繁豔相照耀幽人夜眠起忽疑野中燒曉尋不知休白石岸亦峭架水藤濛濛紫花藤下復清溪水若遣隨波流不如風飄起風飄或近堤隨波千萬里石潭曉向潭上行夕就潭邊宿清冷無波瀾潎潎魚相逐釣翁坐不起見我徃來熟溪路此路何瀟洒永無公卿跡日日多往來藜杖與桑屐路邊何所有磊磊青淥石望江峯念昔有此峰在彼江陵先舉世未能知愚亦望同賢我來心益悶欲上天公牋杏水不與江水接自出林中央穿花復逺水一山聞杏香我來持茗甌日屢此來嘗渚上竹葉葉新春筠下復清淺流微風屢此來決決復脩脩詩人月下吟月墮吟不休楓林堰森森楓樹林䕶此石門堰杏隄數里餘楓影覆亦徧鸕鷀與釣童質異同所願石瀨散漫復潺湲半沙半和石清風波亦無歴歴魚可搦我來亦屢久歸路常日夕陜下厲𤣥侍御宅五題濯纓溪舊山寧要去此有濯纓泉曉景松枝覆秋光月色連行尋屐齒盡坐對角巾偏寂寂幽棲處無妨請俸錢垂釣亭由釣起茅亭柴扉復竹楹波清見絲影坐久識魚情白鳥依窻宿青蒲傍砌生欲同漁父舎須自減逢迎吟詩島幽島蘚層層詩人日日登坐危石是榻吟冷唾成氷靜對唯秋水同來只一作但老僧竹一作松枝題字處小篆復誰能竹裏徑微徑嬋姢裏唯聞靜者知跡深苔長處步狹笋生時髙是連幽樹窮應到曲池紗巾靈夀杖行樂復相宜泛觴泉不上酒家樓池邊日獻酬杯來轉巴字客坐遶方流酹滴苔紋㫁泉連石㟁秋若能山下置歳晩願同遊題僧院引泉泉眼髙千尺山僧取得歸架空横竹引鑿石透渠飛洗藥溪流濁澆花雨力微朝昏長遶看䕶惜似持衣題家園新池數日自穿池引泉來近陂尋渠通咽處遶岸待清時深好求魚養閒堪與鶴期幽聲聴難盡入夜睡常遲詠盆池浮萍重疊水團圓客遶千遭屐齒痕莫驚池裏尋常滿一井清泉是上源買太湖石我嘗遊太湖愛石青嵯峨波瀾取不得自後長咨嗟竒哉賣石翁不傍豪貴家負石聴苦吟雖貧亦來過貴我辨識精取價復不多比之昔所見珍怪頗更加背面淙注痕孔隙若琢磨水稱至柔物湖乃生壯波或云此天生嵌空亦非他氣質偶不合如地生江河置之書房前曉霧常紛羅碧光入四鄰牆壁難蔽遮客來謂我宅忽若巖之阿天竺寺殿前立石補天殘片女媧抛撲落禪門壓地㘭霹靂劃深龍舊攫屈槃痕淺虎新􅎲苔粘月眼風挑剔塵結雲頭雨磕敲秋至莫言長矻立春來自有薜蘿交杭州觀潮樓有章亭號濤來自古今勢連滄海濶色比白雲深怒雪驅寒氣狂雷散大音浪髙風更起波急石難沈鳥懼多遥過龍驚不敢吟􅉾如開玉穴危似走瓊岑但褫千人魄那知伍相心岸摧連古道洲漲踣叢林跳沫山皆濕當江日半隂天然與禹鑿此理遣誰尋題李頻新居賃居求賤處深僻任人嫌蓋地花如綉當門竹勝簾勸僧嘗藥酒教僕辨一作認書簽庭際山宜小休令着石添寄題縱上人院營營是與非前樂後還悲今世已如此他生願似師禪房空旦暮畫壁半陳隋遶徑一作竹蒼苔跡幽人來是誰題山寺千重山崦裏樓閣影參差未暇尋僧院先看置寺碑竹深行漸暗石穏坐多時古􅀈蟲蛇善隂廊鳥雀癡雲開上界近泉落下方遲為愛青桐葉因題滿樹詩題貞女祠此女骨為土貞名不可移精靈閟何處蘋藻奠空祠水石生異狀杉松無病枝我來方謝雨延滯失歸期題刑部馬員外修行里南街新居帝里誰無宅青山祗屬君閒窻連竹色幽砌上苔文逺近髙低樹東西南北雲朝朝常獨見免被四鄰分題郭侍郎親仁里幽居入門塵外思苔徑藥苗間洞裏應生玉庭前自有山帝城唯此靜朝客更誰閒野鶴松中語時時去復還題宣義池亭春入池亭好風光煖更鮮尋芳行不困逐勝坐還遷細草亂如髪幽禽鳴似絃苔文翻古篆一作畫石色學秋天花落能漂酒萍開解避船暫來還差一作猶愈疾久住合成仙迸笋搘堦起垂藤壓樹偏此生應借看自計一作謂買無錢題薛十二池亭每日樹邊消一日遶池行過又須行異花多是非時有好竹皆當要處生斜立小橋看島勢逺移幽石作泉聲浮萍著㟁風吹歇水面無塵晩更清題大理崔少卿駙馬林亭每來歸意懶都尉似山人臺榭栖一作停雙鷺松篁隔四鄰迸泉清勝雨深洞暖如春更看題詩處前軒粉壁新題杭州南亭舊隠即雲林思歸日日深如今來此地無復有前心古石生靈草長松栖異禽暮潮簷下過濺浪濕衣襟題鄭一作崔駙馬林亭東園連宅起勝事與心期幽洞自生藥新篁迸入池宻林行不盡芳草坐難移石翠疑無質鶯歌似有詞莎臺髙出樹蘚壁淨題詩我獨多來賞九衢人不知題厲𤣥侍御所居幽棲一畝宫清峭似山峰鄰里不通徑俸錢唯買松野人時寄宿谷鳥自相逢朝路牀前是誰知曉起慵題田將軍宅焚香書院最風流莎草縁牆緑蘚秋近砌别穿澆藥井臨街新起看山樓棲禽戀竹明猶在閒客觀花夜未休好是暗移城裏宅清涼渾得似江頭題崔駙馬宅心在林泉身在城鳯凰樓下得閒名洞中見鑿尋仙路月裏猶燒煑藥鐺數樹異花皆敇賜並竿脩竹自天生詩人多説離君宅不得青苔地上行題河上亭亭亭河上亭魚躑水禽鳴九曲何時盡千峰今日清晨光秋更逺暑氣夏常輕盃裏移檣影琴中有浪聲㟁莎連砌靜漁火入窻明來此多沈醉神髙無宿酲題長安薛員外水閣亭亭新閣成風景益鮮明石盡太湖色水多湘渚聲翠筠和粉長零露逐荷傾時倚髙窻望幽尋小徑行林疎看鳥語池近識魚情政暇招閒客唯將酒送迎題梁國公主池亭平陽池館枕秦川門鏁南山一帶烟素柰花開西子面緑榆枝種沈郎錢裝簾玳瑁隨風落庭㟁鵁鶄趂煖眠寂寞空餘歌舞地玉簫驚起鳯歸天寄題尉遲少卿郊居卿仕在關東隣居思不窮朝衣掛壁上廏馬放田中隅坐惟禪子隨行只藥童砌莎留宿露庭竹出清風濃翠生苔㸃辛香發桂叢蓮池伊水入石徑逺山通愚者心還靜髙人跡自同無能相近住終日羨鄰翁姚少監詩集巻七欽定四庫全書姚少監詩集巻八唐姚合撰遊覽宴集五十首過張邯鄲莊客行長似病煩熱束四肢到君讀書堂忽若逢良醫堂前水交流堂下樹交枝兩門延風凉洗我昏濁肌與子還往熟坐臥恣所宜時時相獻酬文字當酒巵野飯具藜藿永日亦不饑苟飡非其所鱠炙為蒺藜時清士人閒耕作唯文詞豈獨鄉里薦當取四海知過楊處士幽居引水穿風竹幽聲勝逺溪裁衣延野客剪翅養山雞酒熟聴琴酌詩成削樹題惟愁春氣暖松下雪和泥過李處士山居閒居晝掩扉門桞䕃蔬畦因病方収藥尋僧始度溪少逢人到戸時有燕銜泥蕭灑身無事名髙孰與齊過無可僧院憶師眠復起永夜思迢迢月下門方掩林中寺更遥鐘聲空下界池色在清宵終擬修禪觀窻間巻欲燒過稠上人院清羸一飯師閒院亦披衣應詔常翻譯修心出是非雪中疏磬度林際晩風歸蔬食常來此人間䕶凈稀過不疑上人院九經通大義一作通經又議經内典自應精簾冷連松影苔深減履聲相逢幸此日相失一作識恐來生覺路何門去師須引我行過雲花寳上人院九陌最幽寺吾師院復深烟霜同覆屋松竹雜成林鳥語境彌寂客來機自沈早知能到此應不戴朝簮過杜氏江亭上國千餘里逢春且勝遊暫聞新鳥戲似解旅人愁野色吞山盡江烟襯水流村醪須一醉無恨滯行舟過張雲舉院宿不喫胡麻飯杯中自得仙隔籬招好客掃室致芳筵家醖香醪嫩時新異果鮮夜深唯畏曉坐穏豈思眠棊罷嫌無敵詩成貴在前明朝題壁上誰得衆人傳過欽上人院有相無相身唯師説始真脩篁半庭影清磬幾僧鄰古壁丹青落虚簷鳥雀馴伊余求了義羸馬往來頻過無可上人院寥寥聴不盡孤磬與疎鐘煩惱師長别清涼我暫逢蟻行經古蘚鶴毳落深松自想歸時路塵埃復幾重過城南僧院寺對逺山起幽居仍是師斜陽通暗隙殘雪落疎籬松靜鶴棲定廊虚鐘盡遲朝朝趨府吏來此是相宜過靈泉寺偶尋靈跡去幽徑入氲氛轉壑驚飛鳥穿山踏亂雲水從巖下落溪向寺前分釋子遊何處空堂日漸曛過天津橋晴望閒立津橋上寒光動逺林皇宫對嵩頂清洛貫城心雪路初晴出人家向晩深自從王在鎬天寳至如今春日遊慈恩寺年長歸何處青山未有家賞春無酒飲多看寺中花遊天台上方曉上上方髙處立路人羨我此時身白雲向我頭上過我更羨他雲路人遊終南山䇿杖度溪橋雲深步數勞青猿吟嶺際白鶴坐松梢天外浮烟逺山根野水交自縁名利繋好此結蓬茒遊杏溪蘭若踏得度溪灣晨遊暮不還月明松影路春滿杏花山戲狖跳林末髙僧住石間未肯離腰組來此復何顏遊謝公亭行行方避夢又到謝亭來舉世皆如此伊余何處迴竹鮮多透石泉潔亦無苔坐與僧同語誰能顧酒杯遊陽河㟁終日遊山困今朝始傍河尋芳愁路盡逢景畏人多鳥語催沽酒魚來已聴歌醉時眠石上肢體自婆娑遊河橋曉望閒上津橋立天涯一望間秋風波上岸旭日氣連山偶聖今方變朝宗豈復還崑崙在蕃界作將亦何顔上一作出界一作激秋夜月中登天壇秋蟾流異彩齋潔上壇行天邇星辰大山深世
