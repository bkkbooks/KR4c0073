body:
  text: 唐書載合於姚崇傳中甚畧余按合乃宰相崇之曽孫未詳其字元和十一年李逢吉知舉進士調武功主簿世號姚武功又為富平萬年尉寳應中歴監察殿中御史户部員外郎出荆杭二州刺史為户刑二部郎中諫議大夫給事中陜虢觀察使開成末終秘書監與馬戴費冠卿殷堯藩張籍逰喜采僧詩如清教云香連雲舍像雲容云木末上眀星荆州僧云犬熟䕶隣房吟之不輟李頻師之方𤣥英哭之云入室㡬人為弟子為儒是處哭先生仰止極矣隠湖毛晉識天啟丁夘余梓極𤣥集乃姚武功取王維至戴叔倫二十餘人詩百首曰此詩家射雕手也遂願購其本集卒不可得偶閱緇林法語見移花兼蝶至買石得雲饒十字叱謂禪悟後語既讀主客圖方知出武功手繼従紀事又讀一日看除目終年損道心豈食烟火人能道隻字廣搜博訪十有餘年真所謂求之不得寤寐思服也迨崇禎壬午秋忽従餳籠中獲此本凡十巻盖吾宗圖記印抄宋刻豈武功有靈錫我百朋耶撃節欣賞三日夜急授諸梓未知海内亦有如飢如渇如余者否但未及招與公於臨頓里中亦用率更筆法與浪仙長吉嫓美洵一恨事晉又識此浙本也川本編次稍異余向藏宋治平四年王頥石刻武功縣中詩三十首詮次不同縣去京城遠一方拙天然性二㣲官如馬足三縣僻仍寥落四簿書多不㑹五曉鐘驚睡覺六自下青山路七性踈嘗愛卧八日出方能起九客至皆相笑十一日看除目十一作吏荒城裏十二誰念東山客十三隣里皆相愛十四窮達天應與十五閉門風雨裏十六朝朝眉不展十七簿籍誰能問十八腥羶都不食十九宦名渾不計二十假日都無事廿一一官無限日廿二朝朝門不閉廿三欲依循循術廿四漫作容身計廿五主印三年坐廿六長憶青山下廿七自知狂僻性廿八作吏渾無思廿九門外青山路三十其字句差池夾注行間石本今已失去每咏表聖亡書久似憶良朋之句為之泫然晉又識予梓姚少監集十巻既成又閱唐文粹得新昌里一篇又閱樂府詩集得出塞一篇深嘅逸詩不知凡㡬因附載副葉新昌里舊客常樂坊井泉濁而鹹新居新昌里井泉清而甘僮僕慣苦飲食美翻憎嫌朝朝忍飢行戚戚如難堪中下無正性所習便淫耽一染不可變甚於茜與藍近貧日益亷近富日益貪以此當自警慎勿信邪讒出塞磧路三千里黄雲覆草平戰須移死地軍諱殺降兵印馬秋遮虜蒸沙夜築城故鄉歸未得都尉欠功名晉又識姚少監詩集巻十
