seq: 2
front:
  text: 送君一壺酒相别野庭邊馬上過秋色舟中到錦川峽猿啼夜雨蜀鳥噪晨烟莫便不迴首風光促㡬年
  hash: sha256:bf7aa243eb294ae53f71fbfdea3c246440aa0fd6103ae5afe13c63559d077196
body:
  text: 送杜立歸蜀迢逓三千里西南是去程杜陵家巳盡蜀國客重行雪照巴江色風吹棧閣聲馬嘶山稍煖人語店初明旅夢心多感孤吟氣一作意不平誰為李白後為訪錦官城送韓湘赴江西從事年少登科客從軍詔命新行裝有兵器祖席盡詩人細雨湘城暮㣲風楚水春潯陽應足雁夢澤豈無塵猿叫來山頂潮痕在樹身從容多暇日佳句寄須頻送潘傳秀才歸宣州李白墳三尺嵯峨萬古名因君還故里為我弔先生晴日移虹影空山出鶴聲老郎閒未得無計此中行送僧黙然出家侍母前至孝自通禪伏日江頭别秋風檣下眠鳥聲猿更促石色樹相連此路多如此師行亦有緣送陟遐一作霞上人遊天台萬疊赤城路終年遊客稀朝來送師去自覺有家非石淨山光逺雲深海色㣲此詩成亦鄙為我寫巖扉送盛秀才赴舉重重呉越浙江潮刺史何門始得消五字州人唯有此四鄰風景合相饒橘村籬落香潛度竹寺虛空翠自飄君去九衢須説我病成疎懶嬾趨朝送僧貞實歸杭州天竺石橋寺裏最清凉聞説茆菴寄上方林外猿聲連院磬月中潮色到禪牀他生念我身何在此世唯師性亦忘九陌相逢千里别青山重疊樹蒼蒼送盧二弟茂才罷舉遊洛謁新相踏碎作賦筆驅車出上京離筵俯歧路四坐半公卿守命貧難擲憂身夢數驚今朝赴知巳休詠苦辛行送任畹及第歸蜀中覲親子䂓啼欲死君聴固一作故無愁闕下聲名出鄉中意氣逰東川横劍閤南斗近力州神聖題前字千人看不休送杜觀罷舉東逰秋風離九陌心事豈云安曽是求名苦當知此去難辛勤程自逺寂寞夜多寒詩句無人識應須把劍看送狄兼謩下第歸故山慈恩塔上名昨日敗埀成賃舎應無直居山豈釣聲半年猶小隠數日得閒行映竹窺猨劇尋雲探鶴情愛花髙酒户煮藥汚茶鐺莫便多時住烟霄路在城送源中丞赴新羅赤墀賜對使殊方官重霜臺紫綬光玉節在船清海怪金函開詔拜夷王雲晴漸覺山川異風便那一作寧知道路長誰得似君將雨露海東萬里灑扶桑送陳倜一作稠赴江陵從事荆州勝事衆皆聞幕下今朝又得君才子何須藉一作中科第男兒終久要功勲江村竹樹多扵草山路塵埃半是雲新什定知饒景思不應一向賦從軍送張郎中副使赴澤潞曉陌事戎裝風流粉署郎機籌一作權通變化除拜出尋常地冷饒霜氣山髙礙雁行應無離别恨車馬自生光送陸暢侍御歸揚州故園偏接近霅水洞庭邊歸去知何日相逢各長年山川南北路風雪别離天楚色窮冬燒淮聲獨夜船從軍丞相府談笑酒杯前送韋瑶校書赴越寄家臨禹穴乘傳出秦闗霜落橘滿地潮来帆近山相門賓益貴水國事多閒晨省髙堂後餘歡杯酒間送雍陶及第歸覲獻親冬集書比橘復何如此去關山逺相思笑語疎路尋丹一作青壑㫁人近白雲居幽石題名處憑君亦紀一作記余送李秀才赴舉羅刹樓頭醉送君西入京秦呉無限地山水半分程海上烟霞濕關中日月明登科舊鄉里當為改嘉名送李傳秀才歸宣州謝守青山宅山孤宅亦平池塘無復見春草野中生常日登樓望今朝送客行慇懃拂石壁為我一書名送元緒上人遊商州萬法空門裏師修歴㡬生過來心巳悟未到行彌精溪寂鐘還度林昏錫獨鳴朝簪抽未得此别豈忘情送僧栖真歸杭州天竺寺吏事日紛然無因到佛前勞師相借問知我亦通禪古寺杉松出殘陽鐘磬連草菴盤石上歸此是因緣送敬法師歸福州結得隨緣伴蟬鳴方出關新經譯舊寺故國與誰還齋為無鐘早心因罷講閒東南數千里何處不逢山送清敬闍梨歸浙西大地無生理呉中豈是歸自翻貝葉偈人施福田衣夏盡灘聲出潮來日色㣲郡齋師去後寂寞夜吟稀送賈島及鍾渾日日攻詩亦自彊年年供應在名塲春風驛路歸何處紫閣山邊是草堂送僧遊邊師向邊頭去邊人業障輕腥羶齋自潔部落講還成傳教多離寺隨緣不計程三千世界内何處是無生送澄江上人赴興元鄭尚書招師經非紙上師佛在心中覺路何曽異行人自不同水雲晴亦一作忽雨山木一作舎夜多風聞結西方社尚書待逺公送馬戴下第客逰昨来送君處亦是九衢中此日慇懃别前時寂寞同鳥啼寒食雨花落暮春風向晩離人起筵収罇未空送薛二十三郎中赴婺州我住浙江西君去浙江東日日心來徃不畏浙江風送獨孤煥評事赴豐州東門擕酒送廷評結束從軍塞上行深磧路移唯馬覺斷蓬風起與鵰平烟生逺戍侵雲色冰疊黄河長雪聲須鑿燕然山上石登科記裏是閒名送張齊物主簿赴内鄉㡬年山下事仙翁名在長生籙籍中燒得藥成須寄我曽為主簿與君同送王嗣之典儀城日日思朝位偷閒城外行唯求採藥者一作法不道在官名一作行好異嫌山淺尋幽喜逕生病来文字拙不要把歸城别賈島懶作住山人貧家日賃身書多筆漸重睡少枕長新野客狂無過詩仙瘦始真秋風千里去誰與我相親一作官家月賃身别李餘病童隨瘦馬難算徃來程野寺僧相送河橋酒滯行足愁無道性久客㑹人情何計覊窮盡同居不出城别胡逸記得春闈同席試逡巡何啻十年餘今日相逢又相送予乘五馬子單車惜别酒闌歌罷更遲留擕手思量凭翠樓桃李容華猶歎月風流才器亦悲秋光隂不覺朝昬過岐路無窮早晩休似把剪刀裁别恨两人分得一般愁欲别山川重疊逺茫茫欲别先憂别恨長紅芍藥花雖共醉緑蘼蕪影又分將鴛鴦有路髙低去鴻雁南飛一两行惆悵與君烟景迥不知何日到瀟湘别杭州醉與江濤别江濤惜我遊他年婚嫁了終到此江頭姚少監詩集巻二欽定四庫全書姚少監詩集巻三唐姚合撰寄贈上
