body:
  text: 祕書少監杭州刺史姚合第一卷送別上五十首送狄尚書鎮太原送楊尚書祭西嶽送李侍御過夏州送李起居赴池州送劉詹事赴夀州送裴大夫赴亳州送韋僅行軍送劉禹錫赴蘇州二首送賈謨赴共城送裴宰君送顧非熊歸越送雍陶遊蜀送崔約歸揚州送李侍御赴行營送楊尚書赴東川送邢郎中赴太原送裴中丞赴華州送徐貟外赴河中送殷侍御赴同州送崔中丞赴鄭州送丁端公赴河隂送鄭尚書赴興元送田使君赴蔡州送無可上人遊邊送僧送宗愼言送家兄赴任送崔玄亮赴果州送喻校書歸毗陵送董正字歸常州送蕭正字往蔡州送田卓入華山送薛右司赴處州送王建往渭南送殷侍御遊山南送李植侍御送王淡送崔之仁送孫山人送費驤送楊少府送文著上人遊越送無可上人遊越送洛陽張貟外送田中丞入西蕃送王龜送崔郎中赴常州送林使君赴邵州送別友人第二卷送別下四十三首送張宗原送王求送朱餘慶及第歸送朱慶餘歸覲送任尊師歸蜀送友人遊蜀送杜立歸蜀送韓湘赴江西從事送潘傅歸宣州送僧默然送陟遐上人送盛秀才赴舉送僧貞實歸杭州送盧二弟送任畹及第歸送杜觀送狄兼譽歸故山送源中丞赴新羅別李餘別胡逸惜別欲別別杭州送王玄伯第三卷寄贈上四十七首寄賈島寄王度居士寄楊茂卿校書寄杜師義寄李景先寄酬盧侍御寄主客張郎中寄李廓少府寄紫閣隱者寄楊巨源祭酒寄殷堯藩寄兩省閣老寄靈一律師寄默然上人寄張傒寄李頻寄李群玉病中書事寄友人九日寄錢可復寄劉起居秋日寄李支使寄令狐楚相公寄東都白賔客寄裴起居寄狄拾遺寄山中舊友寄無名頭陀寄郁上人寄孫路秀才寄安陸友人寄馬戴寄賈司倉寄楊工部寄陜州王司馬寄賈島寄崔之仁山人寄嵩嶽程光範洛下夜會寄賈島寄華州李中丞寄朱諌議寄杭州崔貟外寄元緒上人寄白閣默然寄丘元處士寄崔道士寄華州崔中丞寄祕書竇少監第四卷寄贈下四十四首寄送盧栱祕書寄院中諸曹長書懷寄友人寄無可上人寄暉上人寄李干寄賈島浪仙寄九華費拾遺寄不疑上人寄主客劉郎中寄周十七起居秋夜寄默然上人寄王玄伯寄山中友人寄內兄郭端公寄蔣亭兼簡田使君山居寄友生寄崔之仁山人寄主客劉貟外山中寄友人西園夜宿寄友人卧疾寄李餘寄白石師寄賈島寄默然上人寄不出院僧寄皇甫甸寄舊山隱者寄李廓贈盧大夫將軍贈供奉僧次融贈王尊師贈常州院僧贈盧沙彌小師贈張籍太祝贈丘郎中贈王建司馬贈任士曹贈劉義贈僧紹明贈張質山人贈少室山麻襦僧贈王山人贈終南山傅山人第五卷間適五十一首間居遣懷十首武功縣中三十首罷武功縣二首秋日間居二首晚憂間居間居街西居三首間居遣興間居第六卷間適時序風月六十二首莊居即事親仁里居莊居野行春日間居獨居早春間居原上新居將歸山山中述懷偶然書懷客舍有懷及第後夜中書事偶題感時憶山客遊旅懷迎春遊春十二首賞春春日即事春日江次揚州春詞三首寒食書事二首暮春書事別春夏夜春晚而中送春秋日有懷秋夕遣懷秋中夜坐同崔卿九月六日飲九日憶硯山舊居秋晚江次除夜二首晦日送窮三首詠雲詠雪郡中對雪對月八月十五夜看月賦月華臨靜夜酬任疇雨中見寄和座主相公雨中作惡神行雨第七卷題詠四十九首題鳯翔西郭新亭題金州西園九首江榭垣竹藥堂石庭草閣莓苔松壇菱土鬯匕徑芭蕉屏杏溪十首杏溪蓮塘望江峯杏水架水藤渚上竹石潭溪路楓林堰石瀨陜下厲玄侍御宅五題濯纓溪竹裏徑垂釣亭泛觴泉吟詩島題僧院引泉題家園新池詠盆池買太湖石天笁寺殿前立石杭州觀潮題李頻新居寄題縱上人院題山寺題貞女祠題馬貟外新居題郭侍郎幽居題宣義池亭題薛十二池亭題崔駙馬林亭題杭州南亭題鄭駙馬林亭題厲玄侍御所居題田將軍宅題崔駙馬宅題河上亭題長安薛貟外水閣題梁園公主池亭寄題尉遲少卿郊居第八卷遊覽宴集五十首過張邯鄲莊過楊處士幽居過李處士山居過無可僧院放朝同遊曲江曉望華清宫夏日登樓晚望霽後登樓早夏郡樓宴集夜宴太僕田卿宅春日會崔少卿宅軍城夜會晦日燕劉録事宅宴光祿田卿宅會將作崔監東園同會太府韓卿宅乞酒寄衛拾遺乞酒乞新茶西掖寓直春曉聞殘屚杭州郡齋南亭郡中西園杭州官舍偶書省直書事杭州官舍即事假日書事呈院中司徒書縣丞舊廳縣中秋宿夏夜宿江驛陜城即事第九卷和答酬謝五十七首和令狐留守相公和髙諌議入翰苑和盧給事酬裴貟外和裴端公早朝和李相餞西蜀相公和座主相公秋日即事和崔少監遊僧院和李紳不赴看花和李舍人冬至日和裴令公新成緑野堂即事和題李相草堂和鄭相唱和詩和戶部侍郎省中曉歸和元八郎中秋居和酬白少傅見寄和劉禹錫拜表懷都故人和酬殷侍御見寄和李膳部秋夕和韓侍郎夜泛溪和題李中丞廳和厲玄無可會宿見寄和令狐貟外直夜即事和孟侍御早朝見寄和友人新居園上和裴令公遊南莊和李舍人言懷和李舍人對雪答李頻秀才答胡遇答友人招遊答竇知言酬田就酬李貟外見寄酬令狐郎中見寄酬李廓望月見寄酬田卿末伏見寄酬薛奉常見贈之什酬盧汀諌議酬張郎中見寄酬田卿六韻見寄酬楊尚書喜移居酬田卿即事見寄酬張籍司業見寄謝田大夫寄茸氊葡萄謝李太尉牧杭州杏園宴上謝座主謝韜光上人謝秦校書無可上人見訪喜胡遇至喜賈島至喜喻鳬至喜雍陶秋夜訪宿喜賈島雨中訪宿喜馬戴見過同前訪僧法通不遇夜期友生不至尋僧不遇第十卷花木鳥獸器用哀挽雜詠五十七首和李輔闕看蓮花和王郎中召看牡丹詠南池嘉蓮題葡萄架闕種葦採松花詠新菊楊栁枝詞五首郡中冬夜聞蛩聞新蟬寄李餘聞蟬寄賈島題鶴雛詠鶯老馬詠鏡詠破屏風古碑拾得古硯裴大夫見過謝贈百齡藤杖詠貴遊窮邊詞二首劍器詞三首從軍樂二首敬宗皇帝挽詞三首文宗皇帝挽詞三首莊恪太子挽詞二首哭費拾遺徴君哭硯山孫道士哭賈島二首和楊給事哭愛姬喜覽盧侍御詩卷喜覽裴中丞詩卷心懷霜聽僧雲端講經臘日獵聞魏州賊破下第得舍弟書病僧成名後留別從兄佛舍見胡子有嘲歸弊居寄李太尉姚少監詩集目録終
