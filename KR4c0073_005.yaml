front:
  text: 姚少監詩集卷第五
  hash: sha256:7c654d4c20ff8022b4ec649f2b3c499531da32c0164b91d68a70c71bac46596b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0073_SBCK_005-1a}
body:
  text: 間適上五十一首間居遣懷一十首身外無徭役開門百事間倚松聽唳鶴策杖望秋山萍任蓮池緑苔從匝地斑料無車馬客何必掃柴關其二間卧銷長日親朋笑我踈詩篇隨分有人事度年無情性僻難改愁懷酒為除誰能思此計空備滿床書其三白日逍遙過看山復繞池展書尋古事翻卷改新詩賖酒風前酌留僧竹裏棊同人笑相問羡我足間時其四好景時牽目茅齋興有餘逺山經雨後庭樹得秋初道侣憐栽藥髙人笑養魚優遊隨本性甘被棄慵踈其五永日厨煙絶何曾暫廢吟間詩隨思緝小酒恣情斟看月嫌松密垂綸愛水深世間多少事無事可關心其六一生能幾日愁恨也無端遇酒酕醄飲逢花爛熳看青雲非失路白髮未相干以此多携解將心但自寬其七萬事徒紛擾難關枕上身朗吟銷白日沉醉度青春演步憐山近間眠厭客頻市朝曾不到長免滿衣塵其八野性多踈惰幽棲更稱情獨行看影笑間坐弄琴聲懶拜腰肢硬慵趨禮樂生業文隨日遣不是為求名其九生計甘寥落髙名愧自由慣無身外事不信世間愁好酒盈杯酌間詩任筆酬涼風從入户雲水更宜秋其十拙直難和洽從人笑掩關不能行戶外寧解走塵間𬒳酒長酣思無愁可上顔何言歸去事著處是青山武功縣中作三十首縣去帝城逺為官與隱齊馬隨山鹿放雞雜野禽棲繞舍惟藤架侵階是藥畦更師嵇叔夜不擬作書題其二方拙天然性為官是事踈唯尋向山路不寄入城書因病多一作方收藥緣浪學釣魚養身成好事此外更一作空虛其三微官如馬足秪是在泥塵到處貧隨我終年老趂人簿書銷眼力杯酒耗心神早作歸休計深居養一作過此身其四簿書多不會薄俸亦難消醉卧慵開眼間行懶繫腰移花兼蝶至買石得雲饒且自心中樂從他笑寂寥其五曉鐘驚睡覺事一作是事便相關小市柴薪貴貧家砧杵間讀書多旋忘賖酒數空還長羡劉伶輩髙眠出世間其六性踈常愛卧親故笑悠悠縱出多携枕因衙始裹頭上山方覺老過寺暫忘愁三考千餘日低腰不擬休其七客至皆相笑詩書滿卧床愛間求病假因醉棄官方鬢髮寒唯短衣衫瘦漸長自嫌多檢束不似舊來狂其八一日看除目終年損道心山宜衝雪上詩好帶風吟野客嫌知印家人笑買琴只應隨分過巳一作定是錯彌深其九鄰里皆相愛門開數見過秋涼送客逺夜靜詠詩多就架題書目尋欄記藥窠到官無別事種得滿庭莎其十窮逹天應與人間事莫論微官從似客逺縣豈勝村竟日多無食連宵不閉門齋心調筆硯唯寫五千言其十一縣僻仍牢落逰人到便回路當邊地去村入郭門來酒戶愁偏長詩情病不開可曾衙小吏恐謂踏青苔其十二自下青山路三年著緑衣官卑食肉僣才短事人非野客教長醉髙僧勸却歸不知何計是免與本心違其十三日出方能起庭前看種莎吏來山鳥散酒􅍄野人過歧路荒城少煙霞逺縣多同官數相引下馬上西坡其十四作吏荒城裏窮愁欲不勝病多唯識藥年老漸親僧夢覺空堂月詩成滿硯氷故人多得路寂寞不相稱其十五誰念東山客栖栖守印床何年得事盡終日逐人忙醉卧唯知呌間書不著行人間長檢束與此豈相當其十六朝朝眉不展多病怕逢迎引水逺通澗壘山髙過城秋燈照樹色寒雨落池聲好是吟詩夜披衣坐到明其十七簿籍誰能問風寒趂早眠每旬常乞假隔月探支錢一作請官錢還往嫌詩僻親情怪酒顛謀身須上計終久是歸田其十八閉門風雨裏落葉與階齊野客嫌杯小山翁喜枕低聽琴知道性尋藥得詩題誰更能騎馬間行秪杖藜其十九腥羶都不食稍稍覺神清夜犬因風吠鄰雞帶雨鳴守官常卧病學道別稱名小有洞中路誰能引我行其二十宦名渾不計酒熟且開封晴月消燈色寒天挫筆鋒驚禽時並起間客數相逢舊國蕭條思青山隔幾重其二十一假日多無事誰知我獨忙移山入縣宅種竹上城墻驚蝶遺花蘂遊蜂帶蜜香唯愁明早出端坐吏人旁其二十二門外青山路因循自不歸養生冝縣僻説品喜官微淨愛山僧飯間披野客衣唯幽谷鳥不解入城飛其二十三一官無限日愁悶欲何如掃舍驚巢燕尋方落壁魚從僧乞淨水憑客報間書白髮誰能鑷年來四十餘其二十四朝朝門不閉長似在山時賔旅抽書讀兒童斫竹騎久貧還易老多病懶能醫道友應相怪休官日巳遲其二十五戚戚常無思循資格上官間人得事晚常骨覔一作學仙難愁卧疑身病貧居覺道寬新詩久不寫自算少人看其二十六漫作容身計今知拙有餘青衫迎驛使白髮憶山居道友憐𬞞食吏人嫌草書須為長久事歸去自耕鋤憐一作喜其二十七主印三年坐山家百事休焚香開勑庫踏月上城樓飲酒多成一作如病吟詩易長愁殷勤問漁者暫借手中鈎其二十八長憶青山下深居遂性情壘階溪石淨燒竹竈煙輕點筆圖雲勢彈琴學鳥聲一作鳴今朝知縣印夢裏百憂生其二十九自知狂僻性吏事固相踈秪是看山立無因出縣居印朱沾墨硯戶籍雜經書月俸尋常請無妨乏斗儲一作無嫌其三十作吏無能事為文舊致功詩標八病外心落百憂中拜別登朝客歸依錬藥翁不知還往內誰與此心同罷武功縣將入城二首乍拋衫笏覺身輕依舊還稱學道名欲泥山僧分一作求屋住羞從野老借牛耕妻兒盡怕為逋客親故相邀遣到城無奈同官珍重意幾回臨路却休行其二青衫脫下便狂歌種薤一作李栽莎一作桃斸古坡野客相逢添酒病春山暫上著詩魔亦知官罷貧還甚且喜間來睡得多欲與九衢親故別明朝拄杖始經過秋日間居二首九陌宅重重何門憐此翁荒庭唯菊茂幽徑與山通落葉帶衣上間雲來酒中此心誰得見林下鹿應同其二先憶花時節家山聽更歸愛詩看古集憶酒典寒衣睡少身還健愁多食不肥自憐踈懶性無事出門稀間居晚夏間居無事擾舊病亦多痊選字詩中老看山屋外眠片霞侵落日繁葉咽鳴蟬對此心還樂誰知乏酒錢間居不自識踈鄙終年住在城過門無馬迹滿宅是蟬聲帶病吟雖苦休官夢巳清何當學禪觀依止古先生街西居三首受得山野性住城多事違青山在宅南回首東西稀淺淺一井泉數家同汲之獨我惡水濁鑿井庭之陲自鑿還自飲亦為衆所非吁嗟世間事潔身誠難為其二日出窮巷喜溫然勝重衣重衣豈不暖所暖人不齊兀兀復行行不離階與墀其三丈夫非馬蹄安得知路歧窮賤飱茹薄興與養性宜乃知長生術豪貴難得之間居遣興終年城裏住門戶似山林客怪身名晚妻嫌酒病深寫方多識藥失譜廢彈琴文字非經濟空虛用破心姚少監詩集卷第五
